<!DOCTYPE html>
<html lang="en">
<head>
<title>Blood Releasing</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f5f7;}
header{background:#c62828;color:#fff;text-align:center;padding:16px 15px;}
header h2{margin:0;font-size:24px;letter-spacing:.5px;}
header p{margin:4px 0 0;font-size:13px;opacity:.9;}

.container{max-width:560px;margin:28px auto;background:#fff;padding:22px;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.1);}

/* big tiles - easy to tap on a phone */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  min-height:112px;padding:14px 8px;margin:0;
  border:none;border-radius:12px;color:#fff;
  font-size:14px;font-weight:700;letter-spacing:.4px;cursor:pointer;
  transition:transform .15s ease, opacity .15s ease;
}
.tile .ic{font-size:30px;line-height:1;}
.tile small{font-weight:400;font-size:11px;opacity:.9;letter-spacing:0;}
.tile:hover{transform:translateY(-2px);opacity:.96;}
.tile:active{transform:scale(.98);}

.entry   {background:#c62828;}
.tracking{background:#1565c0;}
.posted  {background:#4527a0;}
.stats   {background:#00897b;}
.facility{background:#2e7d32;}
.settings{background:#6a1b9a;}
.wide{grid-column:1 / -1;}
.back{background:#455a64;min-height:54px;flex-direction:row;}

#loadingScreen{position:fixed;inset:0;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999;}
.loaderBox{background:#fff;border-radius:12px;padding:24px 30px;box-shadow:0 4px 18px rgba(0,0,0,.12);text-align:center;min-width:240px;}
.spinner{width:42px;height:42px;border:4px solid #ffcdd2;border-top:4px solid #c62828;border-radius:50%;margin:0 auto 14px;animation:spin 1s linear infinite;}
.loadingText{font-size:15px;color:#444;font-weight:bold;}
@keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
.hidden{display:none !important;}

@media (max-width:600px){
  .container{margin:12px;padding:14px;}
  header h2{font-size:20px;}
  .tile{min-height:104px;}
}
</style>
<meta name="theme-color" content="#c62828">
<link rel="stylesheet" href="prc-theme.css">
</head>

<body>

<div id="loadingScreen">
    <div class="loaderBox">
        <div class="spinner"></div>
        <div class="loadingText">Checking access...</div>
    </div>
</div>

<header>
    <h2>Blood Releasing Module</h2>
    <p>Philippine Red Cross &ndash; Blood Services</p>
</header>

<div class="container hidden" id="mainContainer">
    <div class="tiles">
        <button class="tile entry" onclick="goEntry()"><span class="ic">&#9999;&#65039;</span>ENTRY<small>new release / augmentation</small></button>
        <button class="tile tracking" onclick="goTracking()"><span class="ic">&#128203;</span>TRACKING<small>records &amp; payments</small></button>
        <button class="tile posted" onclick="goPosted()"><span class="ic">&#128196;</span>POSTED DOCUMENTS<small>statements of account</small></button>
        <button class="tile stats" onclick="goStats()"><span class="ic">&#128202;</span>STATISTICS<small>reports &amp; totals</small></button>
        <button class="tile facility" onclick="goFacility()"><span class="ic">&#127973;</span>FACILITY MANAGER<small>hospitals</small></button>
        <button class="tile settings" onclick="goSettings()"><span class="ic">&#9881;&#65039;</span>SETTINGS<small>prices &amp; options</small></button>
        <button class="tile back wide" onclick="goBack()">&#8592; BACK TO DASHBOARD</button>
    </div>
</div>

<script>
var firebaseConfig = {
    apiKey: "AIzaSyByh0YJ11ZpbRV7EoDoLnqgFxe1r68efPI",
    authDomain: "galloners-club.firebaseapp.com",
    databaseURL: "https://galloners-club-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "galloners-club",
    storageBucket: "galloners-club.appspot.com",
    messagingSenderId: "213049860421",
    appId: "1:213049860421:web:4156aaa52b945f48711e2c",
    measurementId: "G-XYXJH9JNXJ"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

var auth = firebase.auth();
var db = firebase.database();

var loadingScreen = document.getElementById("loadingScreen");
var mainContainer = document.getElementById("mainContainer");

function showMainContent(){
    loadingScreen.classList.add("hidden");
    mainContainer.classList.remove("hidden");
}

function denyAccess(){
    alert("Access denied.");
    window.location.href = "dashboard.html";
}

auth.onAuthStateChanged(function(user){
    if(!user){
        window.location.href = "index.html";
        return;
    }

    db.ref("userRoles/" + user.uid + "/role").once("value")
        .then(function(snapshot){
            var role = snapshot.exists() ? snapshot.val() : null;

            /* 
               FIX:
               Before, missing role = limitedEncoder automatically.
               Now, only explicitly saved limitedEncoder is blocked.
            */
            if(role === "limitedEncoder"){
                denyAccess();
                return;
            }

            showMainContent();
        })
        .catch(function(error){
            console.error("Role check error:", error);

            /* 
               Fail-safe:
               If role checking fails, still allow page to load
               so authorized users are not blocked unnecessarily.
            */
            showMainContent();
        });
});

function goEntry(){
    window.location.href = "releasing-entry.html";
}

function goTracking(){
    window.location.href = "releasing-tracking.html";
}

function goStats(){
    window.location.href = "releasing-statistics.html";
}

function goFacility(){
    window.location.href = "facility-manager.html";
}

function goPosted(){
    window.location.href = "posted-documents.html";
}

function goSettings(){
    window.location.href = "releasing-settings.html";
}

function goBack(){
    window.location.href = "dashboard.html";
}
</script>

<script src="prc-nav.js"></script>
</body>
</html>
