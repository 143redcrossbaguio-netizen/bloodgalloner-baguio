<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b30000">
<title>Galloners Club - Awardees</title>

<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>

<link rel="stylesheet" href="club-theme.css">
<script src="club-common.js"></script>

<style>
.toolbar{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px;}
.toolbar .club-input,.toolbar .club-select{padding:10px 12px;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.summary{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 10px;font-size:13px;color:var(--muted);font-weight:600;}
.summary .count{display:inline-flex;align-items:center;gap:6px;background:#f4f6f9;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink);}
.summary .grow{flex:1;}
.blood-icon{width:20px;height:20px;vertical-align:middle;}
.nm{font-weight:700;text-align:left;}
.nm small{display:block;font-weight:500;color:var(--muted);margin-top:2px;}
.cell-stack{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:132px;}
.cell-stack select,.cell-stack input{width:100%;padding:8px 8px;font:inherit;font-size:14px;border:1px solid #c4cdd7;border-radius:8px;background:#fff;color:var(--ink);min-height:38px;}
.cell-stack select:focus,.cell-stack input:focus{outline:none;border-color:var(--action);box-shadow:0 0 0 3px rgba(15,82,186,.16);}
.cell-stack select:disabled,.cell-stack input:disabled{background:#f1f3f6;color:#98a2b3;}
.st{display:inline-block;min-width:78px;font-size:12px;font-weight:700;color:var(--muted);}
.st.saving{color:var(--action);} .st.saved{color:var(--ok);} .st.err{color:var(--danger);}
.state{padding:34px 12px;text-align:center;color:var(--muted);font-weight:600;}
.more{display:flex;justify-content:center;margin-top:14px;}
#printArea{display:none;}

/* tablets: keep the table, let it slide sideways if needed */
@media (max-width:980px){ .toolbar{grid-template-columns:1fr 1fr;} .toolbar .search{grid-column:1 / -1;} }

/* phones + portrait tablets: every donor becomes a card, nothing is cut off or hidden off-screen */
@media (max-width:900px){
  .club-scroll{border:none;background:transparent;overflow:visible;}
  table.stack,table.stack tbody{display:block;width:100%;}
  table.stack thead{display:none;}
  table.stack tr{display:block;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:8px 12px;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.05);}
  table.stack tr:nth-child(even),table.stack tr:hover{background:#fff;}
  table.stack td{display:flex;gap:12px;align-items:center;justify-content:space-between;text-align:right;border:none;padding:7px 0;}
  table.stack td::before{content:attr(data-label);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;text-align:left;flex:0 0 5.4em;}
  table.stack td.nm{display:block;text-align:left;font-size:16px;padding-top:4px;border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:8px;}
  table.stack td.nm::before{display:none;}
  table.stack td.nm small{display:inline;margin-left:8px;}
  table.stack td.numcell{display:none;}
  table.stack tr{position:relative;}
  table.stack td[data-label="Saved?"]{position:absolute;top:8px;right:12px;padding:0;display:block;}
  table.stack td[data-label="Saved?"]::before{display:none;}
  table.stack td.nm{padding-right:84px;}
  table.stack td.cellwrap{align-items:flex-start;}
  .cell-stack{flex:1;min-width:0;max-width:62%;}
  .toolbar{grid-template-columns:1fr 1fr;gap:8px;}
  .toolbar .search,.toolbar #statusFilter{grid-column:1 / -1;}
  .actions .btn{flex:1 1 46%;}
}

@media (min-width:721px) and (max-width:900px){
  table.stack tbody{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  table.stack tr{margin:0 !important;}
}

@media print{
  body > *:not(#printArea){display:none !important;}
  #printArea{display:block !important;color:#000;font-family:Arial,sans-serif;}
  #printArea h1{font-size:20px;margin:0 0 4px;} #printArea h2{font-size:15px;margin:18px 0 6px;} #printArea p{margin:0 0 8px;font-size:12px;}
  #printArea table{width:100%;border-collapse:collapse;font-size:12px;page-break-inside:auto;}
  #printArea th,#printArea td{border:1px solid #777;padding:4px 6px;text-align:left;}
  #printArea th{background:#eee;}
  #printArea tr{page-break-inside:avoid;}
}
</style>
</head>

<body>

<header class="club-header">
  <img src="images/logo.png" class="logo" alt="" onerror="this.style.display='none'">
  <h1>Awardees Monitoring</h1>
</header>

<main class="club-wrap" style="max-width:1200px;">
  <section class="club-card">

    <div class="toolbar">
      <input class="club-input search" type="search" id="searchInput" placeholder="Search name or contact..." autocomplete="off" aria-label="Search donor">
      <select class="club-select" id="bloodFilter" aria-label="Blood type">
        <option value="">All Blood Types</option>
        <option value="A+">A+</option><option value="A-">A-</option>
        <option value="B+">B+</option><option value="B-">B-</option>
        <option value="AB+">AB+</option><option value="AB-">AB-</option>
        <option value="O+">O+</option><option value="O-">O-</option>
      </select>
      <select class="club-select" id="levelFilter" aria-label="Category">
        <option value="eligible">Eligible only</option>
        <option value="galloner">Galloner</option>
        <option value="bronze">Bronze</option>
        <option value="silver">Silver</option>
        <option value="gold">Gold</option>
        <option value="none">No badge yet</option>
        <option value="all">All donors</option>
      </select>
      <select class="club-select" id="statusFilter" aria-label="Status">
        <option value="">All Status</option>
        <option value="awarded">Awarded</option>
        <option value="notawarded">Not Awarded</option>
        <option value="claimed">Claimed</option>
        <option value="unclaimed">Awarded, not yet claimed</option>
      </select>
    </div>

    <div class="actions">
      <button class="btn btn-primary btn-sm" id="exportBtn" type="button">Export CSV</button>
      <button class="btn btn-action btn-sm" id="printBtn" type="button">Print All Categories</button>
      <button class="btn btn-ghost btn-sm" id="reloadBtn" type="button">Reload</button>
      <button class="btn btn-ghost btn-sm only-standalone" id="dashBtn" type="button">Return to Dashboard</button>
    </div>

    <div class="summary" id="summary" aria-live="polite"></div>

    <div class="club-scroll">
      <table class="club-table stack">
        <thead>
          <tr>
            <th>#</th><th>Name</th><th>Badge</th><th>Blood Type</th><th>Donations</th>
            <th>Awarded</th><th>Claimed</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="donorTable"><tr><td colspan="8" class="state">Loading donors...</td></tr></tbody>
      </table>
    </div>

    <div class="more"><button class="btn btn-ghost" id="moreBtn" type="button" hidden>Show more</button></div>
  </section>
</main>

<div id="printArea"></div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyByh0YJ11ZpbRV7EoDoLnqgFxe1r68efPI",
  authDomain: "galloners-club.firebaseapp.com",
  projectId: "galloners-club",
  storageBucket: "galloners-club.firebasestorage.app",
  messagingSenderId: "213049860421",
  appId: "1:213049860421:web:4156aaa52b945f48711e2c"
};
if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
var auth = firebase.auth();
var db = firebase.firestore();

var esc = ClubCommon.esc;
var PAGE = 50;

var limits = ClubCommon.cachedLimits();
var items = [];        // every donor, normalised
var byId = {};
var filtered = [];     // after search + filters
var shown = PAGE;      // how many rows are drawn right now

function $(id) { return document.getElementById(id); }

/* ------------------------------------------------------------------ */
/* data                                                                */
/* ------------------------------------------------------------------ */
function str(v) { return String(v == null ? "" : v).trim(); }

function normalizeDonor(id, d) {
  var serialsLen = Array.isArray(d.serials) ? d.serials.length : 0;
  var count = typeof d.cachedSmartCount === "number" ? d.cachedSmartCount : serialsLen;   // same count Tracking uses
  if (serialsLen > count) count = serialsLen;

  // Award fields. Older versions of this page saved awardStatus as an object
  // ({awarded, awardDate, claimed, claimDate}); newer pages save it as text. Understand both.
  var awardStatus = "NOT AWARDED", awardDate = str(d.awardDate), claimStatus = str(d.claimStatus).toUpperCase(), claimDate = str(d.claimDate);
  if (d.awardStatus && typeof d.awardStatus === "object") {
    var o = d.awardStatus;
    awardStatus = str(o.awarded).toLowerCase() === "awarded" ? "AWARDED" : "NOT AWARDED";
    awardDate = str(o.awardDate) || awardDate;
    var c = str(o.claimed).toLowerCase();
    claimStatus = c === "claimed" ? "CLAIMED" : (c === "unclaimed" ? "UNCLAIMED" : claimStatus);
    claimDate = str(o.claimDate) || claimDate;
  } else {
    awardStatus = str(d.awardStatus).toUpperCase() === "AWARDED" ? "AWARDED" : "NOT AWARDED";
  }
  if (awardStatus !== "AWARDED") { claimStatus = ""; claimDate = ""; }
  if (claimStatus !== "CLAIMED" && claimStatus !== "UNCLAIMED") claimStatus = "";

  var bt = str(d.bloodType).toUpperCase(), rh = str(d.rhFactor);
  var first = str(d.firstName || d.firstname), middle = str(d.middleName || d.middlename), sur = str(d.surname || d.lastName || d.lastname);
  var name = [first, middle, sur].filter(Boolean).join(" ");

  return {
    id: id, name: name, surname: sur, first: first, middle: middle,
    bt: bt, rh: rh, blood: bt + rh, contact: str(d.contact || d.contactNumber),
    count: count, level: ClubCommon.levelFor(count, limits),
    awardStatus: awardStatus, awardDate: awardDate, yearAwarded: str(d.yearAwarded),
    claimStatus: claimStatus, claimDate: claimDate,
    legacy: !!(d.awardStatus && typeof d.awardStatus === "object"),
    _search: (name + " " + str(d.contact || d.contactNumber) + " " + bt + rh).toLowerCase()
  };
}

function relevel() { items.forEach(function (it) { it.level = ClubCommon.levelFor(it.count, limits); }); }

async function loadAll() {
  $("donorTable").innerHTML = '<tr><td colspan="8" class="state">Loading donors...</td></tr>';
  $("summary").textContent = "";
  $("moreBtn").hidden = true;
  try {
    limits = await ClubCommon.loadLimits(db);
    var snap = await db.collection("donors").get();
    items = []; byId = {};
    snap.forEach(function (doc) {
      var it = normalizeDonor(doc.id, doc.data() || {});
      items.push(it); byId[it.id] = it;
    });
    applyFilters(true);
  } catch (err) {
    console.error("Fetch donors error:", err);
    $("donorTable").innerHTML = '<tr><td colspan="8" class="state" style="color:var(--danger)">Failed to load donors: ' + esc(err.message || err) +
      '<br><br><button class="btn btn-primary btn-sm" type="button" onclick="loadAll()">Try again</button></td></tr>';
  }
}

/* ------------------------------------------------------------------ */
/* filtering + drawing                                                 */
/* ------------------------------------------------------------------ */
function matches(it) {
  var level = $("levelFilter").value;
  if (level === "eligible" && it.level === "none" && it.awardStatus !== "AWARDED") return false;   // an awarded donor never disappears
  if (["galloner", "bronze", "silver", "gold", "none"].indexOf(level) > -1 && it.level !== level) return false;

  var bf = $("bloodFilter").value;
  if (bf && it.blood !== bf) return false;

  var sf = $("statusFilter").value;
  if (sf === "awarded" && it.awardStatus !== "AWARDED") return false;
  if (sf === "notawarded" && it.awardStatus === "AWARDED") return false;
  if (sf === "claimed" && it.claimStatus !== "CLAIMED") return false;
  if (sf === "unclaimed" && !(it.awardStatus === "AWARDED" && it.claimStatus !== "CLAIMED")) return false;

  var q = $("searchInput").value.toLowerCase().trim();
  if (q) {
    var words = q.split(/\s+/);
    for (var i = 0; i < words.length; i++) if (it._search.indexOf(words[i]) < 0) return false;
  }
  return true;
}

function applyFilters(resetPaging) {
  if (resetPaging) shown = PAGE;
  filtered = items.filter(matches).sort(function (a, b) {
    return (b.count - a.count) || a.surname.localeCompare(b.surname) || a.first.localeCompare(b.first);
  });
  renderTable();
  renderSummary();
}

function bloodDrop(color, stroke) {
  return '<svg class="blood-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="' + color + '" stroke="' + (stroke || "none") +
    '" stroke-width="1.5" d="M12 2C12 2 5 10 5 14a7 7 0 0014 0C19 10 12 2 12 2z"/></svg>';
}
function bloodIcon(bt, rh) {
  if (rh === "-") return bloodDrop("#a5d6a7");
  if (bt === "A") return bloodDrop("#1e88e5");
  if (bt === "B") return bloodDrop("#ffd600");
  if (bt === "AB") return bloodDrop("#ff80ab");
  if (bt === "O") return bloodDrop("#ffffff", "#000");
  return bloodDrop("#ccc");
}
function badgeHtml(level) {
  return level === "none" ? '<span class="chip chip-muted">NONE YET</span>' : '<span class="chip chip-' + level + '">' + level.toUpperCase() + '</span>';
}

function rowHtml(it, index) {
  var awarded = it.awardStatus === "AWARDED";
  return '<tr data-id="' + esc(it.id) + '">' +
    '<td class="numcell" data-label="#">' + (index + 1) + '</td>' +
    '<td class="nm" data-label="Name">' + esc(it.name || "(no name)") + (it.contact ? '<small>' + esc(it.contact) + '</small>' : '') + '</td>' +
    '<td data-label="Badge">' + badgeHtml(it.level) + '</td>' +
    '<td data-label="Blood">' + bloodIcon(it.bt, it.rh) + ' ' + esc(it.blood) + '</td>' +
    '<td data-label="Donations"><b>' + it.count + '</b></td>' +
    '<td class="cellwrap" data-label="Awarded"><div class="cell-stack">' +
      '<select data-f="award" aria-label="Award status for ' + esc(it.name) + '">' +
        '<option value="NOT AWARDED"' + (awarded ? '' : ' selected') + '>Not Awarded</option>' +
        '<option value="AWARDED"' + (awarded ? ' selected' : '') + '>Awarded</option></select>' +
      '<input type="date" data-f="awardDate" value="' + esc(it.awardDate) + '" aria-label="Date awarded"' + (awarded ? '' : ' disabled') + '>' +
    '</div></td>' +
    '<td class="cellwrap" data-label="Claimed"><div class="cell-stack">' +
      '<select data-f="claim" aria-label="Claim status for ' + esc(it.name) + '"' + (awarded ? '' : ' disabled') + '>' +
        '<option value="">Select</option>' +
        '<option value="CLAIMED"' + (it.claimStatus === "CLAIMED" ? ' selected' : '') + '>Claimed</option>' +
        '<option value="UNCLAIMED"' + (it.claimStatus === "UNCLAIMED" ? ' selected' : '') + '>Unclaimed</option></select>' +
      '<input type="date" data-f="claimDate" value="' + esc(it.claimDate) + '" aria-label="Date claimed"' + (it.claimStatus === "CLAIMED" ? '' : ' disabled') + '>' +
    '</div></td>' +
    '<td data-label="Saved?"><span class="st" data-st></span></td>' +
  '</tr>';
}

function renderTable() {
  var body = $("donorTable");
  if (!filtered.length) {
    body.innerHTML = '<tr><td colspan="8" class="state">No donors match these filters.</td></tr>';
    $("moreBtn").hidden = true;
    return;
  }
  var upto = Math.min(shown, filtered.length), parts = new Array(upto);
  for (var i = 0; i < upto; i++) parts[i] = rowHtml(filtered[i], i);
  body.innerHTML = parts.join("");
  var left = filtered.length - upto;
  $("moreBtn").hidden = left <= 0;
  if (left > 0) $("moreBtn").textContent = "Show more (" + Math.min(PAGE, left) + " of " + left + " remaining)";
}

function renderSummary() {
  var c = { galloner: 0, bronze: 0, silver: 0, gold: 0 }, awarded = 0, claimed = 0;
  items.forEach(function (it) {
    if (c[it.level] !== undefined) c[it.level]++;
    if (it.awardStatus === "AWARDED") awarded++;
    if (it.claimStatus === "CLAIMED") claimed++;
  });
  $("summary").innerHTML =
    '<span class="count">Showing <b>' + Math.min(shown, filtered.length) + '</b> of <b>' + filtered.length + '</b></span>' +
    '<span class="grow"></span>' +
    '<span class="count"><span class="chip chip-galloner">G</span> ' + c.galloner + '</span>' +
    '<span class="count"><span class="chip chip-bronze">B</span> ' + c.bronze + '</span>' +
    '<span class="count"><span class="chip chip-silver">S</span> ' + c.silver + '</span>' +
    '<span class="count"><span class="chip chip-gold">Au</span> ' + c.gold + '</span>' +
    '<span class="count">Awarded <b>' + awarded + '</b></span>' +
    '<span class="count">Claimed <b>' + claimed + '</b></span>';
}

/* ------------------------------------------------------------------ */
/* saving - only the changed fields are written (the old page rewrote  */
/* the whole record, which could wipe out other pages' changes)         */
/* ------------------------------------------------------------------ */
function setState(tr, cls, text) {
  var el = tr && tr.querySelector("[data-st]");
  if (!el) return;
  el.className = "st " + (cls || ""); el.textContent = text || "";
  if (cls === "saved") setTimeout(function () { if (el.textContent === text) { el.textContent = ""; } }, 2500);
}

function redrawRow(tr, it) {
  var idx = filtered.indexOf(it);
  var tmp = document.createElement("tbody");
  tmp.innerHTML = rowHtml(it, idx < 0 ? 0 : idx);
  var fresh = tmp.firstChild;
  tr.parentNode.replaceChild(fresh, tr);
  return fresh;
}

function planChange(it, field, value) {
  var next = { awardStatus: it.awardStatus, awardDate: it.awardDate, yearAwarded: it.yearAwarded, claimStatus: it.claimStatus, claimDate: it.claimDate };
  var today = ClubCommon.todayYMD();
  if (field === "award") {
    next.awardStatus = value === "AWARDED" ? "AWARDED" : "NOT AWARDED";
    if (next.awardStatus === "AWARDED") {
      next.awardDate = next.awardDate || today;
      next.yearAwarded = next.awardDate.slice(0, 4);
    } else {
      next.awardDate = ""; next.yearAwarded = ""; next.claimStatus = ""; next.claimDate = "";   // cannot be claimed if not awarded
    }
  } else if (field === "awardDate") {
    next.awardDate = value;
    next.yearAwarded = value ? value.slice(0, 4) : "";
    if (value) next.awardStatus = "AWARDED";
  } else if (field === "claim") {
    next.claimStatus = value;
    next.claimDate = value === "CLAIMED" ? (next.claimDate || today) : "";
  } else if (field === "claimDate") {
    next.claimDate = value;
    if (value) next.claimStatus = "CLAIMED";
  }
  return next;
}

function saveChange(tr, it, field, value) {
  var prev = { awardStatus: it.awardStatus, awardDate: it.awardDate, yearAwarded: it.yearAwarded, claimStatus: it.claimStatus, claimDate: it.claimDate };
  var next = planChange(it, field, value);
  if (!auth.currentUser) { ClubCommon.gotoLogin(); return; }

  Object.assign(it, next);                       // show the change immediately
  tr = redrawRow(tr, it);
  setState(tr, "saving", "Saving...");

  it._q = (it._q || Promise.resolve()).then(function () {
    return db.collection("donors").doc(it.id).update({
      awardStatus: next.awardStatus,             // always text, which also converts old object-style records
      awardDate: next.awardDate, yearAwarded: next.yearAwarded,
      claimStatus: next.claimStatus, claimDate: next.claimDate
    });
  }).then(function () {
    it.legacy = false;
    var row = document.querySelector('tr[data-id="' + (window.CSS && CSS.escape ? CSS.escape(it.id) : it.id) + '"]');
    setState(row, "saved", "\u2713 Saved");
    renderSummary();
  }).catch(function (err) {
    console.error("Save status error:", err);
    Object.assign(it, prev);                     // put the old values back
    var row = document.querySelector('tr[data-id="' + (window.CSS && CSS.escape ? CSS.escape(it.id) : it.id) + '"]');
    if (row) { row = redrawRow(row, it); setState(row, "err", "\u2715 Not saved"); }
    ClubCommon.toast("Could not save the change for " + (it.name || "this donor") + ": " + (err.message || err), "error");
  });
}

$("donorTable").addEventListener("change", function (e) {
  var el = e.target, f = el.getAttribute && el.getAttribute("data-f");
  if (!f) return;
  var tr = el.closest("tr"), it = tr && byId[tr.getAttribute("data-id")];
  if (!it) return;
  saveChange(tr, it, f, el.value);
});

/* ------------------------------------------------------------------ */
/* export + print                                                      */
/* ------------------------------------------------------------------ */
function exportCsv() {
  if (!auth.currentUser) { ClubCommon.gotoLogin(); return; }
  if (!filtered.length) { ClubCommon.toast("There is nothing to export with the current filters.", "warn"); return; }
  var rows = [["Surname", "First Name", "Middle Name", "Blood Type", "Donations", "Badge", "Award Status", "Award Date", "Year Awarded", "Claim Status", "Claim Date", "Contact"]];
  filtered.forEach(function (it) {
    rows.push([it.surname, it.first, it.middle, it.blood, it.count, it.level === "none" ? "" : it.level.toUpperCase(), it.awardStatus, it.awardDate, it.yearAwarded, it.claimStatus, it.claimDate, it.contact]);
  });
  ClubCommon.download("awardees-" + ClubCommon.todayYMD() + ".csv", ClubCommon.csvFrom(rows), "text/csv");
  ClubCommon.toast("Exported " + filtered.length + " donor" + (filtered.length === 1 ? "" : "s") + ".", "success");
}

function printAllCategories() {
  if (!auth.currentUser) { ClubCommon.gotoLogin(); return; }
  var tiers = [["galloner", "Galloner", limits.galloner, limits.bronze - 1], ["bronze", "Bronze", limits.bronze, limits.silver - 1],
               ["silver", "Silver", limits.silver, limits.gold - 1], ["gold", "Gold", limits.gold, null]];
  var html = "<h1>Awardees Monitoring</h1><p>Printed " + esc(new Date().toLocaleString()) + " &middot; each donor is listed once, under the highest category reached.</p>";
  tiers.forEach(function (t) {
    var list = items.filter(function (it) { return it.level === t[0]; })
      .sort(function (a, b) { return a.surname.localeCompare(b.surname) || a.first.localeCompare(b.first); });
    html += "<h2>" + t[1].toUpperCase() + " (" + t[2] + (t[3] ? "-" + t[3] : "+") + " donations) &mdash; " + list.length + "</h2>";
    if (!list.length) { html += "<p>No donors in this category.</p>"; return; }
    html += "<table><tr><th>#</th><th>Name</th><th>Blood</th><th>Donations</th><th>Awarded</th><th>Claimed</th></tr>";
    list.forEach(function (it, i) {
      html += "<tr><td>" + (i + 1) + "</td><td>" + esc(it.name) + "</td><td>" + esc(it.blood) + "</td><td>" + it.count + "</td><td>" +
        (it.awardStatus === "AWARDED" ? "Yes" + (it.awardDate ? " (" + esc(it.awardDate) + ")" : (it.yearAwarded ? " (" + esc(it.yearAwarded) + ")" : "")) : "No") + "</td><td>" +
        (it.claimStatus === "CLAIMED" ? "Yes" + (it.claimDate ? " (" + esc(it.claimDate) + ")" : "") : (it.claimStatus === "UNCLAIMED" ? "No" : "")) + "</td></tr>";
    });
    html += "</table>";
  });
  $("printArea").innerHTML = html;
  window.print();          // prints this page only (no pop-up window, so phones do not block it)
}

/* ------------------------------------------------------------------ */
/* events                                                              */
/* ------------------------------------------------------------------ */
var onSearch = ClubCommon.debounce(function () { applyFilters(true); }, 160);
$("searchInput").addEventListener("input", onSearch);
["bloodFilter", "levelFilter", "statusFilter"].forEach(function (id) { $(id).addEventListener("change", function () { applyFilters(true); }); });
$("moreBtn").addEventListener("click", function () { shown += PAGE; renderTable(); renderSummary(); });
$("exportBtn").addEventListener("click", exportCsv);
$("printBtn").addEventListener("click", printAllCategories);
$("reloadBtn").addEventListener("click", loadAll);
$("dashBtn").addEventListener("click", function () { ClubCommon.goDashboard(); });

auth.onAuthStateChanged(function (user) {
  if (!user) { ClubCommon.gotoLogin(); return; }
  loadAll();
});
</script>
