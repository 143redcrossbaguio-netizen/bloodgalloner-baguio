<!DOCTYPE html>
<html>
<head>
<title>Blood Releasing Records</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

header{
background:#e65100;
color:white;
text-align:center;
padding:15px;
}

.container{
max-width:1450px;
margin:20px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.topSwitch{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.switchBtn{
padding:12px 16px;
border:none;
border-radius:5px;
font-weight:bold;
cursor:pointer;
color:white;
}

.releaseBtn{background:#e65100;}
.augmentationBtn{background:#1565c0;}
.waivedBtn{background:#6d4c41;}
.activeBtn{outline:3px solid #222;}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
align-items:center;
}

.controls input,
.controls select,
.controls button{
padding:10px;
border-radius:5px;
border:1px solid #ccc;
font-weight:bold;
}

.controls button{
border:none;
cursor:pointer;
color:white;
}

.exportBtn{background:#2e7d32;}
.backBtn{background:#444;}
.uncheckBtn{background:#8e24aa;}
.loadBtn{background:#1565c0;}

.filterGroup{
display:flex;
flex-direction:column;
gap:6px;
min-width:160px;
}

.filterGroup label{
font-size:14px;
font-weight:bold;
color:#2f3b52;
}

.filterGroup select,
.filterGroup input{
width:100%;
box-sizing:border-box;
}

.yearFilter{min-width:140px;}
.monthFilter{min-width:170px;}
.dateFilter{min-width:210px;}

#loadFilterBtn{
align-self:flex-end;
min-width:120px;
}

.duplicateBtn{
background:#6d4c41;
color:white;
}

.duplicateBtn.hasDup{
background:#c62828;
}

.duplicatePanel{
display:none;
margin-bottom:20px;
border:2px solid #d7ccc8;
border-radius:10px;
padding:15px;
background:#fff8f6;
}

.duplicatePanel.show{
display:block;
}

.duplicateTitle{
font-size:16px;
font-weight:bold;
color:#8d1f1f;
margin-bottom:10px;
}

.duplicateGroup{
border:1px solid #d7ccc8;
border-radius:8px;
background:white;
padding:12px;
margin-bottom:14px;
}

.duplicateGroupTitle{
font-weight:bold;
color:#6d4c41;
margin-bottom:10px;
}

.duplicateHint{
font-size:12px;
color:#666;
margin-top:4px;
margin-bottom:10px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ccc;
padding:8px;
text-align:center;
vertical-align:top;
font-size:14px;
}

th{
background:#e65100;
color:white;
}

.augTable th{
background:#1565c0;
}

.augTable td{
background:#eaf4ff;
}

.componentBox{
text-align:left;
font-size:13px;
line-height:1.5;
}

.actionBtn{
padding:6px 10px;
border:none;
border-radius:4px;
color:white;
cursor:pointer;
font-weight:bold;
margin:2px;
}

.editBtn{background:#1565c0;}
.viewBtn{background:#2e7d32;}
.deleteBtn{background:#c62828;}
.paidYesBtn{background:#2e7d32;}
.paidNoBtn{background:#c62828;}

.yearHeader{
background:#b71c1c;
color:white;
padding:11px 16px;
margin-top:24px;
font-weight:bold;
font-size:17px;
border-radius:7px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
border:none;
letter-spacing:1px;
}
.yearContent{display:none;}
.yearContent.show{display:block;}

.monthHeader{
background:#f0f0f0;
padding:12px 14px;
margin-top:12px;
font-weight:bold;
font-size:16px;
border-radius:6px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid #ddd;
}

.dateHeader{
background:#fafafa;
padding:10px 14px;
margin-top:12px;
font-weight:bold;
font-size:14px;
border-radius:6px;
cursor:pointer;
display:flex;
justify-content:space-between;
align-items:center;
border:1px solid #ddd;
}

.collapsibleIcon{
font-size:14px;
font-weight:bold;
min-width:24px;
text-align:right;
}

.monthContent,
.dateContent{
display:none;
}

.monthContent.show,
.dateContent.show{
display:block;
}

.emptyMessage{
padding:20px;
text-align:center;
font-weight:bold;
color:#666;
}

.searchResultsBanner{
background:#1565c0;
color:white;
padding:10px 16px;
border-radius:7px;
font-weight:bold;
font-size:14px;
margin-bottom:10px;
display:flex;
align-items:center;
justify-content:space-between;
flex-wrap:wrap;
gap:8px;
}
.searchResultsBanner span{opacity:0.88;font-weight:normal;font-size:12px;}
.searchClearBtn{
background:white;
color:#1565c0;
border:none;
border-radius:5px;
padding:5px 12px;
font-weight:bold;
font-size:12px;
cursor:pointer;
}
.searchClearBtn:hover{background:#e3f2fd;}

/* MODAL */
.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
z-index:2000;
overflow:auto;
}

.modalContent{
background:white;
max-width:800px;
margin:30px auto;
padding:20px;
border-radius:10px;
box-shadow:0 4px 14px rgba(0,0,0,0.2);
}

.formLabel{
font-weight:bold;
display:block;
margin-top:10px;
}

.formInput, .formSelect{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

.row{
display:flex;
gap:10px;
align-items:flex-end;
margin-top:8px;
}

.row select,
.row input{
flex:1;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

.row button{
width:auto;
min-width:45px;
padding:10px;
border:none;
border-radius:5px;
color:white;
font-weight:bold;
cursor:pointer;
}

.addBtn{background:#2e7d32;}
.removeBtn{background:#c62828;}
.saveBtn{background:#1565c0;color:white;}
.closeBtn{background:#444;color:white;}

.card{
border:1px solid #90caf9;
border-radius:8px;
padding:12px;
margin-top:12px;
background:#e3f2fd;
}

.innerBox{
border:1px solid #bbdefb;
border-radius:6px;
padding:10px;
margin-top:10px;
background:#f4faff;
}

.modalActions{
display:flex;
gap:10px;
margin-top:20px;
}

.modalActions button{
flex:1;
padding:12px;
border:none;
border-radius:5px;
font-weight:bold;
cursor:pointer;
}

.augDetailsWrap{
text-align:left;
line-height:1.4;
}

.augDetailsCard{
background:#ffffff;
border:1px solid #bcd4f6;
border-radius:6px;
padding:8px;
margin-bottom:8px;
}

.augDetailsTitle{
font-weight:bold;
color:#0f3d91;
margin-bottom:6px;
}

.augMiniTable{
width:100%;
border-collapse:collapse;
margin:0;
}

.augMiniTable th,
.augMiniTable td{
border:1px solid #9bbce0;
padding:6px;
font-size:12px;
text-align:center;
}

.augMiniTable th{
background:#cfe2ff;
color:#0b3d91;
}

.discountWrap{
display:flex;
align-items:center;
justify-content:center;
gap:8px;
flex-wrap:wrap;
}

.discountCheck{
width:18px;
height:18px;
cursor:pointer;
}

.checkedHighlight td{
background:#fff3b0 !important;
}

@media (max-width: 900px){
.controls{
flex-direction:column;
}
}

    </style>
</head>

<body>

<header>
<h2>Blood Releasing Records</h2>
</header>

<div class="container">

<div class="topSwitch">
<button id="showReleaseBtn" class="switchBtn releaseBtn activeBtn">RELEASING RECORDS</button>
<button id="showAugmentationBtn" class="switchBtn augmentationBtn">BLOOD AUGMENTATION</button>
<button id="showWaivedBtn" class="switchBtn waivedBtn">WAIVED</button>
</div>

<div class="controls">
<input type="text" id="searchBox" placeholder="Search Name / Facility">

<div class="filterGroup yearFilter">
<label for="filterYear">Year</label>
<select id="filterYear">
<option value="">ALL YEARS</option>
</select>
</div>

<div class="filterGroup monthFilter">
<label for="filterMonth">Month</label>
<select id="filterMonth">
<option value="">ALL MONTHS</option>
</select>
</div>

<div class="filterGroup dateFilter">
<label for="filterDate">Date Filter</label>
<input type="date" id="filterDate">
</div>

<button class="loadBtn" id="loadFilterBtn">LOAD</button>

<select id="filterFacility">
<option value="">ALL FACILITIES</option>
</select>

<button class="duplicateBtn" id="duplicateBtn">DUPLICATES: 0</button>
<button class="exportBtn" id="exportBtn">EXPORT CSV</button>
<button class="uncheckBtn" id="uncheckAllBtn">UNCHECK ALL</button>
<button class="backBtn" id="backBtn">BACK</button>
</div>

<div id="duplicatePanel" class="duplicatePanel"></div>
<div id="tableContainer"></div>

</div>

<!-- SOA VIEW MODAL -->
<div id="soaModal" class="modal">
  <div class="modalContent" style="max-width:880px;">
    <div style="overflow-x:auto;border:1px dashed #999;border-radius:6px;"><div id="soaViewBody"></div></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;">
      <div style="flex:1;min-width:220px;"><label class="formLabel">PRINTED / PREPARED BY</label><input type="text" id="soaViewPrintedBy" class="formInput" placeholder="Name of person printing"></div>
      <div style="flex:1;min-width:220px;"><label class="formLabel">APPROVED BY</label><input type="text" id="soaViewApprovedBy" class="formInput" placeholder="Name of approver"></div>
    </div>
    <div class="modalActions">
      <button type="button" class="saveBtn" onclick="printSoaView()">🖨 PRINT</button>
      <button type="button" class="editBtn" onclick="editSoaView()">✎ EDIT</button>
      <button type="button" class="closeBtn" onclick="closeSoaView()">CLOSE</button>
    </div>
  </div>
</div>

<!-- AUGMENTATION EDIT MODAL -->
<div id="augmentationModal" class="modal">
  <div class="modalContent">
    <h3 style="margin-top:0;">EDIT BLOOD AUGMENTATION</h3>

    <label class="formLabel">DATE</label>
    <input type="date" id="editAugDate" class="formInput">

    <label class="formLabel">FACILITY</label>
    <input type="text" id="editAugFacility" class="formInput">

    <label class="formLabel">BOX CONTAINER</label>
    <input type="number" id="editAugBoxContainerQty" class="formInput">

    <div id="editAugBloodTypeContainer"></div>

    <button type="button" class="addBtn" style="margin-top:15px;" onclick="addEditAugmentationBloodType()">+ ADD BLOOD TYPE</button>

    <label class="formLabel">AMOUNT PAID</label>
    <input type="number" id="editAugAmountPaid" class="formInput" readonly>

    <label class="formLabel">DISCOUNT</label>
    <input type="number" id="editAugDiscount" class="formInput">

    <label class="formLabel">ADDRESS</label>
    <input type="text" id="editAugAddress" class="formInput">

    <label class="formLabel">REMARKS</label>
    <input type="text" id="editAugRemarks" class="formInput">

    <div class="modalActions">
      <button type="button" class="saveBtn" onclick="saveAugmentationEdit()">SAVE CHANGES</button>
      <button type="button" class="closeBtn" onclick="closeAugmentationModal()">CLOSE</button>
    </div>
  </div>
</div>

<!-- RELEASING / WAIVED EDIT MODAL -->
<div id="releasingModal" class="modal">
  <div class="modalContent">
    <h3 style="margin-top:0;">EDIT RELEASING RECORD</h3>

    <label class="formLabel">DATE</label>
    <input type="date" id="editRelDate" class="formInput">

    <label class="formLabel">FACILITY</label>
    <input type="text" id="editRelFacility" class="formInput">

    <div class="row">
      <div style="flex:1">
        <label class="formLabel">SURNAME</label>
        <input type="text" id="editRelSurname" class="formInput">
      </div>
      <div style="flex:1">
        <label class="formLabel">FIRST NAME</label>
        <input type="text" id="editRelFirstname" class="formInput">
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label class="formLabel">AGE</label>
        <input type="text" id="editRelAge" class="formInput">
      </div>
      <div style="flex:1">
        <label class="formLabel">SEX</label>
        <input type="text" id="editRelSex" class="formInput">
      </div>
    </div>

    <div class="row">
      <div style="flex:1">
        <label class="formLabel">BLOOD TYPE</label>
        <select id="editRelBloodtype" class="formSelect">
          <option value="">Select</option>
          <option>A+</option>
          <option>A-</option>
          <option>B+</option>
          <option>B-</option>
          <option>AB+</option>
          <option>AB-</option>
          <option>O+</option>
          <option>O-</option>
        </select>
      </div>
      <div style="flex:1">
        <label class="formLabel">OR</label>
        <input type="text" id="editRelOr" class="formInput">
      </div>
    </div>

    <label class="formLabel">BOX CONTAINER</label>
    <input type="number" id="editRelBoxContainerQty" class="formInput">

    <div id="editRelWaivedFields" style="display:none;">
      <div class="row">
        <div style="flex:1">
          <label class="formLabel">WAIVED COMPONENT</label>
          <input type="text" id="editRelWaivedComponent" class="formInput">
        </div>
        <div style="flex:1">
          <label class="formLabel">WAIVED UNIT</label>
          <input type="number" id="editRelWaivedUnit" class="formInput">
        </div>
      </div>
    </div>

    <div class="innerBox">
      <label class="formLabel">REQUESTED</label>
      <div id="editRelRequestContainer"></div>
      <button type="button" class="addBtn" onclick="addEditRelRequest()">+</button>
    </div>

    <div class="innerBox">
      <label class="formLabel">ISSUED</label>
      <div id="editRelIssuedContainer"></div>
      <button type="button" class="addBtn" onclick="addEditRelIssued()">+</button>
    </div>

    <label class="formLabel">DISCOUNT</label>
    <input type="number" id="editRelDiscount" class="formInput">

    <div class="modalActions">
      <button type="button" class="saveBtn" onclick="saveReleasingEdit()">SAVE CHANGES</button>
      <button type="button" class="closeBtn" onclick="closeReleasingModal()">CLOSE</button>
    </div>
  </div>
</div>

<style id="soaStyles">
.soaDoc{font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;padding:18px 22px;font-size:12px;box-sizing:border-box;width:100%}
.soaDoc .soaHead{display:flex;align-items:center;gap:14px;border-bottom:2px solid #1a1450;padding-bottom:8px}
.soaDoc .soaHead img{width:70px;height:70px;object-fit:contain}
.soaDoc .soaOrg{flex:1;text-align:center;line-height:1.4}
.soaDoc .soaOrg b{font-size:15px;color:#1a1450}
.soaDoc .soaTitle{text-align:center;font-weight:700;font-size:15px;letter-spacing:2px;margin:12px 0 8px}
.soaDoc .soaMeta{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}
.soaDoc .soaMeta div{line-height:1.8}
.soaDoc .soaMeta .r{text-align:left;min-width:200px}
.soaDoc .ul{display:inline-block;min-width:150px;border-bottom:1px solid #000;padding:0 4px;font-weight:600}
.soaDoc table{width:100%;border-collapse:collapse;table-layout:fixed}
.soaDoc th,.soaDoc td{border:1px solid #000;padding:4px 5px;font-size:11.5px;word-wrap:break-word}
.soaDoc th{background:#eee}
.soaDoc td.n{text-align:right}.soaDoc td.c{text-align:center}
.soaDoc .tot td{font-weight:700;border-top:2px solid #000}
.soaDoc .noB{border:none!important;background:none!important}
.soaDoc .rem{margin-top:12px;min-height:34px}
.soaDoc .soaSign{display:flex;justify-content:space-between;gap:30px;margin-top:26px}
.soaDoc .soaSign div{flex:1;text-align:center}
.soaDoc .soaSign .line{border-top:1px solid #000;margin-top:4px;padding-top:3px;font-size:11px}
.soaDoc .soaSign .nm{min-height:16px;font-weight:700;text-transform:uppercase}
.soaWrap{border:1px dashed #999;border-radius:6px;margin:14px 0;overflow-x:auto}
.soaBox{background:#f4f8ff;border:1px solid #1565c0;border-radius:8px;padding:12px;margin-top:12px}
</style>

const NAMES={WB:"Whole Blood",PRBC:"Packed Red Blood Cells",PC:"Platelet Concentrate",FFP:"Fresh Frozen Plasma",CRYO:"Cryoprecipitate"};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const LS="soaMemory_v1";
const load=()=>{try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}};
const store=d=>{try{localStorage.setItem(LS,JSON.stringify(d))}catch(e){}};
const norm=s=>String(s).trim().replace(/\s+/g," ").toLowerCase();
function list(key){return (load()[key]||[]).slice().sort((a,b)=>b.n-a.n||b.t-a.t).map(x=>x.v)}
function remember(key,val){
  val=String(val||"").trim().replace(/\s+/g," ");if(!val)return val;
  const d=load(),arr=d[key]=d[key]||[],f=arr.find(x=>norm(x.v)===norm(val));
  if(f){f.n++;f.t=Date.now();f.v=val}else arr.push({v:val,n:1,t:Date.now()});
  store(d);return val;
}
function attach(input,key){
  if(!input)return;
  const dl=document.createElement("datalist");dl.id="soaDL_"+key+"_"+(input.id||Math.random().toString(36).slice(2));
  input.setAttribute("list",dl.id);input.setAttribute("autocomplete","off");input.after(dl);
  const fill=()=>{dl.innerHTML=list(key).map(v=>`<option value="${esc(v)}">`).join("")};
  fill();input.addEventListener("focus",fill);
  input.addEventListener("input",e=>{
    if(e.inputType&&e.inputType.startsWith("delete"))return;
    const v=input.value;if(!v)return;
    const m=list(key).find(x=>x.length>v.length&&x.toLowerCase().startsWith(v.toLowerCase()));
    if(m){input.value=v+m.slice(v.length);input.setSelectionRange(v.length,m.length)}
  });
  input.addEventListener("blur",()=>{if(input.value.trim())remember(key,input.value)});
}
const money=n=>(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
function fmtDate(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||"");if(!m)return s||"";
  return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
}
function build(e,prices){
  prices=prices||{};const rows=[];let gross=0;
  (e.bloodTypes||[]).forEach(bt=>{
    const agg={};(bt.issued||[]).forEach(i=>{const t=String(i.type||"").toUpperCase();agg[t]=(agg[t]||0)+(Number(i.qty)||0)});
    Object.keys(agg).forEach(t=>{
      if(!agg[t])return;const p=Number(prices[t])||0,amt=p*agg[t];gross+=amt;
      rows.push({d:`${NAMES[t]||t} (${t}) – ${bt.bloodType||""}`,q:agg[t],u:"unit",p,a:amt});
    });
  });
  const box=Number(e.boxContainerQty)||0;
  if(box){const p=Number(prices.BOX)||0;gross+=p*box;rows.push({d:"Box Container",q:box,u:"pc",p,a:p*box})}
  const disc=Number(e.discount)||0,net=gross-disc;
  let body=rows.map(r=>`<tr><td>${esc(r.d)}</td><td class="c">${r.q}</td><td class="c">${r.u}</td><td class="n">${money(r.p)}</td><td class="n">${""}</td><td class="n">${money(r.a)}</td></tr>`).join("");
  for(let i=rows.length;i<4;i++)body+=`<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td></tr>`;
  if(disc>0)body+=`<tr><td colspan="4" class="noB"></td><td class="n"><b>Discount</b></td><td class="n">(${money(disc)})</td></tr>`;
  return `<div class="soaDoc">
<div class="soaHead"><img src="${LOGO}" alt="logo"><div class="soaOrg"><b>PHILIPPINE RED CROSS BAGUIO CITY CHAPTER</b><br>39 Harrison Rd. Baguio City Chapter<br>NON-VAT Reg. TIN: 000-804-271-000</div></div>

  PC: 0,

};

async function loadPrices(){
  try{
    const snapshot = await get(ref(db, "settings/releasingPrices"));
    const data = snapshot.val() || {};

    currentPrices = {
      WB: Number(data.wb) || 0,
      PRBC: Number(data.prbc) || 0,
      PC: Number(data.pc) || 0,
      FFP: Number(data.ffp) || 0,
      CRYO: Number(data.cryo) || 0,
      BOX: Number(data.boxContainer) || 0
    };
  }catch(error){
    console.error("Failed to load prices:", error);
    currentPrices = {
      WB: 0,
      PRBC: 0,
      PC: 0,
      FFP: 0,
      CRYO: 0,
      BOX: 0
    };
  }
}

function normalizePriceSnapshot(snapshot){
  return {
    WB: Number(snapshot?.WB ?? snapshot?.wb) || 0,
    PRBC: Number(snapshot?.PRBC ?? snapshot?.prbc) || 0,
    PC: Number(snapshot?.PC ?? snapshot?.pc) || 0,
    FFP: Number(snapshot?.FFP ?? snapshot?.ffp) || 0,
    CRYO: Number(snapshot?.CRYO ?? snapshot?.cryo) || 0,
    BOX: Number(snapshot?.BOX ?? snapshot?.boxContainer ?? snapshot?.box) || 0
  };
}

function getEntryPrices(entry){
  if(entry && entry.priceSnapshot){
    return normalizePriceSnapshot(entry.priceSnapshot);
  }
  return currentPrices;
}

function computeIssuedTotalFromList(issuedList, boxContainerQty, prices){
  let total = 0;

  (Array.isArray(issuedList) ? issuedList : []).forEach(item => {
    const type = (item.type || "").toUpperCase();
    const qty = Number(item.qty || 0);

    if(prices[type] !== undefined){
      total += qty * prices[type];
    }
  });

  total += (Number(boxContainerQty) || 0) * (prices.BOX || 0);

  return total;
}

function computeReleasingTotal(entry){
  const prices = getEntryPrices(entry);
  return computeIssuedTotalFromList(entry.issued, entry.boxContainerQty, prices).toFixed(2);
}

function formatComponents(list){
  if(!Array.isArray(list) || list.length === 0) return "";
  return list.map(item => `${item.type || ""} - ${item.qty || ""}`).join("<br>");
}

function buildAugDetails(entry){
  const bloodTypes = Array.isArray(entry.bloodTypes) ? entry.bloodTypes : [];
  if(bloodTypes.length === 0) return "";

  return bloodTypes.map(bt => {
    const req = {WB:0,PRBC:0,PC:0,FFP:0,CRYO:0};
    const iss = {WB:0,PRBC:0,PC:0,FFP:0,CRYO:0};

    (Array.isArray(bt.requests) ? bt.requests : []).forEach(item => {
      const t = (item.type || "").toUpperCase();
      const q = Number(item.qty || 0);
      if(req[t] !== undefined) req[t] += q;
    });

    (Array.isArray(bt.issued) ? bt.issued : []).forEach(item => {
      const t = (item.type || "").toUpperCase();
      const q = Number(item.qty || 0);
      if(iss[t] !== undefined) iss[t] += q;
    });

    return `
      <div class="augDetailsCard">
        <div class="augDetailsTitle">${bt.bloodType || ""}</div>
        <table class="augMiniTable">
          <tr>
            <th></th>
            <th>WB</th>
            <th>PRBC</th>
            <th>PC</th>
            <th>FFP</th>
            <th>CRYO</th>
          </tr>
          <tr>
            <th>REQ</th>
            <td>${req.WB}</td>
            <td>${req.PRBC}</td>
            <td>${req.PC}</td>
            <td>${req.FFP}</td>
            <td>${req.CRYO}</td>
          </tr>
          <tr>
            <th>ISS</th>
            <td>${iss.WB}</td>
            <td>${iss.PRBC}</td>
            <td>${iss.PC}</td>
            <td>${iss.FFP}</td>
            <td>${iss.CRYO}</td>
          </tr>
        </table>
      </div>
    `;
  }).join("");
}

function computeAugEntryTotal(entry){
  const prices = getEntryPrices(entry);
  let total = 0;

  const bloodTypes = Array.isArray(entry.bloodTypes) ? entry.bloodTypes : [];
  bloodTypes.forEach(bt => {
    total += computeIssuedTotalFromList(bt.issued, 0, prices);
  });

  total += (Number(entry.boxContainerQty) || 0) * (prices.BOX || 0);
  return total.toFixed(2);
}

function computeWaivedDeduction(entry, prices){
  const waivedType = entry.waivedComponent ? String(entry.waivedComponent).toUpperCase() : "";
  const waivedQty = Number(entry.waivedUnit) || 0;
  const waivedValue = (waivedType && prices[waivedType] !== undefined) ? prices[waivedType] * waivedQty : 0;
  return { waivedType, waivedQty, waivedValue };
}

function computeFinalTotal(entry, computedTotalStr){
  const prices = getEntryPrices(entry);
  const discount = Number(entry.discount) || 0;
  const { waivedValue } = computeWaivedDeduction(entry, prices);
  let total = Number(computedTotalStr) - discount - waivedValue;
  if(total < 0) total = 0;
  return total.toFixed(2);
}

function buildAmountPaidCell(entry, computedTotalStr){
  const prices = getEntryPrices(entry);
  const { waivedType, waivedQty, waivedValue } = computeWaivedDeduction(entry, prices);
  const finalTotal = computeFinalTotal(entry, computedTotalStr);

  let html = finalTotal;
  if(waivedValue > 0){
    html += `<br><span style="font-size:11px;color:#b71c1c;">less ${waivedQty} ${waivedType} waived (${waivedValue.toFixed(2)})</span>`;
  }
  return html;
}

function getOrSortValue(orValue){
  const raw = String(orValue || "").trim().toUpperCase();
  if(raw === "") return { empty: 1, text: "", num: Number.MAX_SAFE_INTEGER };

  const numericOnly = raw.replace(/[^0-9]/g, "");
  const num = numericOnly !== "" ? Number(numericOnly) : Number.MAX_SAFE_INTEGER;

  return {
    empty: 0,
    text: raw,
    num: num
  };
}

function safeUpper(v){
  return String(v || "").trim().toUpperCase();
}

function getReleasingDuplicateKey(entry){
  return [
    safeUpper(entry.date),
    safeUpper(entry.facility),
    safeUpper(entry.surname),
    safeUpper(entry.firstname),
    safeUpper(entry.age),
    safeUpper(entry.sex),
    safeUpper(entry.bloodtype),
    safeUpper(entry.or),
    safeUpper(JSON.stringify(entry.requests || [])),
    safeUpper(JSON.stringify(entry.issued || [])),
    safeUpper(entry.amountPaid),
    safeUpper(entry.discount)
  ].join("||");
}

function getAugmentationDuplicateKey(entry){
  return [
    safeUpper(entry.date),
    safeUpper(entry.facility),
    safeUpper(entry.boxContainerQty),
    safeUpper(JSON.stringify(entry.bloodTypes || [])),
    safeUpper(entry.amountPaid),
    safeUpper(entry.discount)
  ].join("||");
}

function getDuplicateGroups(){
  const source = currentView === "augmentation" ? getFilteredAugmentationEntries() : (currentView === "waived" ? getFilteredWaivedEntries() : getFilteredReleasingEntries());
  const map = {};

  source.forEach(entry => {
    const key = currentView === "augmentation" ? getAugmentationDuplicateKey(entry) : getReleasingDuplicateKey(entry);
    if(!map[key]) map[key] = [];
    map[key].push(entry);
  });

  return Object.values(map).filter(group => group.length > 1);
}

function refreshDuplicateBox(){
  const groups = getDuplicateGroups();
  const totalDuplicates = groups.reduce((sum, group) => sum + group.length, 0);

  duplicateBtn.textContent = `DUPLICATES: ${totalDuplicates}`;
  duplicateBtn.classList.toggle("hasDup", totalDuplicates > 0);

  if(!duplicatePanelOpen){
    duplicatePanel.classList.remove("show");
    duplicatePanel.innerHTML = "";
    return;
  }

  if(groups.length === 0){
    duplicatePanel.classList.add("show");
    duplicatePanel.innerHTML = `<div class="duplicateTitle">Duplicate Entries</div><div class="emptyMessage">No duplicate entries found.</div>`;
    return;
  }

  duplicatePanel.classList.add("show");
  duplicatePanel.innerHTML = `
    <div class="duplicateTitle">Duplicate Entries Details</div>
    <div class="duplicateHint">These are grouped duplicate records based on matching main fields. You can edit or delete directly here.</div>
    ${groups.map((group, index) => `
      <div class="duplicateGroup">
        <div class="duplicateGroupTitle">Duplicate Group ${index + 1} (${group.length} entries)</div>
        ${currentView === "augmentation" ? renderDuplicateAugmentationGroup(group) : renderDuplicateReleasingGroup(group)}
      </div>
    `).join("")}
  `;
}

/* LOAD RELEASING */
function loadReleasingData(){
  onValue(ref(db,"releasing"), snapshot => {
    allReleasingEntries = [];

    snapshot.forEach(child => {
      allReleasingEntries.push({
        id: child.key,
        ...child.val()
      });
    });

    populateYearMonthFilterOptions();
    setDefaultYearMonthFilter();

    if(currentView === "releasing"){
      populateFacilityFilter();
      renderCurrentView();
    }else{
      refreshDuplicateBox();
    }
  }, error => {
    console.error("Load releasing error:", error);
    alert("Failed to load releasing records.");
  });
}

/* LOAD AUGMENTATION */
function loadAugmentationData(){
  onValue(ref(db,"bloodAugmentation"), snapshot => {
    allAugmentationEntries = [];

    snapshot.forEach(child => {
      allAugmentationEntries.push({
        id: child.key,
        ...child.val()
      });
    });

    populateYearMonthFilterOptions();
    setDefaultYearMonthFilter();

    if(currentView === "augmentation"){
      populateFacilityFilter();
      renderCurrentView();
    }else{
      refreshDuplicateBox();
    }
  }, error => {
    console.error("Load augmentation error:", error);
    alert("Failed to load blood augmentation records.");
  });
}

function setView(view){
  currentView = view;
  duplicatePanelOpen = false;
  duplicatePanel.classList.remove("show");
  duplicatePanel.innerHTML = "";

  showReleaseBtn.classList.remove("activeBtn");
  showAugmentationBtn.classList.remove("activeBtn");
  showWaivedBtn.classList.remove("activeBtn");

  if(view === "releasing"){
    showReleaseBtn.classList.add("activeBtn");
    searchBox.placeholder = "Search all records — Name, Facility, Blood Type...";
    uncheckAllBtn.style.display = "inline-block";
  }else if(view === "augmentation"){
    showAugmentationBtn.classList.add("activeBtn");
    searchBox.placeholder = "Search all records — Facility, Blood Type...";
    uncheckAllBtn.style.display = "none";

    const augmentationYear = filterYear.value || appliedYearFilter || String(new Date().getFullYear());
    if(augmentationYear){
      const yearExists = [...filterYear.options].some(option => option.value === augmentationYear);
      if(!yearExists){
        const option = document.createElement("option");
        option.value = augmentationYear;
        option.textContent = augmentationYear;
        filterYear.appendChild(option);
      }
      filterYear.value = augmentationYear;
    }
    appliedYearFilter = filterYear.value;
    filterMonth.value = "";
    filterDate.value = "";
    appliedMonthFilter = "";
  }else{
    showWaivedBtn.classList.add("activeBtn");
    searchBox.placeholder = "Search all records — Name, Facility, Waived Component...";
    uncheckAllBtn.style.display = "none";
  }

  populateFacilityFilter();
  renderCurrentView();
}


function populateYearMonthFilterOptions(){
  const currentYearValue = filterYear.value;
  const currentMonthValue = filterMonth.value;

  const yearSet = new Set();
  [...allReleasingEntries, ...allAugmentationEntries].forEach(entry => {
    const year = String(entry.date || "").slice(0,4);
    if(/^\d{4}$/.test(year)) yearSet.add(year);
  });

  const thisYear = String(new Date().getFullYear());
  yearSet.add(thisYear);

  filterYear.innerHTML = '<option value="">ALL YEARS</option>';
  [...yearSet].sort().reverse().forEach(year => {
    const option = document.createElement("option");
    option.value = year;
    option.textContent = year;
    filterYear.appendChild(option);
  });

  if(currentYearValue && [...yearSet].includes(currentYearValue)){
    filterYear.value = currentYearValue;
  }

  filterMonth.innerHTML = '<option value="">ALL MONTHS</option>';
  MONTH_FILTER_OPTIONS.forEach(month => {
    const option = document.createElement("option");
    option.value = month.value;
    option.textContent = month.label;
    filterMonth.appendChild(option);
  });

  if(currentMonthValue){
    filterMonth.value = currentMonthValue;
  }
}

function setDefaultYearMonthFilter(){
  if(dateFilterDefaultsSet) return;

  const now = new Date();
  const year = String(now.getFullYear());
  const month = String(now.getMonth() + 1).padStart(2,"0");

  populateYearMonthFilterOptions();

  filterYear.value = year;
  filterMonth.value = month;
  filterDate.value = `${year}-${month}-01`;

  appliedYearFilter = year;
  appliedMonthFilter = month;
  dateFilterDefaultsSet = true;
}

function syncDateFilterFromYearMonth(){
  if(filterYear.value && filterMonth.value){
    filterDate.value = `${filterYear.value}-${filterMonth.value}-01`;
  }else{
    filterDate.value = "";
  }
}

function syncYearMonthFromDateFilter(){
  const value = filterDate.value;
  if(!value) return;

  const year = value.slice(0,4);
  const month = value.slice(5,7);

  if(year){
    const yearExists = [...filterYear.options].some(option => option.value === year);
    if(!yearExists){
      const option = document.createElement("option");
      option.value = year;
      option.textContent = year;
      filterYear.appendChild(option);
    }
    filterYear.value = year;
  }

  if(month){
    filterMonth.value = month;
  }
}

function applyYearMonthFilter(){
  syncYearMonthFromDateFilter();
  appliedYearFilter = filterYear.value;
  appliedMonthFilter = filterMonth.value;
  renderCurrentView();
}

function entryMatchesAppliedMonthFilter(dateValue){
  const date = String(dateValue || "");

  const matchYear =
    appliedYearFilter === "" ||
    date.slice(0,4) === appliedYearFilter;

  const matchMonth =
    appliedMonthFilter === "" ||
    date.slice(5,7) === appliedMonthFilter;

  return matchYear && matchMonth;
}

function populateFacilityFilter(){
  let facilities = [];

  if(currentView === "augmentation"){
    facilities = [...new Set(
      allAugmentationEntries.map(e => (e.facility || "").trim()).filter(Boolean)
    )].sort();
  }else if(currentView === "waived"){
    facilities = [...new Set(
      getFilteredWaivedEntries(true).map(e => (e.facility || "").trim()).filter(Boolean)
    )].sort();
  }else{
    facilities = [...new Set(
      allReleasingEntries.map(e => (e.facility || "").trim()).filter(Boolean)
    )].sort();
  }

  const currentValue = filterFacility.value;
  filterFacility.innerHTML = '<option value="">ALL FACILITIES</option>';

  facilities.forEach(f => {
    const option = document.createElement("option");
    option.value = f;
    option.textContent = f;
    filterFacility.appendChild(option);
  });

  if(facilities.includes(currentValue)){
    filterFacility.value = currentValue;
  }else{
    filterFacility.value = "";
  }
}

function getFilteredReleasingEntries(){
  const search = searchBox.value.trim().toUpperCase();
  const facilityValue = filterFacility.value;

  let filtered = allReleasingEntries.filter(entry => {
    const fullName = `${entry.surname || ""} ${entry.firstname || ""}`.toUpperCase();
    const facility = (entry.facility || "").toUpperCase();
    const date = entry.date || "";

    const matchSearch =
      search === "" ||
      fullName.includes(search) ||
      facility.includes(search);

    const matchMonth = entryMatchesAppliedMonthFilter(date);

    const matchFacility =
      facilityValue === "" ||
      entry.facility === facilityValue;

    return matchSearch && matchMonth && matchFacility;
  });

  filtered.sort((a,b) => {
    const dateCompare = (b.date || "").localeCompare(a.date || "");
    if(dateCompare !== 0) return dateCompare;

    const aOr = getOrSortValue(a.or);
    const bOr = getOrSortValue(b.or);

    if(aOr.empty !== bOr.empty) return aOr.empty - bOr.empty;
    if(aOr.num !== bOr.num) return aOr.num - bOr.num;
    return aOr.text.localeCompare(bOr.text);
  });

  return filtered;
}

function getFilteredAugmentationEntries(){
  const search = searchBox.value.trim().toUpperCase();
  const facilityValue = filterFacility.value;

  let filtered = allAugmentationEntries.filter(entry => {
    const facility = (entry.facility || "").toUpperCase();
    const date = entry.date || "";
    const bloodTypesText = (Array.isArray(entry.bloodTypes) ? entry.bloodTypes : [])
      .map(item => (item.bloodType || "").toUpperCase())
      .join(" ");

    const matchSearch =
      search === "" ||
      facility.includes(search) ||
      bloodTypesText.includes(search);

    const matchMonth = entryMatchesAppliedMonthFilter(date);

    const matchFacility =
      facilityValue === "" ||
      entry.facility === facilityValue;

    return matchSearch && matchMonth && matchFacility;
  });

  filtered.sort((a,b) => (b.date || "").localeCompare(a.date || ""));
  return filtered;
}

function getFilteredWaivedEntries(ignoreFilters = false){
  const search = ignoreFilters ? "" : searchBox.value.trim().toUpperCase();
  const facilityValue = ignoreFilters ? "" : filterFacility.value;

  let filtered = allReleasingEntries.filter(entry => {
    const isWaived = !!entry.waived;
    if(!isWaived) return false;

    const fullName = `${entry.surname || ""} ${entry.firstname || ""}`.toUpperCase();
    const facility = (entry.facility || "").toUpperCase();
    const date = entry.date || "";
    const waivedComponent = (entry.waivedComponent || "").toUpperCase();
    const waivedUnit = String(entry.waivedUnit || "").toUpperCase();

    const matchSearch =
      search === "" ||
      fullName.includes(search) ||
      facility.includes(search) ||
      waivedComponent.includes(search) ||
      waivedUnit.includes(search);

    const matchMonth =
      ignoreFilters ||
      entryMatchesAppliedMonthFilter(date);

    const matchFacility =
      facilityValue === "" ||
      entry.facility === facilityValue;

    return matchSearch && matchMonth && matchFacility;
  });

  filtered.sort((a,b) => {
    const dateCompare = (b.date || "").localeCompare(a.date || "");
    if(dateCompare !== 0) return dateCompare;

    const aOr = getOrSortValue(a.or);
    const bOr = getOrSortValue(b.or);

    if(aOr.empty !== bOr.empty) return aOr.empty - bOr.empty;
    if(aOr.num !== bOr.num) return aOr.num - bOr.num;
    return aOr.text.localeCompare(bOr.text);
  });

  return filtered;
}

// ── Label helpers ────────────────────────────────────────────────────────────
const _MN = ["January","February","March","April","May","June",
             "July","August","September","October","November","December"];
const _DN = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

function formatMonthLabel(mk){
  if(!mk||mk==="NO DATE") return "No Date";
  const p=mk.split("-");
  if(p.length<2) return mk;
  const yr=parseInt(p[0],10), mo=parseInt(p[1],10)-1;
  if(isNaN(yr)||isNaN(mo)||mo<0||mo>11) return mk;
  return `${_MN[mo]} ${yr}`;
}

function formatDateLabel(dk){
  if(!dk||dk==="NO DATE") return "No Date";
  const p=dk.split("-");
  if(p.length<3) return dk;
  const yr=parseInt(p[0],10), mo=parseInt(p[1],10)-1, dy=parseInt(p[2],10);
  if(isNaN(yr)||isNaN(mo)||isNaN(dy)||mo<0||mo>11) return dk;
  const dow=_DN[new Date(yr,mo,dy).getDay()];
  return `${_MN[mo]} ${dy}, ${yr} — ${dow}`;
}

function escHtml(s){
  return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
// ── end label helpers ────────────────────────────────────────────────────────

// ── Shared Year > Month > Date render helper ──────────────────────────────────
// ── Collapse-state memory (persists open/closed sections across re-renders) ──
const sectionCollapseState = {};

function getSectionOpenState(kind, key, defaultOpen){
  const fullKey = `${currentView}|${kind}|${key}`;
  return Object.prototype.hasOwnProperty.call(sectionCollapseState, fullKey)
    ? sectionCollapseState[fullKey]
    : defaultOpen;
}

function setSectionOpenState(kind, key, isOpen){
  sectionCollapseState[`${currentView}|${kind}|${key}`] = isOpen;
}
// ── end collapse-state memory ─────────────────────────────────────────────────

function renderYearMonthDateInto(parentEl, groupedByMonth, renderDateContent){
  const groupedByYear={};
  Object.keys(groupedByMonth).forEach(month=>{
    const yr=month==="NO DATE"?"No Date":month.slice(0,4);
    if(!groupedByYear[yr]) groupedByYear[yr]=[];
    groupedByYear[yr].push(month);
  });

  Object.keys(groupedByYear).sort().reverse().forEach(year=>{
    const yms=groupedByYear[year];
    const ytotal=yms.reduce((s,m)=>s+groupedByMonth[m].length,0);
    const yearOpen=getSectionOpenState("year",year,true);
    const yh=document.createElement("div");
    yh.className="yearHeader";
    yh.innerHTML=`<span>📅 ${year} &nbsp;<span style="font-weight:normal;font-size:13px;opacity:0.85;">(${ytotal} record${ytotal!==1?"s":""})</span></span><span class="collapsibleIcon" style="color:white;">${yearOpen?"−":"+"}</span>`;
    const yc=document.createElement("div");
    yc.className="yearContent"+(yearOpen?" show":"");
    attachCollapseBehavior(yh,yc,(isOpen)=>setSectionOpenState("year",year,isOpen));

    yms.sort().reverse().forEach(month=>{
      const me=groupedByMonth[month];
      const monthOpen=getSectionOpenState("month",month,false);
      const mh=createCollapsibleHeader("monthHeader",formatMonthLabel(month),`${me.length} record${me.length!==1?"s":""}`,monthOpen);
      const mc=document.createElement("div");
      mc.className="monthContent"+(monthOpen?" show":"");

      const gbd={};
      me.forEach(e=>{const dk=e.date||"NO DATE";if(!gbd[dk])gbd[dk]=[];gbd[dk].push(e);});

      Object.keys(gbd).sort().reverse().forEach(dk=>{
        const de=gbd[dk];
        const dateOpen=getSectionOpenState("date",dk,false);
        const dh=createCollapsibleHeader("dateHeader",formatDateLabel(dk),`${de.length} record${de.length!==1?"s":""}`,dateOpen);
        const dc=document.createElement("div");
        dc.className="dateContent"+(dateOpen?" show":"");
        renderDateContent(dc,de);
        attachCollapseBehavior(dh,dc,(isOpen)=>setSectionOpenState("date",dk,isOpen));
        mc.appendChild(dh); mc.appendChild(dc);
      });

      attachCollapseBehavior(mh,mc,(isOpen)=>setSectionOpenState("month",month,isOpen));
      yc.appendChild(mh); yc.appendChild(mc);
    });

    parentEl.appendChild(yh); parentEl.appendChild(yc);
  });
}

function createCollapsibleHeader(className, label, countText, isOpen=false){
  const header = document.createElement("div");
  header.className = className;
  header.innerHTML = `
    <span>${label}${countText ? ` (${countText})` : ""}</span>
    <span class="collapsibleIcon">${isOpen ? "−" : "+"}</span>
  `;
  return header;
}

function attachCollapseBehavior(header, content, onToggle){
  const icon = header.querySelector(".collapsibleIcon");
  header.addEventListener("click", () => {
    const isOpen = content.classList.contains("show");
    content.classList.toggle("show", !isOpen);
    icon.textContent = isOpen ? "+" : "−";
    if(typeof onToggle === "function") onToggle(!isOpen);
  });
}

function recomputeEditAugmentationAmountPaid(){
  const prices = currentAugmentationPriceSnapshot || currentPrices;
  let total = 0;

  document.querySelectorAll("#editAugBloodTypeContainer .editAugIssuedRow").forEach(row => {
    const type = row.querySelector(".editAugIssuedType").value;
    const qty = Number(row.querySelector(".editAugIssuedQty").value) || 0;

    if(prices[type] !== undefined){
      total += prices[type] * qty;
    }
  });

  const boxQty = Number(document.getElementById("editAugBoxContainerQty").value) || 0;
  total += boxQty * (prices.BOX || 0);

  document.getElementById("editAugAmountPaid").value = total.toFixed(2);
}

function exportReleasingCSV(){
  const filtered = getFilteredReleasingEntries();

  const rows = [
    ["DATE","FACILITY","SURNAME","FIRSTNAME","AGE","SEX","BLOOD","OR","BOX_CONTAINER","REQUESTED","ISSUED","COMPUTED_TOTAL","AMOUNT_PAID","DISCOUNT"]
  ];

  filtered.forEach(e => {
    const req = (Array.isArray(e.requests) ? e.requests : [])
      .map(r => `${r.type || ""}-${r.qty || ""}`)
      .join("|");

    const iss = (Array.isArray(e.issued) ? e.issued : [])
      .map(r => `${r.type || ""}-${r.qty || ""}`)
      .join("|");

    rows.push([
      e.date || "",
      e.facility || "",
      e.surname || "",
      e.firstname || "",
      e.age || "",
      e.sex || "",
      e.bloodtype || "",
      e.or || "",
      e.boxContainerQty || 0,
      req,
      iss,
      computeReleasingTotal(e),
      computeFinalTotal(e, computeReleasingTotal(e)),
      e.discount || ""
    ]);
  });

  const csv = rows.map(row =>
    row.map(value => `"${String(value).replace(/"/g, '""')}"`).join(",")
  ).join("\n");

  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "releasing_records.csv";
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function exportAugmentationCSV(){
  const filtered = getFilteredAugmentationEntries();

  const rows = [
    ["DATE","FACILITY","BOX_CONTAINER","AUGMENTATION_DETAILS","COMPUTED_TOTAL","AMOUNT_PAID","DISCOUNT","PAID"]
  ];

  filtered.forEach(e => {
    const details = (Array.isArray(e.bloodTypes) ? e.bloodTypes : []).map(bt => {
      const reqText = (Array.isArray(bt.requests) ? bt.requests : [])
        .filter(item => Number(item.qty || 0) > 0)
        .map(item => `${item.type}-${item.qty}`)

        .filter(item => Number(item.qty || 0) > 0)
        .map(item => `${item.type}-${item.qty}`)
        .join(", ");

      return `${bt.bloodType || ""} [REQ: ${reqText || "-"} | ISS: ${issText || "-"}]`;
    }).join(" || ");

    rows.push([
      e.date || "",
      e.facility || "",
      e.boxContainerQty || 0,
      details,
      computeAugEntryTotal(e),
      computeFinalTotal(e, computeAugEntryTotal(e)),
      e.discount || "",

  const csv = rows.map(row =>

  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "blood_augmentation_records.csv";

window.printSoaView = async function(){
  const d = soaCurrent(); if(!d) return;
  d.printedBy = SOA.remember("printedBy", d.printedBy);
  d.approvedBy = SOA.remember("approvedBy", d.approvedBy);
  if(!d.printedBy){ alert("Please type the name of the person printing."); document.getElementById("soaViewPrintedBy").focus(); return; }
  const patch = { printedBy: d.printedBy, approvedBy: d.approvedBy };
  try{
    if(!d.invoiceNo){ // older records saved before invoice numbering
      const y = (d.date || "").slice(0,4) || String(new Date().getFullYear());
      const tx = await runTransaction(ref(db, "settings/soaCounter/" + y), c => (Number(c) || 0) + 1);
      d.invoiceNo = patch.invoiceNo = `INV-${y}-${String(tx.snapshot.val()).padStart(5,"0")}`;
    }
    await update(ref(db, "bloodAugmentation/" + d.id), patch);
  }catch(err){ console.error(err); alert("Could not store the invoice/print details, but printing will continue."); }
  renderSoaView();
  SOA.print(SOA.build(d, getEntryPrices(d)));
};
