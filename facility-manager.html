<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facility Manager</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f4;color:#222}
header{background:#e65100;color:#fff;text-align:center;padding:15px}
header h2{margin:0;font-size:22px}
.wrap{max-width:1000px;margin:18px auto;background:#fff;padding:18px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar input[type=search]{flex:1;min-width:180px;padding:10px;border:1px solid #bbb;border-radius:6px;font-size:14px}
button{border:none;border-radius:6px;padding:9px 14px;font-weight:bold;font-size:13px;cursor:pointer;color:#fff;background:#546e7a}
button:disabled{opacity:.6;cursor:wait}
.b-add{background:#2e7d32}.b-chk{background:#1565c0}.b-imp{background:#6a1b9a}.b-del{background:#c62828}.b-edit{background:#e65100}
#msg{min-height:20px;margin:6px 0 10px;font-size:14px;font-weight:bold}
#msg.ok{color:#2e7d32}#msg.err{color:#c62828}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:#e65100;color:#fff;text-align:left;padding:9px}
td{padding:8px 9px;border-bottom:1px solid #eee;vertical-align:top}
td.act{white-space:nowrap;width:1%}
.tag{display:inline-block;background:#fff3e0;border:1px solid #ffb74d;border-radius:12px;padding:1px 8px;margin:2px 3px 2px 0;font-size:12px}
.muted{color:#777;font-size:13px}
.panel{border:1px solid #1565c0;border-radius:8px;padding:12px;margin:14px 0;background:#f3f8ff}
.panel h3{margin:0 0 8px;font-size:16px;color:#1565c0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 0;border-bottom:1px solid #dbe7f5}
.row .nm{flex:1;min-width:220px;font-weight:bold}
.row select{padding:7px;border:1px solid #bbb;border-radius:6px;max-width:260px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;overflow:auto}
.mc{background:#fff;max-width:480px;margin:6vh auto;padding:20px;border-radius:10px}
.mc label{display:block;font-weight:bold;font-size:13px;margin:12px 0 4px}
.mc input{width:100%;padding:10px;border:1px solid #bbb;border-radius:6px;font-size:14px}
.mc .hint{font-size:12px;color:#777;margin-top:3px}
.mc .acts{display:flex;gap:8px;margin-top:16px}
#mErr{color:#c62828;font-size:13px;font-weight:bold;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<header><h2>FACILITY MANAGER</h2></header>
<div class="wrap">
  <div class="bar">
    <input type="search" id="q" placeholder="Search facility or short name...">
    <button class="b-add" id="addBtn">+ ADD FACILITY</button>
    <button class="b-chk" id="chkBtn">CHECK PAST RECORDS</button>
    <button class="b-imp" id="impBtn" style="display:none"></button>
  </div>
  <div id="msg"></div>
  <div id="checkPanel"></div>
  <table><thead><tr><th>FACILITY</th><th>SHORT NAMES</th><th></th></tr></thead><tbody id="tb"></tbody></table>
  <p class="muted" id="count"></p>
  <p class="muted">Short names are what you can type in the Releasing Entry to reach the full facility name (e.g. "BGHMC" → Baguio General Hospital and Medical Center).</p>
</div>

<div class="modal" id="modal"><div class="mc">
  <h3 id="mTitle" style="margin:0">ADD FACILITY</h3>
  <label>FACILITY NAME</label><input id="mName" autocomplete="off">
  <label>SHORT NAMES (separate with commas)</label><input id="mAliases" autocomplete="off" placeholder="e.g. BGHMC, BGH, Baguio General">
  <div class="hint">Used by the entry page to recognise different ways of typing the same facility.</div>
  <div id="mErr"></div>
  <div class="acts"><button class="b-add" id="mSave">SAVE</button><button id="mCancel">CANCEL</button></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, get, push, update, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey:"AIzaSyByh0YJ11ZpbRV7EoDoLnqgFxe1r68efPI",
  authDomain:"galloners-club.firebaseapp.com",
  databaseURL:"https://galloners-club-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"galloners-club",
  storageBucket:"galloners-club.firebasestorage.app",
  messagingSenderId:"213049860421",
  appId:"1:213049860421:web:4156aaa52b945f48711e2c"
});
const auth = getAuth(app), db = getDatabase(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = s => String(s || "").toUpperCase().replace(/[\s.\-()&,\/]+/g, "");
const BUILTIN = [["BAGUIO GENERAL HOSPITAL AND MEDICAL CENTER",["BGHMC","BGH","BAGUIO GENERAL","BAGUIO GEN","B.G.H.M.C","BGMC"]],["NOTRE DAME DE CHARTRES HOSPITAL",["NDCH","NOTRE DAME DE CHARTRES","NOTRE DAME CHARTRES","ND CHARTRES","N.D.C.H"]],["REGION 1 MEDICAL CENTER",["R1MC","REGION 1 MED CENTER","REGION I MEDICAL CENTER","R1 MED CENTER","R-1MC","R.1.M.C","REGION 1MC"]],["SAINT LOUIS UNIVERSITY HOSPITAL",["SLUH","SLU HOSPITAL","SLU HOSP","SLU","S.L.U.H"]],["BENGUET GENERAL HOSPITAL",["BGH BENGUET","BENGUET GEN HOSP","BENGUET GENERAL","BGH-BENGUET"]],["PINES CITY DOCTORS HOSPITAL",["PCDH","PINES CITY DOCTORS","PINES DOCTORS","P.C.D.H"]],["WESTERN PANGASINAN DISTRICT HOSPITAL",["WPDH","WESTERN PANGASINAN","W.P.D.H","WPDC"]],["EASTERN PANGASINAN DISTRICT HOSPITAL",["EPDH","EASTERN PANGASINAN","E.P.D.H"]],["ILOCOS TRAINING AND REGIONAL MEDICAL CENTER",["ITRMC","ILOCOS TRAINING","ILOCOS REGIONAL","I.T.R.M.C"]],["DON MARIANO MARCOS MEMORIAL HOSPITAL",["DMMMH","DON MARIANO MARCOS","D.M.M.M.H"]],["PHILIPPINE GENERAL HOSPITAL",["PGH","PHIL GENERAL HOSPITAL","P.G.H"]],["DAGUPAN DOCTORS VILLAFLOR MEMORIAL HOSPITAL",["DDVMH","DAGUPAN DOCTORS","VILLAFLOR MEMORIAL","D.D.V.M.H"]]];   // [name, [short names]] — the standard list already built into the entry page

let facs = [];            // [{id,name,aliases[]}]
let editId = null;

function say(t, ok){ const m = $("msg"); m.textContent = t || ""; m.className = t ? (ok ? "ok" : "err") : ""; }
const errText = e => (e && (e.code || e.message)) || String(e);
function parseAliases(v){ return [...new Set(String(v || "").split(",").map(x => x.trim().toUpperCase()).filter(Boolean))]; }
function aliasesOf(d){ return Array.isArray(d.aliases) ? d.aliases : String(d.aliases || "").split(",").map(s => s.trim()).filter(Boolean); }

/* ---------- list ---------- */
function render(){
  const q = $("q").value.trim().toUpperCase();
  const rows = facs.filter(f => !q || f.name.includes(q) || f.aliases.some(a => a.toUpperCase().includes(q)));
  $("tb").innerHTML = rows.map(f => `<tr><td><b>${esc(f.name)}</b></td><td>${f.aliases.map(a => `<span class="tag">${esc(a)}</span>`).join("") || '<span class="muted">—</span>'}</td>
    <td class="act"><button class="b-edit" data-e="${esc(f.id)}">EDIT</button> <button class="b-del" data-d="${esc(f.id)}">DELETE</button></td></tr>`).join("")
    || '<tr><td colspan="3" class="muted">No facilities found.</td></tr>';
  $("count").textContent = facs.length + " facilities saved";
  const have = new Set(facs.map(f => key(f.name)));
  const missing = BUILTIN.filter(b => !have.has(key(b[0])));
  $("impBtn").style.display = missing.length ? "" : "none";
  $("impBtn").textContent = "ADD STANDARD LIST (" + missing.length + " missing)";
}
function load(){
  onValue(ref(db, "facilities"), snap => {
    facs = [];
    snap.forEach(ch => { const d = ch.val() || {}; const name = String(d.name || "").trim().toUpperCase(); if(name) facs.push({ id: ch.key, name, aliases: aliasesOf(d) }); });
    facs.sort((a, b) => a.name.localeCompare(b.name));
    render();
  }, e => say("Could not load the list: " + errText(e), false));
}

/* ---------- add / edit ---------- */
function clash(name, aliases, exceptId){
  const mine = [name, ...aliases].map(key);
  for(const f of facs){
    if(f.id === exceptId) continue;
    const theirs = [f.name, ...f.aliases].map(key);
    const hit = mine.find(k => theirs.includes(k));
    if(hit) return `"${[name, ...aliases].find(x => key(x) === hit)}" is already used by ${f.name}.`;
  }
  return "";
}
function openModal(f){
  editId = f ? f.id : null;
  $("mTitle").textContent = f ? "EDIT FACILITY" : "ADD FACILITY";
  $("mName").value = f ? f.name : ""; $("mAliases").value = f ? f.aliases.join(", ") : ""; $("mErr").textContent = "";
  $("modal").style.display = "block"; $("mName").focus();
}
const closeModal = () => { $("modal").style.display = "none"; editId = null; };
async function saveModal(){
  const name = $("mName").value.trim().toUpperCase(), aliases = parseAliases($("mAliases").value).filter(a => key(a) !== key(name));
  const err = t => { $("mErr").textContent = t; };
  if(!name) return err("Facility name is required.");
  const c = clash(name, aliases, editId); if(c) return err(c);
  $("mSave").disabled = true;
  try{
    const data = { name, aliases };
    if(editId) await update(ref(db, "facilities/" + editId), data); else await push(ref(db, "facilities"), data);
    closeModal(); say("Saved " + name, true);
  }catch(e){ err("Could not save: " + errText(e)); }
  $("mSave").disabled = false;
}
async function del(id){
  const f = facs.find(x => x.id === id); if(!f) return;
  if(!confirm("Delete " + f.name + " from the list?\n(Past records are not changed.)")) return;
  try{ await remove(ref(db, "facilities/" + id)); say("Deleted " + f.name, true); }catch(e){ say("Could not delete: " + errText(e), false); }
}
async function importStandard(){
  const have = new Set(facs.map(f => key(f.name)));
  const miss = BUILTIN.filter(b => !have.has(key(b[0])));
  $("impBtn").disabled = true;
  try{
    const up = {};
    miss.forEach(b => { up[push(ref(db, "facilities")).key] = { name: b[0], aliases: b[1] }; });
    await update(ref(db, "facilities"), up);
    say("Added " + miss.length + " standard facilities.", true);
  }catch(e){ say("Could not add: " + errText(e), false); }
  $("impBtn").disabled = false;
}

/* ---------- check past records ---------- */
let found = [];   // [{name,count,refs:[[path]]}]
function knownMap(){
  const m = new Map();   // key -> canonical name
  BUILTIN.forEach(b => [b[0], ...b[1]].forEach(x => m.set(key(x), b[0])));
  facs.forEach(f => [f.name, ...f.aliases].forEach(x => m.set(key(x), f.name)));
  return m;
}
function guess(name, targets){
  const k = key(name); if(k.length < 3) return "";
  const hit = targets.find(t => { const tk = key(t); return tk === k || (k.length >= 4 && (tk.includes(k) || k.includes(tk))); });
  return hit || "";
}
async function check(){
  $("chkBtn").disabled = true; say("Reading past records...", true);
  try{
    const [r, a, h] = await Promise.all([get(ref(db, "releasing")), get(ref(db, "bloodAugmentation")), get(ref(db, "settings/sampleHubbing"))]);
    const known = knownMap(), seen = new Map();
    const scan = (snap, root, field) => snap.forEach(ch => {
      const v = String((ch.val() || {})[field] || "").trim(); if(!v) return;
      if(known.has(key(v))) return;
      const k = v.toUpperCase();
      if(!seen.has(k)) seen.set(k, { name: k, paths: [] });
      seen.get(k).paths.push(root + "/" + ch.key + "/" + field);
      // remember the exact spelling stored, so it can be rewritten
      (seen.get(k).raw = seen.get(k).raw || new Set()).add(v);
    });
    scan(r, "releasing", "facility"); scan(a, "bloodAugmentation", "facility"); scan(h, "settings/sampleHubbing", "source");
    found = [...seen.values()].sort((x, y) => y.paths.length - x.paths.length);
    say(found.length ? "" : "All facility names in your past records are on the list.", true);
    drawCheck();
  }catch(e){ say("Could not read the records: " + errText(e), false); }
  $("chkBtn").disabled = false;
}
function drawCheck(){
  const targets = [...new Set([...facs.map(f => f.name), ...BUILTIN.map(b => b[0])])].sort();
  if(!found.length){ $("checkPanel").innerHTML = ""; return; }
  $("checkPanel").innerHTML = `<div class="panel"><h3>${found.length} name(s) in past records are not on the list</h3>
   <div class="muted" style="margin-bottom:6px">Add it as a new facility, or merge it into one you already have so it is always matched.</div>` +
   found.map((f, i) => { const g = guess(f.name, targets);
     return `<div class="row" data-i="${i}"><div class="nm">${esc(f.name)} <span class="muted">(${f.paths.length} record${f.paths.length > 1 ? "s" : ""})</span></div>
      <button class="b-add" data-new="${i}">ADD AS NEW</button>
      <select data-sel="${i}"><option value="">— merge into… —</option>${targets.map(t => `<option value="${esc(t)}"${t === g ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>
      <label class="muted"><input type="checkbox" data-fix="${i}" checked> also fix ${f.paths.length} old record${f.paths.length > 1 ? "s" : ""}</label>
      <button class="b-chk" data-merge="${i}">MERGE</button></div>`; }).join("") + `</div>`;
}
async function addNew(i){
  const f = found[i]; const c = clash(f.name, [], null); if(c){ say(c, false); return; }
  try{ await push(ref(db, "facilities"), { name: f.name, aliases: [] }); found.splice(i, 1); drawCheck(); say("Added " + f.name, true); }
  catch(e){ say("Could not add: " + errText(e), false); }
}
async function merge(i){
  const f = found[i], row = document.querySelector(`[data-sel="${i}"]`), target = row.value;
  if(!target){ say("Choose the facility to merge " + f.name + " into.", false); return; }
  const fix = document.querySelector(`[data-fix="${i}"]`).checked;
  try{
    const have = facs.find(x => key(x.name) === key(target));
    const al = [...new Set([...(have ? have.aliases : (BUILTIN.find(b => b[0] === target) || [0, []])[1]), ...f.raw])].filter(x => key(x) !== key(target));
    if(have) await update(ref(db, "facilities/" + have.id), { aliases: al });
    else await push(ref(db, "facilities"), { name: target, aliases: al });
    if(fix){
      for(let s = 0; s < f.paths.length; s += 400){
        const up = {}; f.paths.slice(s, s + 400).forEach(p => { up[p] = target; });
        await update(ref(db), up);
      }
    }
    found.splice(i, 1); drawCheck();
    say("Merged " + f.name + " into " + target + (fix ? " and fixed the old records." : "."), true);
  }catch(e){ say("Could not merge: " + errText(e), false); }
}

/* ---------- events ---------- */
$("q").addEventListener("input", render);
$("addBtn").onclick = () => openModal(null);
$("chkBtn").onclick = check;
$("impBtn").onclick = importStandard;
$("mCancel").onclick = closeModal;
$("mSave").onclick = saveModal;
$("modal").addEventListener("click", e => { if(e.target === $("modal")) closeModal(); });
$("mName").addEventListener("keydown", e => { if(e.key === "Enter") $("mAliases").focus(); });
$("mAliases").addEventListener("keydown", e => { if(e.key === "Enter") saveModal(); });
$("tb").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.e) openModal(facs.find(f => f.id === b.dataset.e));
  if(b.dataset.d) del(b.dataset.d);
});
$("checkPanel").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.new !== undefined) addNew(+b.dataset.new);
  if(b.dataset.merge !== undefined) merge(+b.dataset.merge);
});

onAuthStateChanged(auth, user => { if(!user){ window.location.href = "index.html"; return; } load(); });
</script>
<script src="prc-nav.js"></script>
</body>
</html>
