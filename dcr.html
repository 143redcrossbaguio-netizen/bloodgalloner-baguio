<!DOCTYPE html>
<html>
<head>
<title>DCR Entry</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#f4f4f4;color:#222}
header{background:#2e7d32;color:white;text-align:center;padding:15px}
header h2{margin:0}
.container{max-width:1450px;margin:20px auto;padding:0 12px}
.card{background:white;padding:18px 20px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.1);margin-bottom:16px}
.card h3{margin:0 0 12px 0;font-size:16px;color:#1b5e20}
.top{display:grid;grid-template-columns:300px 1fr;gap:20px}
@media(max-width:850px){.top{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.fl{display:block;font-size:12px;font-weight:bold;color:#555;margin-bottom:4px}
label.fl small{font-weight:normal;color:#888}
input,select,textarea{font-family:Arial;font-size:14px;padding:8px;border:1px solid #bbb;border-radius:6px;box-sizing:border-box}
.grid input{width:100%}
textarea{width:100%}
#note{height:112px}
#remarks{height:70px}
button{border:0;border-radius:6px;padding:10px 16px;font-weight:bold;font-size:13px;cursor:pointer;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
.b-green{background:#2e7d32}.b-blue{background:#1565c0}.b-purple{background:#6a1b9a}.b-gray{background:#607d8b}.b-red{background:#c62828}
.status{margin-top:12px;font-size:13px;padding:8px 12px;border-radius:6px;background:#e8f5e9;color:#1b5e20}
.status.warn{background:#fff3e0;color:#bf360c}.status.err{background:#ffebee;color:#b71c1c}
.tblWrap{overflow-x:auto}
table.rows{border-collapse:collapse;width:100%;min-width:1150px}
table.rows th{background:#2e7d32;color:#fff;font-size:12px;padding:8px 6px;text-align:left;white-space:nowrap}
table.rows td{border-bottom:1px solid #e0e0e0;padding:4px;vertical-align:middle}
table.rows td input,table.rows td select{width:100%;padding:6px}
table.rows td.n{width:44px;text-align:center;color:#777;font-size:12px}
.amt{font-weight:bold;text-align:right;padding-right:8px;white-space:nowrap}
.noor input.or{background:#fff8e1;border-color:#ffb300}
tr.lkrow input[readonly]{background:#eef3ee;color:#333;border-color:#d5ddd5}
.x{background:#c62828;padding:6px 10px}
.totalBar{display:flex;justify-content:flex-end;gap:24px;margin-top:12px;font-size:15px}
.totalBar b{font-size:18px;color:#1b5e20}
.empty{text-align:center;color:#888;padding:24px}
.sigGrid{display:grid;gap:8px;margin-top:14px}
details.sigBox{border:1px solid #cfd8dc;border-radius:8px;background:#fafafa}
details.sigBox summary{cursor:pointer;padding:10px 14px;display:flex;gap:14px;align-items:center;font-size:14px;color:#37474f;list-style:none}
details.sigBox summary::-webkit-details-marker{display:none}
details.sigBox summary::before{content:"▶";font-size:11px;color:#2e7d32}
details.sigBox[open] summary::before{content:"▼"}
details.sigBox summary span{color:#666;font-size:13px}
.sigBody{padding:4px 14px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:800px){.sigBody{grid-template-columns:1fr}}
.sigBody input[type=text]{width:100%;margin-bottom:8px}
.sigPrev{height:84px;border:1px dashed #b0bec5;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:8px;color:#90a4ae;font-size:12px}
.sigPrev img{max-height:78px;max-width:95%}
.sigBtns{display:flex;gap:6px;flex-wrap:wrap}
.sigBtns button{padding:7px 10px;font-size:12px}
.chk{font-size:12px;margin-top:8px;display:flex;align-items:center;gap:6px}
.bottomBar{position:sticky;bottom:0;background:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 -2px 10px rgba(0,0,0,.15);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bottomBar button{padding:12px 22px;font-size:14px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:center;justify-content:center}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:10px;padding:18px;width:min(680px,94vw)}
.mbox .btns{display:flex;gap:8px;margin-top:12px}
#padCanvas{width:100%;height:230px;border:1px solid #90a4ae;border-radius:6px;touch-action:none;background:#fff;cursor:crosshair}
</style>
</head>
<body>
<header><h2>DCR Entry</h2></header>

<div class="container">

  <div class="card top">
    <div>
      <label class="fl">NOTE <small>(printed on the last page only if you write one)</small></label>
      <textarea id="note" placeholder="Optional note…"></textarea>
    </div>
    <div>
      <div class="grid">
        <div><label class="fl">DATE</label><input type="date" id="dcrDate"></div>
        <div><label class="fl">CONTROL NUMBER</label><input type="text" id="control" placeholder="BAGUIO-2026"></div>
        <div><label class="fl">CHAPTER</label><input type="text" id="chapter" value="BAGUIO CITY CHAPTER"></div>
      </div>
      <div class="status" id="status">Loading…</div>
    </div>
  </div>

  <div class="card">
    <h3>Collections <small style="color:#777;font-weight:normal">— arranged by OR number (ascending). 🔗 = from Releasing (locked, always the same as Releasing Tracking)</small></h3>
    <div class="tblWrap">
      <table class="rows">
        <thead>
          <tr>
            <th>#</th><th style="width:120px">OR NUMBER</th><th>NAME</th><th>DESCRIPTION</th>
            <th style="width:110px">AMOUNT</th><th style="width:80px">DISCOUNT %</th><th style="width:110px">DISCOUNT ₱</th>
            <th style="width:120px">NET AMOUNT</th><th style="width:170px">MODE OF PAYMENT</th><th></th>
          </tr>
        </thead>
        <tbody id="rowsBody"></tbody>
      </table>
    </div>
    <div style="margin-top:12px"><button class="b-blue" id="addRowBtn">+ ADD ROW</button></div>
    <div class="totalBar"><span>Entries: <b id="cnt">0</b></span><span>Total discount: <b id="totDisc">0.00</b></span><span>TOTAL: <b id="tot">0.00</b></span></div>
    <datalist id="descList"></datalist>
  </div>

  <div class="card">
    <h3>Remarks &amp; Signatories</h3>
    <label class="fl">REMARKS <small>(printed in the remarks box; leave empty to write by hand)</small></label>
    <textarea id="remarks"></textarea>
    <div class="sigGrid" id="sigGrid"></div>
  </div>

  <div class="bottomBar">
    <button class="b-green" id="saveBtn">SAVE DCR</button>
    <button class="b-purple" id="printBtn">PREVIEW / PRINT</button>
    <button class="b-gray" id="xlsBtn">DOWNLOAD EXCEL</button>
  </div>

</div>

<!-- DRAW SIGNATURE -->
<div class="modal" id="padModal">
  <div class="mbox">
    <h3 style="margin:0 0 10px 0">Draw e-signature</h3>
    <canvas id="padCanvas" width="1200" height="460"></canvas>
    <div class="btns">
      <button class="b-green" id="padUse">USE SIGNATURE</button>
      <button class="b-gray" id="padClear">CLEAR</button>
      <button class="b-red" id="padCancel">CANCEL</button>
    </div>
  </div>
</div>

<script src="dcr-common.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, get, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyByh0YJ11ZpbRV7EoDoLnqgFxe1r68efPI",
  authDomain:"galloners-club.firebaseapp.com",
  databaseURL:"https://galloners-club-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"galloners-club",
  storageBucket:"galloners-club.firebasestorage.app",
  messagingSenderId:"213049860421",
  appId:"1:213049860421:web:4156aaa52b945f48711e2c",
  measurementId:"G-XYXJH9JNXJ"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const D = window.DCR;
const $ = id => document.getElementById(id);
const SIGKEYS = [
  { k:"prepared", label:"PREPARED BY" },
  { k:"checked",  label:"CHECKED AND REVIEWED BY" },
  { k:"approved", label:"CHAPTER BOOKKEEPER" }
];

let rows = [];
let signers = JSON.parse(JSON.stringify(D.DEFAULT_SIGNERS));
let sigDefaults = {};          /* saved signer names / titles / e-signatures */
let learned = {};              /* descriptions the system has learned from manual entries */
let createdAt = null, dirty = false, loadedDate = "", loading = true;
let relAll = null;             /* all records of the "releasing" node (live) */
let removed = new Set();       /* releases the user removed from this DCR */
let prices = { WB:0, PRBC:0, PC:0, FFP:0, CRYO:0, BOX:0 }, pricesLoaded = false;
const openSig = new Set();

function setStatus(msg, kind){ const s=$("status"); s.textContent = msg; s.className = "status" + (kind ? " " + kind : ""); }
function markDirty(){ dirty = true; }
const amountOf = r => Math.max(0, D.r2(D.num(r.gross) - D.num(r.discount)));
const defaultControl = date => "BAGUIO-" + ((date||"").slice(0,4) || new Date().getFullYear());
function sortRows(){ rows = rows.map((r,i)=>({r,i})).sort((a,b)=>(D.orKey(a.r.or)-D.orKey(b.r.or))||(a.i-b.i)).map(x=>x.r); }

/* ───────────── rows table ───────────── */
function pctOf(r){ const g = D.num(r.gross); return g > 0 && D.num(r.discount) > 0 ? String(D.r2(D.num(r.discount) / g * 100)) : ""; }
function modeSelect(v){
  const list = D.MODES.includes(v) ? D.MODES : [v, ...D.MODES];
  return `<select data-f="mode">${list.map(m => `<option${m===v?" selected":""}>${D.esc(m)}</option>`).join("")}</select>`;
}
function renderRows(){
  const body = $("rowsBody");
  if(!rows.length){ body.innerHTML = '<tr><td colspan="10" class="empty">Blood releases for this date appear here automatically, or use <b>+ ADD ROW</b>.</td></tr>'; updateTotals(); return; }
  body.innerHTML = rows.map((r,i) => {
    const lk = r.sourceId ? " readonly" : "";
    return `<tr data-i="${i}" class="${r.or ? "" : "noor"}${r.sourceId ? " lkrow" : ""}">
      <td class="n">${r.sourceId ? '<span title="From Releasing Tracking">🔗</span> ' : ""}${i+1}</td>
      <td><input class="or" data-f="or" value="${D.esc(r.or)}" placeholder="OR no."${lk}></td>
      <td><input data-f="name" value="${D.esc(r.name)}" style="text-transform:uppercase"${lk}></td>
      <td><input data-f="desc" value="${D.esc(r.desc)}" style="text-transform:uppercase"${r.sourceId ? lk : ' list="descList"'}></td>
      <td><input type="number" step="0.01" min="0" data-f="gross" value="${r.gross || ""}"${lk}></td>
      <td><input type="number" step="any" min="0" max="100" data-f="pct" value="${pctOf(r)}"${lk}></td>
      <td><input type="number" step="0.01" min="0" data-f="discount" value="${D.num(r.discount) || ""}"${lk}></td>
      <td class="amt" data-f="net">${D.money(amountOf(r))}</td>
      <td>${modeSelect(r.mode)}</td>
      <td><button class="x" data-del="${i}" title="Remove this line">✕</button></td>
    </tr>`;
  }).join("");
  updateTotals();
}
function updateTotals(){
  const total = rows.reduce((a,r) => a + amountOf(r), 0);
  const disc = rows.reduce((a,r) => a + (D.num(r.discount) > 0 ? Math.min(D.num(r.discount), D.num(r.gross)) : 0), 0);
  $("cnt").textContent = rows.filter(r => r.or || r.name || r.desc || D.num(r.gross)).length;
  $("tot").textContent = D.money(total);
  $("totDisc").textContent = D.money(disc);
}
$("rowsBody").addEventListener("input", e => {
  const tr = e.target.closest("tr"); if(!tr || tr.dataset.i === undefined) return;
  const r = rows[+tr.dataset.i], f = e.target.dataset.f; if(!r || !f || r.sourceId && f !== "mode") return;
  markDirty();
  if(f === "or" || f === "name" || f === "desc" || f === "mode"){
    r[f] = e.target.value;
    if(f === "or") tr.classList.toggle("noor", !e.target.value.trim());
  } else if(f === "gross"){
    r.gross = D.num(e.target.value); tr.querySelector('[data-f="pct"]').value = pctOf(r);
  } else if(f === "discount"){
    r.discount = D.num(e.target.value); tr.querySelector('[data-f="pct"]').value = pctOf(r);
  } else if(f === "pct"){
    const p = Math.min(100, Math.max(0, D.num(e.target.value)));
    r.discount = D.r2(D.num(r.gross) * p / 100); tr.querySelector('[data-f="discount"]').value = r.discount || "";
  }
  tr.querySelector('[data-f="net"]').textContent = D.money(amountOf(r));
  updateTotals();
});
/* fill one row's numbers in place (keeps the cursor where it is) */
function refreshRowDom(tr, r){
  tr.querySelector('[data-f="gross"]').value = r.gross || "";
  tr.querySelector('[data-f="pct"]').value = pctOf(r);
  tr.querySelector('[data-f="discount"]').value = D.num(r.discount) || "";
  tr.querySelector('[data-f="mode"]').value = r.mode;
  tr.querySelector('[data-f="net"]').textContent = D.money(amountOf(r));
  updateTotals();
}
/* when a description is finished: use what the system has learned (amount + mode) */
$("rowsBody").addEventListener("change", e => {
  const tr = e.target.closest("tr"); if(!tr || tr.dataset.i === undefined) return;
  const r = rows[+tr.dataset.i], f = e.target.dataset.f; if(!r || r.sourceId) return;
  if(f === "desc"){
    const l = learned[lkey(r.desc)];
    if(l && !D.num(r.gross) && D.num(l.a) > 0){ r.gross = D.num(l.a); if(l.m) r.mode = l.m; refreshRowDom(tr, r); }
  }
});
/* when the cursor leaves the table, put all lines in ascending OR order */
$("rowsBody").addEventListener("focusout", () => {
  setTimeout(() => {
    if($("rowsBody").contains(document.activeElement)) return;
    const before = rows.map(r => r.or).join("|"); sortRows();
    if(before !== rows.map(r => r.or).join("|")) renderRows();
  }, 0);
});
$("rowsBody").addEventListener("click", e => {
  const b = e.target.closest("[data-del]"); if(!b) return;
  const gone = rows.splice(+b.dataset.del, 1)[0]; if(gone && gone.sourceId) removed.add(gone.sourceId);
  markDirty(); renderRows();
});
$("addRowBtn").addEventListener("click", () => {
  rows.push({ sourceId:null, or:"", name:"", desc:"", gross:0, discount:0, mode:"CASH" });
  markDirty(); renderRows();
  const inputs = $("rowsBody").querySelectorAll("tr:last-child input.or"); if(inputs.length) inputs[0].focus();
});

/* ───────────── learning the usual encoded types ───────────── */
const lkey = d => String(d||"").trim().toUpperCase().replace(/[.#$\[\]\/]/g, "_");
function fillDescList(){
  $("descList").innerHTML = Object.values(learned).sort((a,b) => (b.n||0)-(a.n||0)).map(x => `<option value="${D.esc(x.d)}"></option>`).join("");
}
async function loadLearned(){
  try{ learned = (await get(ref(db, "settings/dcrLearned"))).val() || {}; }catch(err){ console.warn("Learned:", err); }
  fillDescList();
}
async function learnFrom(recRows){
  recRows.forEach(r => {
    if(r.sourceId || !r.desc || !(r.gross > 0)) return;
    const k = lkey(r.desc), o = learned[k] || { n:0 };
    learned[k] = { d:r.desc, a:r.gross, m:r.mode, n:(o.n||0) + 1 };
  });
  const keys = Object.keys(learned);
  if(keys.length > 300) keys.sort((a,b)=>(learned[b].n||0)-(learned[a].n||0)).slice(300).forEach(k => delete learned[k]);
  fillDescList();
  try{ await set(ref(db, "settings/dcrLearned"), learned); }catch(err){ console.warn("Could not save learned types:", err); }
}

/* ───────────── automatic sync with Releasing Tracking (blood releases only, NOT augmentation) ───────────── */
function normPrices(s){
  return { WB:Number(s?.WB ?? s?.wb)||0, PRBC:Number(s?.PRBC ?? s?.prbc)||0, PC:Number(s?.PC ?? s?.pc)||0,
           FFP:Number(s?.FFP ?? s?.ffp)||0, CRYO:Number(s?.CRYO ?? s?.cryo)||0, BOX:Number(s?.BOX ?? s?.boxContainer ?? s?.box)||0 };
}
async function ensurePrices(){
  if(pricesLoaded) return;
  try{ prices = normPrices((await get(ref(db,"settings/releasingPrices"))).val() || {}); pricesLoaded = true; }
  catch(err){ console.error("Prices:", err); }
}
/* same computation the Releasing Tracking page uses for AMOUNT PAID */
function releaseAmounts(e){
  const p = e.priceSnapshot ? normPrices(e.priceSnapshot) : prices;
  let total = 0;
  D.arr(e.issued).forEach(i => { const t = String(i.type||"").toUpperCase(), q = Number(i.qty||0); if(p[t] !== undefined) total += q * p[t]; });
  total += (Number(e.boxContainerQty)||0) * (p.BOX||0);
  let waivedItems = D.arr(e.waivedItems);
  if(!waivedItems.length && e.waivedComponent) waivedItems = [{ component:e.waivedComponent, unit:e.waivedUnit }];
  let waived = 0;
  waivedItems.forEach(it => {
    const t = String(it.component||"").trim().toUpperCase(), q = Number(it.unit)||0, key = (t==="BOX CONTAINER"||t==="BOX") ? "BOX" : t;
    if(t && q > 0 && p[key] !== undefined) waived += p[key] * q;
  });
  const freight = Math.max(0, Number(e.freight)||0), misc = Math.max(0, Number(e.misc)||0);
  const gross = Math.max(0, D.r2(total - waived + freight + misc));
  const discount = Math.min(gross, Math.max(0, Number(e.discount)||0));
  return { gross, discount, net: Math.max(0, D.r2(gross - discount)) };
}
function releaseDescription(e){
  const agg = {}, order = [];
  D.arr(e.issued).forEach(i => { const t = String(i.type||"").toUpperCase().trim(), q = Number(i.qty||0); if(!t || q <= 0) return; if(!(t in agg)){ agg[t] = 0; order.push(t); } agg[t] += q; });
  const out = order.map(t => "BPF " + agg[t] + " " + t);
  const box = Number(e.boxContainerQty)||0; if(box > 0) out.push(box + " BOX CONTAINER");
  return out.join(", ");
}
function fromRelease(e, a){
  const name = ((e.surname||"").trim() + ((e.surname && e.firstname) ? ", " : "") + (e.firstname||"").trim()).trim() || (e.facility||"").trim();
  return { or:String(e.or||"").trim(), name:name.toUpperCase(), desc:releaseDescription(e).toUpperCase(), gross:a.gross, discount:a.discount };
}
/* adds new releases, refreshes changed ones and drops cancelled ones, so the DCR always equals Releasing Tracking */
function syncReleases(){
  const date = $("dcrDate").value;
  if(loading || !relAll || !date) return;
  let added = 0, upd = 0, dropped = 0;
  const keep = [];
  rows.forEach(r => {
    if(!r.sourceId){ keep.push(r); return; }
    const e = relAll[r.sourceId];
    if(!e || e.date !== date){ dropped++; return; }
    const a = releaseAmounts(e); if(a.net <= 0){ dropped++; return; }
    const f = fromRelease(e, a);
    if(f.or !== r.or || f.name !== r.name || f.desc !== r.desc || D.num(f.gross) !== D.num(r.gross) || D.num(f.discount) !== D.num(r.discount)){ Object.assign(r, f); upd++; }
    keep.push(r);
  });
  rows = keep;
  const have = new Set(rows.map(r => r.sourceId).filter(Boolean));
  Object.keys(relAll).forEach(id => {
    const e = relAll[id]; if(!e || e.date !== date || have.has(id) || removed.has(id)) return;
    const a = releaseAmounts(e); if(a.net <= 0) return;   /* fully waived / free release: nothing collected */
    rows.push({ sourceId:id, ...fromRelease(e, a), mode:"CASH" }); added++;
  });
  if(added || upd || dropped){
    sortRows(); renderRows();
    const parts = [];
    if(added) parts.push(added + " added");
    if(upd) parts.push(upd + " updated");
    if(dropped) parts.push(dropped + " removed (no longer in Releasing)");
    let msg = "Synced with Releasing Tracking: " + parts.join(", ") + ". Click SAVE DCR (bottom of the page) to keep it.";
    if(rows.some(r => !r.or)) msg += " Some lines have no OR number (highlighted).";
    setStatus(msg);
  }
}

/* ───────────── signatories (collapsible) ───────────── */
function renderSigners(){
  $("sigGrid").innerHTML = SIGKEYS.map(s => {
    const v = signers[s.k];
    return `<details class="sigBox" data-k="${s.k}"${openSig.has(s.k) ? " open" : ""}>
      <summary><b>${s.label}</b><span>${D.esc(v.name)}${v.sig ? " · ✔ e-signature" : ""}</span></summary>
      <div class="sigBody">
        <div>
          <input type="text" data-s="name" value="${D.esc(v.name)}" placeholder="Full name" style="text-transform:uppercase">
          <input type="text" data-s="title" value="${D.esc(v.title)}" placeholder="Position" style="text-transform:uppercase">
          <label class="chk"><input type="checkbox" data-s="showSig" ${v.showSig !== false ? "checked" : ""}> Show signature on printout / Excel</label>
          <p style="font-size:12px;color:#777;margin:8px 0 0">The date under this signature is the date the DCR is printed or downloaded.</p>
        </div>
        <div>
          <div class="sigPrev">${v.sig ? `<img src="${D.esc(v.sig)}" alt="signature">` : "No e-signature"}</div>
          <div class="sigBtns">
            <button class="b-blue" data-act="upload">UPLOAD</button>
            <button class="b-purple" data-act="draw">DRAW</button>
            <button class="b-red" data-act="remove">REMOVE</button>
            <input type="file" accept="image/*" data-file style="display:none">
          </div>
        </div>
      </div></details>`;
  }).join("");
}
$("sigGrid").addEventListener("toggle", e => { const d = e.target; if(d.tagName !== "DETAILS") return; d.open ? openSig.add(d.dataset.k) : openSig.delete(d.dataset.k); }, true);
$("sigGrid").addEventListener("input", e => {
  const box = e.target.closest(".sigBox"); if(!box) return;
  const f = e.target.dataset.s; if(!f) return;
  signers[box.dataset.k][f] = e.target.type === "checkbox" ? e.target.checked : e.target.value; markDirty();
});
$("sigGrid").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if(!b) return;
  const box = b.closest(".sigBox"), k = box.dataset.k;
  if(b.dataset.act === "upload") box.querySelector("[data-file]").click();
  if(b.dataset.act === "draw") openPad(k);
  if(b.dataset.act === "remove"){ signers[k].sig = ""; markDirty(); renderSigners(); }
});
$("sigGrid").addEventListener("change", async e => {
  if(!e.target.matches("[data-file]")) return;
  const f = e.target.files[0]; if(!f) return;
  const k = e.target.closest(".sigBox").dataset.k;
  try{ signers[k].sig = await processSignature(f); signers[k].showSig = true; markDirty(); renderSigners(); }
  catch(err){ alert("Could not read that image. Please use a PNG or JPG picture of the signature."); }
});
function trimAndExport(c){
  const x = c.getContext("2d"), w = c.width, h = c.height, d = x.getImageData(0,0,w,h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){ if(d[(y*w+xx)*4+3] > 20){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1 < 0) return "";
  const pad = 4; x0 = Math.max(0,x0-pad); y0 = Math.max(0,y0-pad); x1 = Math.min(w-1,x1+pad); y1 = Math.min(h-1,y1+pad);
  const o = document.createElement("canvas"); o.width = x1-x0+1; o.height = y1-y0+1;
  o.getContext("2d").drawImage(c, x0, y0, o.width, o.height, 0, 0, o.width, o.height);
  return o.toDataURL("image/png");
}
function processSignature(file){
  return new Promise((res, rej) => {
    const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => {
      const img = new Image(); img.onerror = rej;
      img.onload = () => {
        const k = Math.min(1, 700/img.width, 260/img.height);
        const w = Math.max(1,Math.round(img.width*k)), h = Math.max(1,Math.round(img.height*k));
        const c = document.createElement("canvas"); c.width = w; c.height = h;
        const x = c.getContext("2d"); x.drawImage(img,0,0,w,h);
        const id = x.getImageData(0,0,w,h), p = id.data;
        for(let i=0;i<p.length;i+=4){
          const lum = .299*p[i] + .587*p[i+1] + .114*p[i+2];
          if(lum > 205) p[i+3] = 0; else if(lum > 150) p[i+3] = Math.round(p[i+3] * (205-lum) / 55);
        }
        x.putImageData(id,0,0);
        const out = trimAndExport(c); out ? res(out) : rej(new Error("empty"));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
let padKey = null, drawing = false;
const pad = $("padCanvas"), pctx = pad.getContext("2d");
function padReset(){ pctx.clearRect(0,0,pad.width,pad.height); pctx.lineWidth = 5; pctx.lineCap = "round"; pctx.lineJoin = "round"; pctx.strokeStyle = "#111"; }
function openPad(k){ padKey = k; padReset(); $("padModal").classList.add("on"); }
function padPos(e){ const r = pad.getBoundingClientRect(); return { x:(e.clientX-r.left)*pad.width/r.width, y:(e.clientY-r.top)*pad.height/r.height }; }
pad.addEventListener("pointerdown", e => { drawing = true; pad.setPointerCapture(e.pointerId); const p = padPos(e); pctx.beginPath(); pctx.moveTo(p.x,p.y); pctx.lineTo(p.x+.1,p.y+.1); pctx.stroke(); });
pad.addEventListener("pointermove", e => { if(!drawing) return; const p = padPos(e); pctx.lineTo(p.x,p.y); pctx.stroke(); });
["pointerup","pointercancel"].forEach(t => pad.addEventListener(t, () => { drawing = false; }));
$("padClear").addEventListener("click", padReset);
$("padCancel").addEventListener("click", () => $("padModal").classList.remove("on"));
$("padUse").addEventListener("click", () => {
  const out = trimAndExport(pad);
  if(!out){ alert("Please draw the signature first."); return; }
  signers[padKey].sig = out; signers[padKey].showSig = true; markDirty(); renderSigners();
  $("padModal").classList.remove("on");
});

/* ───────────── build / save / print / excel ───────────── */
function buildRecord(forSave){
  sortRows();
  const date = $("dcrDate").value;
  const lines = rows.filter(r => r.or || r.name || r.desc || D.num(r.gross) > 0).map(r => ({
    sourceId: r.sourceId || null,
    or: String(r.or||"").trim(), name: String(r.name||"").trim().toUpperCase(), desc: String(r.desc||"").trim().toUpperCase(),
    gross: D.r2(D.num(r.gross)), discount: D.r2(Math.min(D.num(r.gross), D.num(r.discount))), amount: amountOf(r),
    mode: String(r.mode||"CASH").trim().toUpperCase()
  }));
  const sg = {};
  SIGKEYS.forEach(s => { const v = signers[s.k]; sg[s.k] = { name:(v.name||"").trim().toUpperCase(), title:(v.title||"").trim().toUpperCase(), showSig:v.showSig !== false }; if(!forSave) sg[s.k].sig = v.sig || ""; });
  return {
    date, control: $("control").value.trim() || defaultControl(date), chapter: $("chapter").value.trim() || "BAGUIO CITY CHAPTER",
    remarks: $("remarks").value.trim(), note: $("note").value.trim(), rows: lines, total: D.r2(lines.reduce((a,r) => a + r.amount, 0)),
    removed: [...removed], signers: sg
  };
}
$("saveBtn").addEventListener("click", async () => {
  const user = auth.currentUser;
  if(!user){ alert("You are not logged in."); location.href = "index.html"; return; }
  const rec = buildRecord(true);
  if(!rec.date){ setStatus("Choose the DCR date first.", "warn"); return; }
  if(!rec.rows.length){ setStatus("Add at least one entry before saving.", "warn"); return; }
  $("saveBtn").disabled = true;
  try{
    rec.createdAt = createdAt || Date.now(); rec.updatedAt = Date.now(); rec.updatedBy = user.email || user.uid;
    await set(ref(db, "dcr/" + rec.date), rec);   /* e-signature pictures are NOT stored here (saves storage) */
    createdAt = rec.createdAt; dirty = false; loadedDate = rec.date;
    try{
      const def = {}; SIGKEYS.forEach(s => def[s.k] = { name:rec.signers[s.k].name, title:rec.signers[s.k].title, sig:signers[s.k].sig || "" });
      await set(ref(db, "settings/dcrSigners"), def); sigDefaults = def;
    }catch(err){ console.warn("Could not save signers:", err); }
    await learnFrom(rec.rows);
    setStatus("DCR for " + D.longDate(rec.date) + " saved — " + rec.rows.length + " entries, total ₱" + D.money(rec.total) + ". You can print or download it from DCR Tracking.");
  }catch(err){
    console.error(err);
    setStatus("Save failed: " + (err.message || err) + (/permission/i.test(String(err.message)) ? " (the database rules need to allow the \"dcr\" path)." : ""), "err");
  }finally{ $("saveBtn").disabled = false; }
});
$("printBtn").addEventListener("click", () => {
  const rec = buildRecord(false);
  if(!rec.date){ setStatus("Choose the DCR date first.", "warn"); return; }
  D.openPrint(rec, false);
});
$("xlsBtn").addEventListener("click", async () => {
  const rec = buildRecord(false);
  if(!rec.date){ setStatus("Choose the DCR date first.", "warn"); return; }
  if(!rec.rows.length){ setStatus("Add at least one entry first.", "warn"); return; }
  $("xlsBtn").disabled = true;
  try{ await D.downloadExcel(rec); setStatus("Downloaded DCR-" + rec.date + ".xlsx"); }
  catch(err){ console.error(err); setStatus(err.message || String(err), "err"); }
  finally{ $("xlsBtn").disabled = false; }
});

/* ───────────── load a date ───────────── */
async function loadDate(date){
  loadedDate = date; dirty = false; createdAt = null; loading = true; removed = new Set();
  if(!date){ rows = []; renderRows(); loading = false; return; }
  setStatus("Loading…");
  try{
    const snap = await get(ref(db, "dcr/" + date));
    if(snap.exists()){
      const raw = snap.val(), rec = D.normalize(raw, sigDefaults);
      createdAt = raw.createdAt || null; removed = new Set(D.arr(raw.removed));
      rows = rec.rows.map(r => ({ ...r }));
      $("control").value = rec.control || defaultControl(date); $("chapter").value = rec.chapter; $("remarks").value = rec.remarks; $("note").value = rec.note;
      signers = rec.signers;
      setStatus("Saved DCR for " + D.longDate(date) + " loaded" + (rec.updatedBy ? " (last saved by " + rec.updatedBy + ")" : "") + ". It stays in sync with Releasing Tracking.");
    } else {
      rows = []; $("control").value = defaultControl(date); $("remarks").value = ""; $("note").value = "";
      signers = JSON.parse(JSON.stringify(D.DEFAULT_SIGNERS));
      SIGKEYS.forEach(s => { const d = sigDefaults[s.k]; if(d) signers[s.k] = { ...signers[s.k], name:d.name || signers[s.k].name, title:d.title || signers[s.k].title, sig:d.sig || "", showSig:true }; });
      setStatus("New DCR for " + D.longDate(date) + ". Blood releases of that day are added automatically.");
    }
  }catch(err){
    console.error(err); setStatus("Could not load: " + (err.message || err), "err"); rows = [];
  }
  sortRows(); renderRows(); renderSigners();
  loading = false;
  syncReleases();
}
$("dcrDate").addEventListener("change", () => {
  const nd = $("dcrDate").value;
  if(dirty && !confirm("You have unsaved changes. Switch date and discard them?")){ $("dcrDate").value = loadedDate; return; }
  loadDate(nd);
});
window.addEventListener("beforeunload", e => { if(dirty){ e.preventDefault(); e.returnValue = ""; } });
["control","chapter","remarks","note"].forEach(id => $(id).addEventListener("input", markDirty));

onAuthStateChanged(auth, async user => {
  if(!user){ location.href = "index.html"; return; }
  const qd = new URLSearchParams(location.search).get("date");
  const date = /^\d{4}-\d{2}-\d{2}$/.test(qd || "") ? qd : D.todayISO();
  $("dcrDate").value = date;
  try{ sigDefaults = (await get(ref(db, "settings/dcrSigners"))).val() || {}; }catch(err){ console.warn(err); }
  await Promise.all([ensurePrices(), loadLearned()]);
  await loadDate(date);
  onValue(ref(db, "releasing"), snap => { relAll = snap.val() || {}; syncReleases(); },
    err => { console.error(err); setStatus("Could not read Releasing records: " + (err.message || err), "err"); });
});
</script>
