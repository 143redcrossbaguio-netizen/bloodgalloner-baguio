<!DOCTYPE html>
<html>
<head>
<title>DCR Tracking</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Arial;background:#f4f4f4;color:#222}
header{background:#2e7d32;color:white;text-align:center;padding:15px}
header h2{margin:0}
.container{max-width:1450px;margin:20px auto;background:white;padding:20px;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:14px}
.filters label{display:block;font-size:12px;font-weight:bold;color:#555;margin-bottom:4px}
input,select{font-family:Arial;font-size:14px;padding:8px;border:1px solid #bbb;border-radius:6px}
button{border:0;border-radius:6px;padding:8px 12px;font-weight:bold;font-size:12px;cursor:pointer;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
.b-green{background:#2e7d32}.b-blue{background:#1565c0}.b-purple{background:#6a1b9a}.b-gray{background:#607d8b}
.tabs{display:flex;margin-bottom:12px}
.tabs button{border-radius:0;background:#cfd8dc;color:#37474f;padding:10px 18px;font-size:13px}
.tabs button:first-child{border-radius:6px 0 0 6px}.tabs button:last-child{border-radius:0 6px 6px 0}
.tabs button.on{background:#2e7d32;color:#fff}
.sum{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:12px;font-size:14px}
.sum b{font-size:18px;color:#1b5e20}
.tblWrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:900px}
th{background:#2e7d32;color:#fff;font-size:12px;padding:10px 8px;text-align:left;white-space:nowrap}
td{border-bottom:1px solid #e0e0e0;padding:9px 8px;font-size:14px;vertical-align:middle}
tr:hover td{background:#f1f8e9}
td.r{text-align:right;font-weight:bold}
td.act{white-space:nowrap}
td.act button{margin-right:4px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#e8f5e9;color:#1b5e20}
.pill.no{background:#fff3e0;color:#bf360c}
.note{font-size:12px;color:#8d6e00;background:#fffde7;border-radius:4px;padding:2px 6px;display:inline-block;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.empty{text-align:center;color:#888;padding:34px}
.foot{font-size:12px;color:#777;margin-top:10px}
</style>
</head>
<body>
<header><h2>DCR Tracking</h2></header>

<div class="container">
  <div class="filters">
    <div><label>YEAR</label><select id="fYear"></select></div>
    <div><label>MONTH</label><select id="fMonth"></select></div>
    <div><label>DESCRIPTION</label><input type="text" id="fDesc" list="descList" placeholder="e.g. BPF 2 WB, CLASSIC…" style="width:200px"></div>
    <div><label>MODE OF PAYMENT</label><select id="fMode"></select></div>
    <div><label>SEARCH (OR no., name)</label><input type="text" id="fSearch" placeholder="Search…" style="width:180px"></div>
    <button class="b-gray" id="refreshBtn">REFRESH</button>
    <button class="b-blue" id="newBtn">+ DCR ENTRY</button>
  </div>
  <datalist id="descList"></datalist>

  <div class="tabs"><button id="tabDcr" class="on">BY DAY</button><button id="tabEnt">ALL ENTRIES</button></div>
  <div class="sum"><span id="sA">Days: <b id="sCount">0</b></span><span>Entries: <b id="sEntries">0</b></span><span>Total collected: <b id="sTotal">0.00</b></span></div>

  <div class="tblWrap"><table><thead id="head"></thead><tbody id="body"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody></table></div>
  <div style="text-align:center;margin-top:12px"><button class="b-gray" id="moreBtn" style="display:none">SHOW MORE</button></div>
  <div class="foot" id="foot"></div>
</div>

<script src="dcr-common.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, get, query, orderByChild, orderByKey, startAt, endAt } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyByh0YJ11ZpbRV7EoDoLnqgFxe1r68efPI",
  authDomain:"galloners-club.firebaseapp.com",
  databaseURL:"https://galloners-club-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"galloners-club",
  storageBucket:"galloners-club.firebasestorage.app",
  messagingSenderId:"213049860421",
  appId:"1:213049860421:web:4156aaa52b945f48711e2c",
  measurementId:"G-XYXJH9JNXJ"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

const D = window.DCR;
const $ = id => document.getElementById(id);
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const PAGE = 200;
let all = [];                 /* one record per day (live releases + finance extras) */
let view = "dcr", shown = PAGE;
const cache = {};
let defs = {}, prices = {}, learnedDesc = [];

(function init(){
  const now = new Date(), cy = now.getFullYear(), ys = [];
  for(let y = cy + 1; y >= 2024; y--) ys.push(y);
  $("fYear").innerHTML = '<option value="">All years</option>' + ys.map(y => `<option>${y}</option>`).join("");
  $("fMonth").innerHTML = '<option value="">All months</option>' + MONTHS.map((m,i) => `<option value="${String(i+1).padStart(2,"0")}">${m}</option>`).join("");
  $("fMode").innerHTML = '<option value="">All modes</option>' + D.MODES.map(m => `<option>${D.esc(m)}</option>`).join("");
  $("fYear").value = String(cy); $("fMonth").value = String(now.getMonth() + 1).padStart(2,"0");   /* opens on the current month */
})();

/* only the chosen period is downloaded (releasing is indexed by date, DCR extras by their date key) */
async function load(force){
  const y = $("fYear").value, m = $("fMonth").value;
  const s = y ? `${y}-${m || "01"}-01` : "", e = y ? `${y}-${m || "12"}-31` : "";
  const ck = s + "|" + e;
  if(!force && cache[ck]){ all = cache[ck]; fillDesc(); shown = PAGE; render(); return; }
  $("body").innerHTML = '<tr><td colspan="8" class="empty">Loading…</td></tr>';
  try{
    const rr = ref(db, "releasing"), dr = ref(db, "dcr");
    const [rs, ds] = await Promise.all([
      get(y ? query(rr, orderByChild("date"), startAt(s), endAt(e)) : rr),
      get(y ? query(dr, orderByKey(), startAt(s), endAt(e)) : dr)
    ]);
    const byDate = {}; 
    rs.forEach(c => { const v = c.val(); if(v && /^\d{4}-\d{2}-\d{2}$/.test(v.date || "")){ (byDate[v.date] = byDate[v.date] || {})[c.key] = v; } });
    const saved = ds.val() || {};
    const dates = [...new Set([...Object.keys(byDate), ...Object.keys(saved)])].filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d));
    const list = dates.map(d => D.buildDay(d, byDate[d] || {}, saved[d] || {}, prices, defs)).filter(r => r.rows.length || (saved[r.date] && Object.keys(saved[r.date]).length));
    cache[ck] = list; all = list; fillDesc(); shown = PAGE; render();
  }catch(err){
    console.error(err);
    $("body").innerHTML = '<tr><td colspan="8" class="empty">Could not load: ' + D.esc(err.message || err) + '<br><small>Make sure the new Firebase rules are published and this is a master account.</small></td></tr>';
  }
}
function fillDesc(){
  const set = new Set(learnedDesc); all.forEach(r => r.rows.forEach(x => { if(x.desc) set.add(x.desc); }));
  $("descList").innerHTML = [...set].sort().map(d => `<option value="${D.esc(d)}"></option>`).join("");
}

function filters(){ return { m:$("fMonth").value, d:$("fDesc").value.trim().toUpperCase(), mode:$("fMode").value, q:$("fSearch").value.trim().toUpperCase() }; }
function rowOk(r, f){
  if(f.d && !r.desc.toUpperCase().includes(f.d)) return false;
  if(f.mode && r.mode !== f.mode) return false;
  if(f.q && !(r.or + " " + r.name).toUpperCase().includes(f.q)) return false;
  return true;
}
function compute(){
  const f = filters(), rf = !!(f.d || f.mode || f.q), out = [];
  all.forEach(rec => {
    if(f.m && rec.date.slice(5,7) !== f.m) return;
    const rows = rf ? rec.rows.filter(r => rowOk(r, f)) : rec.rows;
    if(rf && !rows.length) return;
    out.push({ rec, rows, total: rows.reduce((a,r) => a + r.amount, 0) });
  });
  return out.sort((a,b) => b.rec.date.localeCompare(a.rec.date));
}
function render(){
  const list = compute();
  $("sCount").textContent = list.length; $("sA").style.display = view === "dcr" ? "" : "none";
  $("sEntries").textContent = list.reduce((a,x) => a + x.rows.length, 0);
  $("sTotal").textContent = D.money(list.reduce((a,x) => a + x.total, 0));
  $("tabDcr").classList.toggle("on", view === "dcr"); $("tabEnt").classList.toggle("on", view === "ent");
  $("moreBtn").style.display = "none";
  $("foot").textContent = "Days are built live from Releasing Tracking plus what finance added in DCR Entry. Excel files are named DCR-YYYY-MM-DD.xlsx. Change the Year / Month filter to see other periods.";
  if(view === "dcr"){
    $("head").innerHTML = '<tr><th>DATE</th><th>CONTROL NO.</th><th>ENTRIES</th><th style="text-align:right">TOTAL</th><th>PREPARED BY</th><th>E-SIGNATURES</th><th>NOTE</th><th>ACTIONS</th></tr>';
    if(!list.length){ $("body").innerHTML = '<tr><td colspan="8" class="empty">No DCR for this period.</td></tr>'; return; }
    $("body").innerHTML = list.slice(0, shown).map(({rec:r, rows, total}) => {
      const s = r.signers, n = [s.prepared, s.checked, s.approved].filter(x => x.sig && x.showSig).length;
      return `<tr><td><b>${D.esc(D.longDate(r.date))}</b></td><td>${D.esc(r.control)}</td><td>${rows.length}</td>
        <td class="r">${D.money(total)}</td><td>${D.esc(s.prepared.name)}</td>
        <td><span class="pill ${n === 3 ? "" : "no"}">${n} / 3 signed</span></td>
        <td>${r.note ? `<span class="note" title="${D.esc(r.note)}">📝 ${D.esc(r.note)}</span>` : ""}</td>
        <td class="act"><button class="b-purple" data-a="print" data-d="${r.date}">VIEW / PRINT</button>
          <button class="b-green" data-a="xls" data-d="${r.date}">EXCEL</button>
          <button class="b-blue" data-a="edit" data-d="${r.date}">OPEN</button></td></tr>`;
    }).join("");
    if(list.length > shown) $("moreBtn").style.display = "";
  } else {
    $("head").innerHTML = '<tr><th>DATE</th><th>OR NUMBER</th><th>NAME</th><th>DESCRIPTION</th><th style="text-align:right">AMOUNT</th><th>MODE</th><th>REMARKS</th><th></th></tr>';
    const flat = []; list.forEach(({rec, rows}) => rows.forEach(r => flat.push({ date:rec.date, ...r })));
    if(!flat.length){ $("body").innerHTML = '<tr><td colspan="8" class="empty">No entries found.</td></tr>'; return; }
    $("body").innerHTML = flat.slice(0, shown).map(r => `<tr><td>${D.esc(D.longDate(r.date))}</td><td>${D.esc(r.or)}</td><td>${D.esc(r.name)}</td><td>${D.esc(r.desc)}</td>
      <td class="r">${D.money(r.amount)}</td><td>${D.esc(r.mode)}</td><td>${D.esc(r.remarks)}</td><td><button class="b-blue" data-a="edit" data-d="${r.date}">OPEN</button></td></tr>`).join("");
    if(flat.length > shown) $("moreBtn").style.display = "";
  }
}
function rerender(){ shown = PAGE; render(); }
["fMonth","fMode"].forEach(id => $(id).addEventListener("change", () => { id === "fMonth" && $("fYear").value ? load(false) : rerender(); }));
$("fYear").addEventListener("change", () => load(false));
["fDesc","fSearch"].forEach(id => $(id).addEventListener("input", rerender));
$("tabDcr").addEventListener("click", () => { view = "dcr"; shown = PAGE; render(); });
$("tabEnt").addEventListener("click", () => { view = "ent"; shown = PAGE; render(); });
$("moreBtn").addEventListener("click", () => { shown += PAGE; render(); });
$("refreshBtn").addEventListener("click", () => { Object.keys(cache).forEach(k => delete cache[k]); load(true); });
$("newBtn").addEventListener("click", () => { location.href = "dcr.html"; });

$("body").addEventListener("click", async e => {
  const b = e.target.closest("button[data-a]"); if(!b) return;
  const date = b.dataset.d, rec = all.find(r => r.date === date); if(!rec) return;
  if(b.dataset.a === "edit"){ location.href = "dcr.html?date=" + encodeURIComponent(date); return; }
  if(b.dataset.a === "print") D.openPrint(rec, true);
  if(b.dataset.a === "xls"){
    b.disabled = true;
    try{ await D.downloadExcel(rec); }catch(err){ console.error(err); alert(err.message || err); }
    b.disabled = false;
  }
});

onAuthStateChanged(auth, async user => {
  if(!user){ location.href = "index.html"; return; }
  try{ prices = D.normPrices((await get(ref(db, "settings/releasingPrices"))).val() || {}); }catch(e){}
  try{ defs = (await get(ref(db, "dcrSettings/signers"))).val() || {}; }catch(e){}
  try{ learnedDesc = Object.values((await get(ref(db, "dcrSettings/learned"))).val() || {}).map(x => x.d); }catch(e){}
  load(false);
});
</script>
</body>
</html>
