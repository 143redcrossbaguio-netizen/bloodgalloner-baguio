<!DOCTYPE html>
<html>
<head>
<title>Blood Releasing Entry</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f4f4f4;
}

header{
    background:#ff9800;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

label{
    font-weight:bold;
    margin-top:10px;
    display:block;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

.row{
    display:flex;
    gap:10px;
    align-items:flex-end;
    margin-top:5px;
    flex-wrap:wrap;
}

.row > div{
    flex:1;
    min-width:120px;
}

.row select{flex:2}
.row input{flex:1}

.row button{
    width:auto;
    min-width:45px;
    padding:10px;
    margin-top:0;
}

button{
    width:100%;
    padding:12px;
    margin-top:15px;
    border:none;
    border-radius:5px;
    font-weight:bold;
    cursor:pointer;
}

.save{background:#ff9800;color:white}
.facilityBtn{background:#2e7d32;color:white}

/* ── Facility smart autocomplete ─────────────────────────────────── */
.fac-wrap{position:relative;width:100%;}
.fac-wrap input[type=text]{width:100%;box-sizing:border-box;position:relative;z-index:1;background:transparent;}
.fac-ghost{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;align-items:center;
  padding:0 10px;box-sizing:border-box;
  font-size:inherit;font-family:inherit;letter-spacing:inherit;
  color:#aaa;pointer-events:none;white-space:nowrap;overflow:hidden;
  z-index:0;
}
.fac-dropdown{
  display:none;position:absolute;top:calc(100% + 2px);left:0;width:100%;
  max-height:220px;overflow-y:auto;
  background:#fff;border:1px solid #b0bec5;border-radius:6px;
  z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,0.13);
}
.fac-dropdown.open{display:block;}
.fac-item{padding:9px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid #f0f0f0;color:#1a1a1a;}
.fac-item:last-child{border-bottom:none;}
.fac-item .fac-match{font-weight:bold;color:#b71c1c;}
.fac-item .fac-alias{font-size:11px;color:#888;margin-left:6px;}
.fac-item:hover,.fac-item.fac-active{background:#fce4e4;}
.fac-resolved{
  display:none;font-size:11px;color:#2e7d32;font-style:italic;
  margin-top:2px;
}
.fac-resolved.show{display:block;}
/* ── end facility autocomplete ─────────────────────────────────── */
.trackingBtn{background:#1565c0;color:white}
.back{background:#444;color:white}
.addBtn{background:#2e7d32;color:white}
.removeBtn{background:#c62828;color:white}
.discountBtn{background:#1565c0;color:white}
.waivedBtn{background:#6d4c41;color:white}
.smallBtn{
    width:auto !important;
    min-width:120px !important;
    padding:10px 14px !important;
}

.topButtons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:8px;
}

.topButtons button{
    flex:1;
    min-width:200px;
    margin-top:0;
}

/* ── Live Search Panel ────────────────────────────────────────────── */
.liveSearchPanel{
    background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
    border-radius: 10px;
    padding: 14px 16px 16px;
    margin-bottom: 18px;
    box-shadow: 0 4px 14px rgba(26,35,126,0.18);
}

.liveSearchPanelTitle{
    color: #c5cae9;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.liveSearchPanelTitle::before{
    content: "🔍";
    font-size: 13px;
}

.searchWrap{
    position: relative;
}

#liveSearch{
    width: 100%;
    box-sizing: border-box;
    padding: 11px 14px;
    border: 2px solid #5c6bc0;
    border-radius: 7px;
    font-size: 14px;
    background: #e8eaf6;
    color: #1a237e;
    font-weight: bold;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}

#liveSearch::placeholder{
    color: #7986cb;
    font-weight: normal;
}

#liveSearch:focus{
    border-color: #ffd54f;
    box-shadow: 0 0 0 3px rgba(255,213,79,0.25);
    background: #fff;
}

.searchResults{
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border: 2px solid #5c6bc0;
    border-top: none;
    max-height: 280px;
    overflow: auto;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(26,35,126,0.18);
    border-radius: 0 0 8px 8px;
}

.searchItem{
    padding: 10px 14px;
    border-bottom: 1px solid #e8eaf6;
    cursor: pointer;
}

.searchItem:hover{
    background: #e8eaf6;
}

.searchItem strong{
    display: block;
    color: #1a237e;
    font-size: 14px;
}

.searchMeta{
    font-size: 11px;
    color: #5c6bc0;
    margin-top: 3px;
}

/* Loaded record indicator bar */
.loadedRecordBar{
    display: none;
    margin-top: 10px;
    padding: 9px 12px;
    background: #fff8e1;
    border: 1.5px solid #ffd54f;
    border-radius: 7px;
    font-size: 12px;
    font-weight: bold;
    color: #f57f17;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
}

.loadedRecordBar.show{
    display: flex;
}

.loadedRecordBar .lrb-info{
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
    flex-wrap: wrap;
}

.loadedRecordBar .lrb-label{
    background: #f57f17;
    color: white;
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 11px;
    white-space: nowrap;
}

.loadedRecordBar .lrb-name{
    color: #e65100;
    font-size: 13px;
}

.loadedRecordBar .lrb-clear{
    padding: 5px 12px;
    background: #e53935;
    color: white;
    border: none;
    border-radius: 5px;
    font-weight: bold;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
}

.loadedRecordBar .lrb-clear:hover{
    background: #b71c1c;
}
/* ── end Live Search Panel ──────────────────────────────────────── */

.inline5{
    display:grid;
    grid-template-columns: 1.4fr 1.4fr 0.8fr 0.9fr 0.9fr;
    gap:10px;
    align-items:end;
}

.inline5 > div{
    min-width:0;
}

.sectionSpacer{
    margin-top:8px;
}

/* BLOOD AUGMENTATION */
.augmentationTopBar{
    max-width:900px;
    margin:16px auto 0;
    padding:0 30px;
    box-sizing:border-box;
}

.augmentationToggle{
    position:static;
    width:100%;
    padding:12px 16px;
    background:#1565c0;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

.augmentationPanel{
    position:fixed;
    top:0;
    right:-520px;
    width:500px;
    height:100%;
    background:white;
    box-shadow:-3px 0 12px rgba(0,0,0,0.2);
    transition:right 0.3s ease;
    z-index:999;
    overflow:auto;
    padding:20px;
    box-sizing:border-box;
}

.augmentationPanel.open{
    right:0;
}

.augmentationHeader{
    background:#1565c0;
    color:white;
    padding:12px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
    margin-bottom:15px;
}

.augmentationCard{
    border:1px solid #ccc;
    border-radius:8px;
    padding:15px;
    margin-top:15px;
    background:#fafafa;
}

.innerBox{
    border:1px solid #ddd;
    border-radius:6px;
    padding:10px;
    margin-top:10px;
    background:white;
}

.issuedWarning{
    display:none;
    margin-top:8px;
    padding:10px 12px;
    background:#fff3cd;
    border:1px solid #ffca28;
    border-left:5px solid #f9a825;
    color:#7a4f00;
    border-radius:6px;
    font-size:13px;
    font-weight:bold;
    line-height:1.4;
}

.issuedWarning.show{
    display:block;
}

@media (max-width: 860px){
    .inline5{
        grid-template-columns:1fr 1fr;
    }
}

@media (max-width: 600px){
    .augmentationTopBar{
        margin:12px 12px 0;
        padding:0;
    }

    .container{
        margin:20px 12px;
        padding:20px;
    }

    .inline5{
        grid-template-columns:1fr;
    }

    .topButtons button{
        min-width:unset;
    }
}

/* ============================================================
   RESPONSIVE PHONE + TABLET STYLES (added by Claude)
   ============================================================ */

    html, body { overflow-x: hidden; }
    header { padding: 8px 12px !important; }
    .header-bar { flex-wrap: wrap !important; gap: 8px !important; }
    .header-actions { flex-wrap: wrap !important; gap: 8px !important; width: 100% !important; justify-content: flex-start !important; }
    .header-find-wrap { flex: 1 1 100% !important; min-width: 0 !important; max-width: 100% !important; }
    .header-find-input { width: 100% !important; min-width: 0 !important; font-size: 14px !important; }
    .auth-indicator { min-width: 0 !important; flex: 1 1 auto !important; font-size: 12px !important; padding: 6px 10px !important; }
    .reload-btn { padding: 8px 14px !important; font-size: 13px !important; }

    .form-grid, .serial-batch-grid { grid-template-columns: 1fr !important; gap: 10px !important; }

    }

}
@media (max-width: 640px) {
    header { padding: 8px 10px !important; }
    .header-find-label { font-size: 11px !important; }
    .auth-indicator { font-size: 11px !important; padding: 5px 8px !important; min-width: 0 !important; }
    .reload-btn { padding: 6px 10px !important; font-size: 12px !important; }
    .panel-head { padding: 8px 10px !important; font-size: 12px !important; }
    .panel-body { padding: 8px !important; }
    .btn-row .main-btn, .serial-btn-row .main-btn { flex: 1 1 100% !important; }
    .field-group label { font-size: 12px !important; }
    .collapse-btn { padding: 8px 10px !important; font-size: 13px !important; }
    table { min-width: 500px !important; }
    th, td { padding: 6px 6px !important; font-size: 11px !important; }
    .small-btn { padding: 6px 8px !important; font-size: 11px !important; min-height: 36px; }
}
@media (max-width: 380px) {
    .page { padding: 0 6px 12px !important; }
    header { padding: 6px 8px !important; }
    .auth-indicator { font-size: 10px !important; }
    .field-group label { font-size: 11px !important; }
    button, .main-btn { font-size: 13px !important; }
}
@media (hover: none) and (pointer: coarse) {
    button:hover, .main-btn:hover, .small-btn:hover, .nav-btn:hover, .sub-btn:hover { transform: none !important; }
}

    </style>
</head>

<body>

<header>
<h2>Blood Releasing Entry</h2>
</header>

<div class="augmentationTopBar">
    <button class="augmentationToggle" onclick="toggleAugmentation()">BLOOD AUGMENTATION</button>
</div>

<div class="container">

<div class="topButtons">
    <button class="facilityBtn" onclick="goFacilityManager()">OPEN FACILITY MANAGER</button>
    <button class="trackingBtn" onclick="goTracking()">GO TO TRACKING</button>
</div>

<div class="liveSearchPanel">
    <div class="liveSearchPanelTitle">Live Search — Releasing Tracking Records</div>
    <div class="searchWrap">
        <input type="text" id="liveSearch" placeholder="Search surname, first name, facility, blood type, OR, date…">
        <div id="searchResults" class="searchResults"></div>
    </div>
    <div class="loadedRecordBar" id="loadedRecordBar">
        <div class="lrb-info">
            <span class="lrb-label">✏️ EDITING</span>
            <span class="lrb-name" id="loadedRecordName"></span>
        </div>
        <button class="lrb-clear" id="lrbClearBtn" type="button">✕ Clear &amp; New Entry</button>
    </div>
</div>

<label>DATE</label>
<input type="date" id="date" required>

<label>FACILITY</label>
<div class="fac-wrap" id="facWrapMain">
  <span class="fac-ghost" id="facGhostMain" aria-hidden="true"></span>
  <input type="text" id="facility" placeholder="Type facility name or acronym (e.g. BGHMC, R1MC)" required autocomplete="off">
  <div class="fac-dropdown" id="facDropMain"></div>
</div>
<div class="fac-resolved" id="facResolvedMain"></div>
<datalist id="facilityList"></datalist>

<div class="sectionSpacer"></div>

<div class="inline5">
    <div>
        <label>1. SURNAME</label>
        <input type="text" id="surname" required>
    </div>

    <div>
        <label>2. FIRST NAME</label>
        <input type="text" id="firstname" required>
    </div>

    <div>
        <label>3. AGE</label>
        <input type="number" id="age" required>
    </div>

    <div>
        <label>4. SEX</label>
        <select id="sex" required>
            <option value="">Select</option>
            <option>MALE</option>
            <option>FEMALE</option>
        </select>
    </div>

    <div>
        <label>5. BLOOD TYPE</label>
        <select id="bloodtype" required>
            <option value="">Select</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>
    </div>
</div>

<label>7. REQUEST</label>
<div id="requestContainer">
    <div class="row requestRow">
        <select class="requestType">
            <option>WB</option>
            <option>PRBC</option>
            <option>PC</option>
            <option>FFP</option>
            <option>CRYO</option>
        </select>
        <input type="number" class="requestQty" placeholder="Qty" required>
        <button type="button" class="addBtn" onclick="addRequest()">+</button>
    </div>
</div>

<label>8. ISSUED</label>
<div id="issuedContainer">
    <div class="row issuedRow">
        <select class="issuedType">
            <option>WB</option>
            <option>PRBC</option>
            <option>PC</option>
            <option>FFP</option>
            <option>CRYO</option>
        </select>
        <input type="number" class="issuedQty" placeholder="Qty" required>
        <button type="button" class="addBtn" onclick="addIssued()">+</button>
    </div>
</div>
<div id="issuedWarning" class="issuedWarning"></div>

<label>6A. BOX CONTAINER</label>
<input type="number" id="boxContainerQty" placeholder="Qty">

<label>6. OR</label>
<input type="text" id="or" required>

<label>9. AMOUNT PAID</label>
<div class="row">
    <input type="number" id="amountPaid" readonly>
    <button type="button" class="discountBtn smallBtn" onclick="toggleDiscount()">DISCOUNT</button>
    <button type="button" class="waivedBtn smallBtn" id="waivedBtn" onclick="toggleWaived()">WAIVED</button>
</div>

<div id="waivedSection" style="display:none;">
    <div id="waivedContainer">
        <div class="row waivedRow">
            <div>
                <label>WAIVED COMPONENT</label>
                <select class="waivedComponent" required>
                    <option value="">Select</option>
                    <option>WB</option>
                    <option>PRBC</option>
                    <option>PC</option>
                    <option>FFP</option>
                    <option>CRYO</option>
                    <option>BOX CONTAINER</option>
                </select>
            </div>
            <div>
                <label>WAIVED UNIT</label>
                <input type="number" class="waivedUnit" placeholder="Unit" required>
            </div>
            <button type="button" class="addBtn" onclick="addWaived()">+</button>
        </div>
    </div>
</div>

<div id="discountSection" style="display:none;">
    <label>DISCOUNTED PRICE</label>
    <input type="number" id="discountPrice">

    <label>DISCOUNT %</label>
    <input type="number" id="discountPercent">

    <label>10. DISCOUNT</label>
    <input type="number" id="discount" readonly>
</div>

<button class="save" id="saveBtn">SAVE</button>
<button class="back" onclick="goBack()">BACK TO RELEASING</button>

</div>

<!-- BLOOD AUGMENTATION PANEL -->
<div id="augmentationPanel" class="augmentationPanel">
    <div class="augmentationHeader">BLOOD AUGMENTATION</div>

    <label>DATE</label>
    <input type="date" id="augDate" required>

    <label>FACILITY</label>
    <div class="fac-wrap" id="facWrapAug">
      <span class="fac-ghost" id="facGhostAug" aria-hidden="true"></span>
      <input type="text" id="augFacility" placeholder="Type facility name or acronym (e.g. NDCH, WPDH)" required autocomplete="off">
      <div class="fac-dropdown" id="facDropAug"></div>
    </div>
    <div class="fac-resolved" id="facResolvedAug"></div>

    <label>BOX CONTAINER</label>
    <input type="number" id="augBoxContainerQty" placeholder="Qty">

    <div id="augmentationBloodTypeContainer"></div>

    <button class="addBtn" type="button" onclick="addAugmentationBloodType()">+ ADD BLOOD TYPE</button>

    <label style="margin-top:15px;">AMOUNT PAID</label>
    <div class="row">
        <input type="number" id="augAmountPaid" readonly>
        <button type="button" class="discountBtn smallBtn" onclick="toggleAugDiscount()">DISCOUNT</button>
    </div>

    <div id="augDiscountSection" style="display:none;">
        <label>DISCOUNTED PRICE</label>
        <input type="number" id="augDiscountPrice">

        <label>DISCOUNT %</label>
        <input type="number" id="augDiscountPercent">

        <label>DISCOUNT</label>
        <input type="number" id="augDiscount" readonly>
    </div>

    <label style="margin-top:12px;">ADDRESS (type manually)</label>
    <input type="text" id="augAddress" placeholder="Customer address">

    <label>REMARKS</label>
    <input type="text" id="augRemarks" placeholder="Optional">

    <label style="margin-top:14px;">STATEMENT OF ACCOUNT (auto-filled)</label>
    <div id="orgEditorMount"></div>
    <div class="soaWrap"><div id="soaPreview"></div></div>

    <button class="facilityBtn" id="augSaveBtn" type="button" onclick="saveAugmentation()">SAVE BLOOD AUGMENTATION</button>

    <div id="soaPostSave" class="soaBox" style="display:none;">
      <b>✔ Saved to Releasing Tracking</b> — Invoice <b id="soaSavedInv"></b>
      <label style="margin-top:10px;">PRINTED / PREPARED BY</label>
      <input type="text" id="soaPrintedBy" placeholder="Name of person printing">
      <label>APPROVED BY</label>
      <input type="text" id="soaApprovedBy" placeholder="Name of approver">
      <button class="facilityBtn" type="button" onclick="printSavedSoa()">🖨 PRINT STATEMENT</button>
      <button class="back" type="button" onclick="newAugEntry()">NEW ENTRY</button>
    </div>
    <button class="back" type="button" onclick="toggleAugmentation()">CLOSE</button>
</div>

<style id="soaStyles">
.soaDoc{font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;padding:18px 22px;font-size:12px;box-sizing:border-box;width:100%}
.soaDoc .soaHead{display:flex;align-items:center;gap:14px;border-bottom:2px solid #1a1450;padding-bottom:8px}
.soaDoc .soaHead img{width:70px;height:70px;object-fit:contain}
.soaDoc .soaOrg{flex:1;text-align:center;line-height:1.4}
.soaDoc .soaOrg b{font-size:15px;color:#1a1450}
.soaDoc .soaTitle{text-align:center;font-weight:700;font-size:15px;letter-spacing:2px;margin:12px 0 8px}
.soaDoc .soaMeta{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}
.soaDoc .soaMeta div{line-height:1.8}
.soaDoc .soaMeta .r{text-align:left;min-width:200px}
.soaDoc .ul{display:inline-block;min-width:150px;border-bottom:1px solid #000;padding:0 4px;font-weight:600}
.soaDoc table{width:100%;border-collapse:collapse;table-layout:fixed}
.soaDoc th,.soaDoc td{border:1px solid #000;padding:4px 5px;font-size:11.5px;word-wrap:break-word}
.soaDoc th{background:#eee}
.soaDoc td.n{text-align:right}.soaDoc td.c{text-align:center}
.soaDoc .tot td{font-weight:700;border-top:2px solid #000}
.soaDoc .noB{border:none!important;background:none!important}
.soaDoc .rem{margin-top:12px;min-height:34px}
.soaDoc .soaSign{display:flex;justify-content:space-between;gap:30px;margin-top:26px}
.soaDoc .soaSign div{flex:1;text-align:center}
.soaDoc .soaSign .line{border-top:1px solid #000;margin-top:4px;padding-top:3px;font-size:11px}
.soaDoc .soaSign .nm{min-height:16px;font-weight:700;text-transform:uppercase}
.soaDoc .soaContact{font-size:10.5px;color:#333}
.soaWrap{border:1px dashed #999;border-radius:6px;margin:14px 0;overflow-x:auto}
.soaBox{background:#f4f8ff;border:1px solid #1565c0;border-radius:8px;padding:12px;margin-top:12px}
.soaOrgBar{display:flex;justify-content:flex-end;margin:4px 0}
.soaOrgLink{background:none;border:none;color:#1565c0;font-size:11.5px;text-decoration:underline;cursor:pointer;padding:2px}
.soaOrgEditor{display:none;background:#fffbe6;border:1px solid #d4b106;border-radius:8px;padding:12px;margin:6px 0 14px}
.soaOrgEditor.open{display:block}
.soaOrgEditor label{display:block;font-size:11px;font-weight:600;margin-top:8px}
.soaOrgEditor input{width:100%;box-sizing:border-box;padding:6px 8px;border:1px solid #bbb;border-radius:5px;font-size:12px;margin-top:2px}
.soaOrgEditor .soaOrgActions{margin-top:10px;display:flex;gap:8px}
.soaOrgEditor button{padding:6px 12px;border:none;border-radius:5px;cursor:pointer;font-size:12px}
.soaOrgEditor .soaOrgSave{background:#1565c0;color:#fff}
.soaOrgEditor .soaOrgCancel{background:#ddd;}
</style>

const NAMES={WB:"Whole Blood",PRBC:"Packed Red Blood Cells",PC:"Platelet Concentrate",FFP:"Fresh Frozen Plasma",CRYO:"Cryoprecipitate"};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const LS="soaMemory_v1";
const load=()=>{try{return JSON.parse(localStorage.getItem(LS))||{}}catch(e){return{}}};
const store=d=>{try{localStorage.setItem(LS,JSON.stringify(d))}catch(e){}};

const ORG_LS="soaOrgInfo_v1";
const ORG_DEFAULT={
  name:"PHILIPPINE RED CROSS BAGUIO CITY CHAPTER",
  address:"39 Harrison Rd. Baguio City Chapter",
  tin:"NON-VAT Reg. TIN: 000-804-271-000",
  email1:"bloodservices.redcrossbaguio@gmail.com",
  email2:"baguio@redcross.org.ph",
  mobile:"+639 08 885 2707",
  telephone:""
};
function getOrg(){try{return {...ORG_DEFAULT, ...(JSON.parse(localStorage.getItem(ORG_LS))||{})}}catch(e){return {...ORG_DEFAULT}}}
function setOrg(o){try{localStorage.setItem(ORG_LS,JSON.stringify(o))}catch(e){}}
const ORG_FIELDS=[
  ["name","Organization Name"],["address","Address"],["tin","TIN / VAT line"],
  ["email1","Email 1"],["email2","Email 2"],["mobile","Mobile Number"],["telephone","Telephone (add when available)"]
];
function mountOrgEditor(container){
  const barId="orgBar_"+Math.random().toString(36).slice(2), edId="orgEd_"+Math.random().toString(36).slice(2);
  container.insertAdjacentHTML("beforeend",
    `<div class="soaOrgBar"><button type="button" class="soaOrgLink" id="${barId}">✎ Edit Organization Details</button></div>
     <div class="soaOrgEditor" id="${edId}">
       ${ORG_FIELDS.map(([k,label])=>`<label>${esc(label)}</label><input type="text" data-org="${k}">`).join("")}
       <div class="soaOrgActions">
         <button type="button" class="soaOrgSave">SAVE</button>
         <button type="button" class="soaOrgCancel">CANCEL</button>
       </div>
     </div>`);
  const bar=document.getElementById(barId), ed=document.getElementById(edId);
  const fill=()=>{const o=getOrg();ed.querySelectorAll("[data-org]").forEach(inp=>inp.value=o[inp.dataset.org]||"")};
  bar.addEventListener("click",()=>{fill();ed.classList.toggle("open")});
  ed.querySelector(".soaOrgCancel").addEventListener("click",()=>ed.classList.remove("open"));
  ed.querySelector(".soaOrgSave").addEventListener("click",()=>{
    const o=getOrg();ed.querySelectorAll("[data-org]").forEach(inp=>o[inp.dataset.org]=inp.value.trim());
    setOrg(o);ed.classList.remove("open");
    document.dispatchEvent(new CustomEvent("soaOrgChanged"));
  });
}
const norm=s=>String(s).trim().replace(/\s+/g," ").toLowerCase();
function list(key){return (load()[key]||[]).slice().sort((a,b)=>b.n-a.n||b.t-a.t).map(x=>x.v)}
function remember(key,val){
  val=String(val||"").trim().replace(/\s+/g," ");if(!val)return val;
  const d=load(),arr=d[key]=d[key]||[],f=arr.find(x=>norm(x.v)===norm(val));
  if(f){f.n++;f.t=Date.now();f.v=val}else arr.push({v:val,n:1,t:Date.now()});
  store(d);return val;
}
function attach(input,key){
  if(!input)return;
  const dl=document.createElement("datalist");dl.id="soaDL_"+key+"_"+(input.id||Math.random().toString(36).slice(2));
  input.setAttribute("list",dl.id);input.setAttribute("autocomplete","off");input.after(dl);
  const fill=()=>{dl.innerHTML=list(key).map(v=>`<option value="${esc(v)}">`).join("")};
  fill();input.addEventListener("focus",fill);
  input.addEventListener("input",e=>{
    if(e.inputType&&e.inputType.startsWith("delete"))return;
    const v=input.value;if(!v)return;
    const m=list(key).find(x=>x.length>v.length&&x.toLowerCase().startsWith(v.toLowerCase()));
    if(m){input.value=v+m.slice(v.length);input.setSelectionRange(v.length,m.length)}
  });
  input.addEventListener("blur",()=>{if(input.value.trim())remember(key,input.value)});
}
const money=n=>(Number(n)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
function fmtDate(s){
  const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||"");if(!m)return s||"";
  return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
}
function totals(e,prices){
  prices=prices||{};const rows=[];let gross=0;
  (e.bloodTypes||[]).forEach(bt=>{

let _facilityAliasMap = {}; // normalized-key → canonical name

// Built-in aliases (always available even if not yet in Firebase aliases field)
// Devices that open the site get these from code; Firebase aliases add on top.
const _BUILTIN_ALIASES = [

    aliases:["SLUH","SLU HOSPITAL","SLU HOSP","SLU","S.L.U.H"] },
  { canonical:"BENGUET GENERAL HOSPITAL",
    aliases:["BGH BENGUET","BENGUET GEN HOSP","BENGUET GENERAL","BGH-BENGUET"] },
  { canonical:"PINES CITY DOCTORS HOSPITAL",
    aliases:["PCDH","PINES CITY DOCTORS","PINES DOCTORS","P.C.D.H"] },
  { canonical:"WESTERN PANGASINAN DISTRICT HOSPITAL",
    aliases:["WPDH","WESTERN PANGASINAN","W.P.D.H","WPDC"] },
  { canonical:"EASTERN PANGASINAN DISTRICT HOSPITAL",
    aliases:["EPDH","EASTERN PANGASINAN","E.P.D.H"] },
  { canonical:"ILOCOS TRAINING AND REGIONAL MEDICAL CENTER",
    aliases:["ITRMC","ILOCOS TRAINING","ILOCOS REGIONAL","I.T.R.M.C"] },
  { canonical:"DON MARIANO MARCOS MEMORIAL HOSPITAL",
    aliases:["DMMMH","DON MARIANO MARCOS","D.M.M.M.H"] },
  { canonical:"PHILIPPINE GENERAL HOSPITAL",
    aliases:["PGH","PHIL GENERAL HOSPITAL","P.G.H"] },
  { canonical:"DAGUPAN DOCTORS VILLAFLOR MEMORIAL HOSPITAL",
    aliases:["DDVMH","DAGUPAN DOCTORS","VILLAFLOR MEMORIAL","D.D.V.M.H"] },
];

function _facNormKey(s){
  return String(s||"").toUpperCase().replace(/[\s.\-()&,\/]+/g,"");
}

function _buildAliasMap(names, extraAliases){
  _facilityAliasMap = {};
  // register all canonical names (self-map)
  names.forEach(n => {
    const u = n.toUpperCase().trim();
    _facilityAliasMap[u] = u;
    _facilityAliasMap[_facNormKey(u)] = u;
  });
  // built-in aliases
  _BUILTIN_ALIASES.forEach(entry => {
    const canon = entry.canonical.toUpperCase().trim();
    // only map if canonical is in our list (or add it)
    entry.aliases.forEach(a => {
      const u = a.toUpperCase().trim();
      _facilityAliasMap[u] = canon;
      _facilityAliasMap[_facNormKey(u)] = canon;
    });
    // ensure canonical is self-mapped even if not in Firebase yet
    _facilityAliasMap[canon] = canon;
    _facilityAliasMap[_facNormKey(canon)] = canon;
  });
  // Firebase-stored aliases (per facility node)
  extraAliases.forEach(({canonical, aliases}) => {
    const canon = canonical.toUpperCase().trim();
    (aliases||[]).forEach(a => {
      const u = a.toUpperCase().trim();
      _facilityAliasMap[u] = canon;
      _facilityAliasMap[_facNormKey(u)] = canon;
    });
  });
}

function normalizeFacility(raw){
  if(!raw) return "";
  const upper = raw.toUpperCase().trim();
  if(!upper) return "";
  // 1. exact
  if(_facilityAliasMap[upper]) return _facilityAliasMap[upper];
  // 2. norm key
  const nk = _facNormKey(upper);
  if(_facilityAliasMap[nk]) return _facilityAliasMap[nk];
  // 3. starts-with
  for(const [k,v] of Object.entries(_facilityAliasMap)){
    if(k.length >= 3 && (upper.startsWith(k) || k.startsWith(upper))) return v;
  }
  // 4. substring
  for(const entry of _BUILTIN_ALIASES){
    const canon = entry.canonical.toUpperCase().trim();
    for(const alias of [entry.canonical,...entry.aliases]){
      const a = alias.toUpperCase().trim();
      if(a.length >= 4 && (upper.includes(a) || a.includes(upper))) return canon;
    }
  }
  return upper;
}

function _facBestMatch(typed){
  if(!typed) return "";
  const t = typed.toLowerCase();
  // 1. starts with typed
  let m = _facilityNames.find(n => n.toLowerCase().startsWith(t));
  if(m) return m;
  // 2. any alias/key starts with typed (return its canonical)
  for(const [k,v] of Object.entries(_facilityAliasMap)){
    if(k.length >= 2 && k.toLowerCase().startsWith(t)){
      // return the canonical name
      return v;
    }
  }
  return "";
}

function _facFilterMatches(typed){
  if(!typed) return [];
  const t = typed.toLowerCase();
  const seen = new Set();
  const results = [];
  // names that contain the typed string
  _facilityNames.forEach(n => {
    if(n.toLowerCase().includes(t) && !seen.has(n)){ seen.add(n); results.push({name:n,alias:""}); }
  });
  // aliases that match
  Object.entries(_facilityAliasMap).forEach(([k,v]) => {
    if(k.length < 2) return;
    if(k.toLowerCase().startsWith(t) && !seen.has(v)){
      seen.add(v);
      results.push({name:v, alias:k !== _facNormKey(v) ? k : ""});
    }
  });
  return results.slice(0,12);
}

function _facEsc(s){ return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

function _setupFacAutocomplete(inputId, ghostId, dropId, resolvedId){
  const inp     = document.getElementById(inputId);
  const ghost   = document.getElementById(ghostId);
  const drop    = document.getElementById(dropId);
  const resolved= document.getElementById(resolvedId);
  if(!inp||!ghost||!drop) return;

  let activeIdx = -1;
  let _setupDone = false;

  function syncGhostStyle(){
    if(_setupDone) return; _setupDone = true;
    const cs = window.getComputedStyle(inp);
    ghost.style.paddingLeft  = cs.paddingLeft;
    ghost.style.paddingRight = cs.paddingRight;
    ghost.style.paddingTop   = cs.paddingTop;
    ghost.style.paddingBottom= cs.paddingBottom;
    ghost.style.fontSize     = cs.fontSize;
    ghost.style.fontFamily   = cs.fontFamily;
    ghost.style.fontWeight   = cs.fontWeight;
    ghost.style.lineHeight   = cs.lineHeight;
    inp.style.background     = "transparent";
    inp.style.position       = "relative";
    inp.style.zIndex         = "1";
  }

  function updateGhost(){
    syncGhostStyle();
    const typed = inp.value;
    const best  = _facBestMatch(typed);
    ghost.textContent = (best && typed && best.toLowerCase() !== typed.toLowerCase()) ? best : "";
  }

  function showResolved(canonical){
    if(!resolved) return;
    if(canonical && canonical.toUpperCase() !== inp.value.toUpperCase()){
      resolved.textContent = "→ Will save as: " + canonical;
      resolved.classList.add("show");
    } else {
      resolved.classList.remove("show");
    }
  }

  function renderDrop(){
    const typed   = inp.value;
    const matches = _facFilterMatches(typed);
    activeIdx     = -1;
    if(!typed || !matches.length){ drop.classList.remove("open"); drop.innerHTML=""; return; }
    const t = typed.toLowerCase();
    drop.innerHTML = matches.map((m,i)=>{
      const idx = m.name.toLowerCase().indexOf(t);
      let html = _facEsc(m.name);
      if(idx>=0) html = _facEsc(m.name.slice(0,idx))
        +`<span class="fac-match">${_facEsc(m.name.slice(idx,idx+typed.length))}</span>`
        +_facEsc(m.name.slice(idx+typed.length));
      const aliasTag = m.alias ? `<span class="fac-alias">${_facEsc(m.alias)}</span>` : "";
      return `<div class="fac-item" data-val="${_facEsc(m.name)}" data-idx="${i}">${html}${aliasTag}</div>`;
    }).join("");
    drop.classList.add("open");
  }

  function accept(value){
    inp.value = value;
    ghost.textContent = "";
    drop.classList.remove("open");
    drop.innerHTML = "";
    activeIdx = -1;
    showResolved(normalizeFacility(value));
  }

  inp.addEventListener("input", ()=>{ updateGhost(); renderDrop(); showResolved(normalizeFacility(inp.value)); });

  inp.addEventListener("keydown", e=>{
    const items = drop.querySelectorAll(".fac-item");
    if(e.key==="Tab"||e.key==="Enter"){
      if(drop.classList.contains("open") && activeIdx>=0 && items[activeIdx]){
        e.preventDefault(); accept(items[activeIdx].dataset.val); return;
      }
      const best = _facBestMatch(inp.value);
      if(best && inp.value){
        if(e.key==="Tab") e.preventDefault();
        accept(best); return;
      }
    }
    if(e.key==="ArrowDown"){
      e.preventDefault();
      if(!drop.classList.contains("open")) renderDrop();
      activeIdx = Math.min(activeIdx+1,(drop.querySelectorAll(".fac-item").length)-1);
      drop.querySelectorAll(".fac-item").forEach((el,i)=>el.classList.toggle("fac-active",i===activeIdx));
    }
    if(e.key==="ArrowUp"){
      e.preventDefault();
      activeIdx = Math.max(activeIdx-1,-1);
      drop.querySelectorAll(".fac-item").forEach((el,i)=>el.classList.toggle("fac-active",i===activeIdx));
    }
    if(e.key==="Escape"){ drop.classList.remove("open"); ghost.textContent=""; activeIdx=-1; }
  });

  drop.addEventListener("mousedown", e=>{
    const item = e.target.closest(".fac-item");
    if(item){ e.preventDefault(); accept(item.dataset.val); }
  });

  inp.addEventListener("blur", ()=>{
    setTimeout(()=>{ drop.classList.remove("open"); },150);
    // on blur, show resolved canonical
    showResolved(normalizeFacility(inp.value));
  });

  inp.addEventListener("focus", ()=>{ if(inp.value) renderDrop(); });

  document.addEventListener("click", e=>{
    if(!inp.contains(e.target)&&!drop.contains(e.target)){
      drop.classList.remove("open"); ghost.textContent="";
    }
  });
}

function loadFacilities(){
  onValue(ref(db, "facilities"), (snapshot) => {
    facilityList.innerHTML = "";
    _facilityNames = [];
    const extraAliases = [];

    if(!snapshot.exists()){
      // still build alias map from built-ins even if Firebase has no facilities yet
      _buildAliasMap([], []);
      _setupFacAutocomplete("facility",    "facGhostMain","facDropMain","facResolvedMain");
      _setupFacAutocomplete("augFacility", "facGhostAug", "facDropAug", "facResolvedAug");
      return;
    }

    snapshot.forEach((child) => {
      const data  = child.val();
      const name  = (data.name || "").trim();
      if(!name) return;
      _facilityNames.push(name.toUpperCase());

      // read aliases stored in Firebase (array or comma string)
      if(data.aliases){
        const rawAliases = Array.isArray(data.aliases)
          ? data.aliases
          : String(data.aliases).split(",").map(s=>s.trim()).filter(Boolean);
        if(rawAliases.length) extraAliases.push({canonical:name.toUpperCase(), aliases:rawAliases});
      }

      // keep datalist for fallback
      const option = document.createElement("option");
      option.value = name;
      facilityList.appendChild(option);
    });

    _facilityNames.sort((a,b)=>a.localeCompare(b));
    _buildAliasMap(_facilityNames, extraAliases);

    // Setup autocomplete for both fields (works on any device that opens the site)
    _setupFacAutocomplete("facility",    "facGhostMain","facDropMain","facResolvedMain");
    _setupFacAutocomplete("augFacility", "facGhostAug", "facDropAug", "facResolvedAug");

  }, (error) => {
    console.error("Facility load error:", error);
    // still setup with built-ins only
    _buildAliasMap([], []);
    _setupFacAutocomplete("facility",    "facGhostMain","facDropMain","facResolvedMain");
    _setupFacAutocomplete("augFacility", "facGhostAug", "facDropAug", "facResolvedAug");
  });
}

function safeUpper(value){
  return String(value || "").toUpperCase();
}

function normalizeCompare(value){
  return safeUpper(value).replace(/\s+/g, " ").trim();
}

function isSimilarText(a, b){
  const first = normalizeCompare(a);
  const second = normalizeCompare(b);

  if(first === "" || second === "") return false;
  if(first === second) return true;
  if(first.length >= 4 && second.length >= 4 && (first.includes(second) || second.includes(first))) return true;

  return false;
}

function findSimilarReleasingEntry(entryData){
  return allReleasingEntries.find(item => {
    if(selectedLoadedId && item.id === selectedLoadedId) return false;

    const sameAge = normalizeCompare(item.age) === normalizeCompare(entryData.age);
    const sameSex = normalizeCompare(item.sex) === normalizeCompare(entryData.sex);
    const sameBloodType = normalizeCompare(item.bloodtype) === normalizeCompare(entryData.bloodtype);
    const sameOr = normalizeCompare(item.or) === normalizeCompare(entryData.or);
    const similarSurname = isSimilarText(item.surname, entryData.surname);
    const similarFirstname = isSimilarText(item.firstname, entryData.firstname);

    return similarSurname && similarFirstname && sameAge && sameSex && sameBloodType && sameOr;
  }) || null;
}

function focusNextField(currentField){
  const focusableFields = Array.from(document.querySelectorAll('input:not([type="hidden"]):not([readonly]), select, button'))
    .filter(el => !el.disabled && el.offsetParent !== null && !el.classList.contains("augmentationToggle"));

  const currentIndex = focusableFields.indexOf(currentField);

  if(currentIndex > -1 && currentIndex < focusableFields.length - 1){
    focusableFields[currentIndex + 1].focus();
  }
}

function bindEnterMoveToNextBox(){
  document.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    if(!e.target.matches("input, select")) return;

    e.preventDefault();
    focusNextField(e.target);
  });
}


function collectComponentTotals(rowSelector, typeSelector, qtySelector){
  const totals = {};

  document.querySelectorAll(rowSelector).forEach(row => {
    const typeEl = row.querySelector(typeSelector);
    const qtyEl = row.querySelector(qtySelector);

    if(!typeEl || !qtyEl) return;

    const type = String(typeEl.value || "").toUpperCase().trim();
    const qty = Number(qtyEl.value) || 0;

    if(type !== "" && qty > 0){
      totals[type] = (totals[type] || 0) + qty;
    }
  });

  return totals;
}

function componentListText(totals){
  const list = Object.keys(totals || {}).filter(type => Number(totals[type] || 0) > 0);
  return list.length ? list.join(", ") : "none";
}

function validateRequestedIssuedCompatibility(){
  const warningBox = document.getElementById("issuedWarning");
  if(!warningBox) return true;

  const requestedTotals = collectComponentTotals(".requestRow", ".requestType", ".requestQty");
  const issuedTotals = collectComponentTotals(".issuedRow", ".issuedType", ".issuedQty");
  const strictComponents = ["PC", "FFP", "CRYO"];
  const warnings = [];
  const requestedText = componentListText(requestedTotals);
  const issuedText = componentListText(issuedTotals);

  strictComponents.forEach(type => {
    if((requestedTotals[type] || 0) > 0 && (issuedTotals[type] || 0) <= 0 && issuedText !== "none"){
      warnings.push(`Requested ${type} should be issued as ${type}. Current issued: ${issuedText}.`);
    }
  });

  strictComponents.forEach(type => {
    if((issuedTotals[type] || 0) > 0 && (requestedTotals[type] || 0) <= 0 && requestedText !== "none"){
      warnings.push(`Issued ${type} does not match the requested component/s (${requestedText}). PC, FFP, and CRYO must match exactly.`);
    }
  });

  if(warnings.length){
    warningBox.innerHTML = "⚠️ CHECK ISSUED COMPONENT<br>" + warnings.join("<br>");
    warningBox.classList.add("show");
    return false;
  }

  warningBox.innerHTML = "";
  warningBox.classList.remove("show");
  return true;
}

function renderSearchResults(matches){
  if(!matches.length){
    searchResults.innerHTML = `<div class="searchItem">No matching record found.</div>`;
    searchResults.style.display = "block";
    return;
  }

  searchResults.innerHTML = matches.map(item => `
    <div class="searchItem" data-id="${item.id}">
      <strong>${safeUpper(item.surname)}, ${safeUpper(item.firstname)}</strong>
      <div class="searchMeta">
        DATE: ${item.date || "-"} | FACILITY: ${safeUpper(item.facility)} | BLOOD TYPE: ${item.bloodtype || "-"} | OR: ${safeUpper(item.or)}
      </div>
    </div>
  `).join("");

  searchResults.style.display = "block";

  searchResults.querySelectorAll(".searchItem[data-id]").forEach(el => {
    el.addEventListener("click", () => {
      const found = allReleasingEntries.find(x => x.id === el.dataset.id);
      if(found){
        safeLoadEntry(found.id, found);
      }
    });
  });
}

function performLiveSearch(keyword){
  const term = safeUpper(keyword).trim();

  if(!term){
    searchResults.style.display = "none";
    searchResults.innerHTML = "";
    return;
  }

  const matches = allReleasingEntries.filter(item => {
    const haystack = [
      item.date,
      item.facility,
      item.surname,
      item.firstname,
      item.bloodtype,
      item.or,
      item.sex,
      item.age
    ].map(v => safeUpper(v)).join(" ");

    return haystack.includes(term);
  }).slice(0, 20);

  renderSearchResults(matches);
}

function bindLiveSearch(){
  liveSearchInput.addEventListener("input", (e) => {
    performLiveSearch(e.target.value);
  });

  document.addEventListener("click", (e) => {
    if(!e.target.closest(".searchWrap")){
      searchResults.style.display = "none";
    }
  });
}

function loadTrackingSearchData(){
  onValue(ref(db, "releasing"), (snapshot) => {
    const rows = [];
    if(snapshot.exists()){
      snapshot.forEach(child => {
        rows.push({
          id: child.key,
          ...(child.val() || {})
        });
      });
    }

    allReleasingEntries = rows.sort((a,b) => {
      const aDate = a.date || "";
      const bDate = b.date || "";
      return bDate.localeCompare(aDate);
    });
  }, (error) => {
    console.error("Tracking search load error:", error);
  });
}

function getIssuedComponentQty(componentType){
  if(componentType === "BOX CONTAINER"){
    return Number(document.getElementById("boxContainerQty").value) || 0;
  }

  let qty = 0;

  document.querySelectorAll(".issuedRow").forEach(row => {
    const type = row.querySelector(".issuedType").value;
    const rowQty = Number(row.querySelector(".issuedQty").value) || 0;
    if(type === componentType){
      qty += rowQty;
    }
  });

  return qty;
}

function computeIssuedTotal(){
  let total = 0;

  document.querySelectorAll(".issuedRow").forEach(row => {
    const type = row.querySelector(".issuedType").value;
    const qty = Number(row.querySelector(".issuedQty").value) || 0;

    if(componentPrices[type]){
      total += componentPrices[type] * qty;
    }
  });

  const boxContainerQty = Number(document.getElementById("boxContainerQty").value) || 0;
  total += componentPrices.BOXCONTAINER * boxContainerQty;

  if(waivedActive){
    const usedPerComponent = {};

    document.querySelectorAll(".waivedRow").forEach(row => {
      const componentEl = row.querySelector(".waivedComponent");
      const unitEl = row.querySelector(".waivedUnit");

      if(!componentEl || !unitEl) return;

      const waivedComponent = componentEl.value;
      const enteredWaivedUnit = Number(unitEl.value) || 0;
      const issuedQtyForComponent = getIssuedComponentQty(waivedComponent);
      const alreadyUsed = usedPerComponent[waivedComponent] || 0;
      const remainingAllowed = Math.max(0, issuedQtyForComponent - alreadyUsed);
      const validWaivedUnit = Math.min(enteredWaivedUnit, remainingAllowed);

      if(String(unitEl.value).trim() !== "" && enteredWaivedUnit !== validWaivedUnit){
        unitEl.value = validWaivedUnit;
      }

      const pricePerUnit = waivedComponent === "BOX CONTAINER"
        ? (componentPrices.BOXCONTAINER || 0)
        : (componentPrices[waivedComponent] || 0);

      total -= pricePerUnit * validWaivedUnit;
      usedPerComponent[waivedComponent] = alreadyUsed + validWaivedUnit;
    });
  }

  total = Math.max(0, total);

  document.getElementById("amountPaid").value = total.toFixed(2);
  computeMainDiscountFromPercentOrPrice();
  validateRequestedIssuedCompatibility();
}

function computeMainDiscountFromPrice(){
  const original = Number(document.getElementById("amountPaid").value) || 0;
  const discounted = Number(document.getElementById("discountPrice").value) || 0;

  if(original <= 0){
    document.getElementById("discountPercent").value = "";
    document.getElementById("discount").value = "";
    return;
  }

  const discountAmount = original - discounted;
  const percent = (discountAmount / original) * 100;

  document.getElementById("discountPercent").value = percent.toFixed(2);
  document.getElementById("discount").value = discountAmount.toFixed(2);
}

function computeMainDiscountFromPercent(){
  const original = Number(document.getElementById("amountPaid").value) || 0;
  const percent = Number(document.getElementById("discountPercent").value) || 0;

  const discountAmount = original * (percent / 100);
  const discounted = original - discountAmount;

  document.getElementById("discountPrice").value = discounted.toFixed(2);
  document.getElementById("discount").value = discountAmount.toFixed(2);
}

function computeMainDiscountFromPercentOrPrice(){
  const discountPrice = document.getElementById("discountPrice").value;
  const discountPercent = document.getElementById("discountPercent").value;

  if(discountPrice !== ""){
    computeMainDiscountFromPrice();
  }else if(discountPercent !== ""){
    computeMainDiscountFromPercent();
  }else{
    document.getElementById("discount").value = "";
  }
}

function loadEntryIntoForm(id, entry){
  selectedLoadedId = id || null;
  currentReleasingPriceSnapshot = entry.priceSnapshot ? normalizePriceSnapshot(entry.priceSnapshot) : null;

  document.getElementById("date").value = entry.date || "";
  document.getElementById("facility").value = entry.facility || "";
  document.getElementById("surname").value = entry.surname || "";
  document.getElementById("firstname").value = entry.firstname || "";
  document.getElementById("age").value = entry.age || "";
  document.getElementById("sex").value = entry.sex || "";
  document.getElementById("bloodtype").value = entry.bloodtype || "";
  document.getElementById("or").value = entry.or || "";
  document.getElementById("boxContainerQty").value = entry.boxContainerQty || "";
  document.getElementById("amountPaid").value = entry.amountPaid || "";
  document.getElementById("discount").value = entry.discount || "";

  const waivedItems = Array.isArray(entry.waivedItems) && entry.waivedItems.length > 0
    ? entry.waivedItems
    : (entry.waivedComponent || entry.waivedUnit
        ? [{ component: entry.waivedComponent || "", unit: entry.waivedUnit || "" }]
        : null);

  resetWaivedRows(waivedItems);

  toggleWaived(!!entry.waived);

  const original = Number(entry.amountPaid || 0);
  const discountAmount = Number(entry.discount || 0);

  if(discountAmount > 0){
    document.getElementById("discountSection").style.display = "block";
    document.getElementById("discountPrice").value = (original - discountAmount).toFixed(2);
    document.getElementById("discountPercent").value = original > 0 ? ((discountAmount / original) * 100).toFixed(2) : "";
  }else{
    document.getElementById("discountPrice").value = "";
    document.getElementById("discountPercent").value = "";
    document.getElementById("discount").value = "";
    document.getElementById("discountSection").style.display = "none";
  }

  fillRequestRows(entry.requests);
  fillIssuedRows(entry.issued);
  computeIssuedTotal();
}

async function loadEditEntry(){
  if(!editId) return;

  try{
    const snapshot = await get(ref(db, "releasing/" + editId));

    if(snapshot.exists()){
      loadEntryIntoForm(editId, snapshot.val());
      if(typeof showLoadedRecordBar === "function") showLoadedRecordBar(snapshot.val());
    }
  }catch(error){
    console.error("Load edit error:", error);
    alert("Failed to load entry");
  }
}


function alertAndFocus(element, message){
  alert(message);
  if(element && typeof element.focus === "function") element.focus();
  return false;
}

function isBlankValue(value){
  return String(value ?? "").trim() === "";
}

function requireFieldById(id, label){
  const element = document.getElementById(id);
  if(!element || isBlankValue(element.value)){
    return alertAndFocus(element, `${label} is required.`);
  }
  return true;
}

function requireRowQuantities(rowSelector, qtySelector, label){
  const rows = Array.from(document.querySelectorAll(rowSelector));
  if(!rows.length){
    alert(`At least one ${label} row is required.`);
    return false;
  }

  for(let index = 0; index < rows.length; index++){
    const qtyElement = rows[index].querySelector(qtySelector);
    if(!qtyElement || isBlankValue(qtyElement.value)){
      return alertAndFocus(qtyElement, `${label} quantity is required.`);
    }
  }

  return true;
}

function requireDiscountFields(sectionId, priceId, percentId){
  const section = document.getElementById(sectionId);
  if(!section || section.style.display === "none") return true;

  if(!requireFieldById(priceId, "Discounted price")) return false;
  if(!requireFieldById(percentId, "Discount percent")) return false;

  return true;
}

function validateWaivedRequiredFields(){
  if(!waivedActive) return true;

  const rows = Array.from(document.querySelectorAll(".waivedRow"));
  if(!rows.length){
    alert("At least one waived row is required when WAIVED is active.");
    return false;
  }

  for(let index = 0; index < rows.length; index++){
    const componentElement = rows[index].querySelector(".waivedComponent");
    const unitElement = rows[index].querySelector(".waivedUnit");

    if(!componentElement || isBlankValue(componentElement.value)){
      return alertAndFocus(componentElement, "Waived component is required.");
    }

    if(!unitElement || isBlankValue(unitElement.value)){
      return alertAndFocus(unitElement, "Waived unit is required.");
    }
  }

  return true;
}

function validateMainRequiredFields(){
  if(!requireFieldById("date", "Date")) return false;
  if(!requireFieldById("facility", "Facility")) return false;
  if(!requireFieldById("surname", "Surname")) return false;
  if(!requireFieldById("firstname", "First name")) return false;
  if(!requireFieldById("age", "Age")) return false;
  if(!requireFieldById("sex", "Sex")) return false;
  if(!requireFieldById("bloodtype", "Blood type")) return false;
  if(!requireRowQuantities(".requestRow", ".requestQty", "Request")) return false;
  if(!requireRowQuantities(".issuedRow", ".issuedQty", "Issued")) return false;
  if(!requireFieldById("or", "OR")) return false;
  if(!validateWaivedRequiredFields()) return false;
  if(!requireDiscountFields("discountSection", "discountPrice", "discountPercent")) return false;

  return true;
}

function validateAugmentationRequiredFields(){
  if(!requireFieldById("augDate", "Augmentation date")) return false;
  if(!requireFieldById("augFacility", "Augmentation facility")) return false;

  const cards = Array.from(document.querySelectorAll(".augmentationCard"));
  if(!cards.length){
    alert("Please add at least one blood type for blood augmentation.");
    return false;
  }

  for(let index = 0; index < cards.length; index++){
    const bloodTypeElement = cards[index].querySelector(".augBloodType");
    if(!bloodTypeElement || isBlankValue(bloodTypeElement.value)){
      return alertAndFocus(bloodTypeElement, "Augmentation blood type is required.");
    }

    const requestRows = Array.from(cards[index].querySelectorAll(".augRequestRow"));
    if(!requestRows.length){
      alert("At least one augmentation requested row is required.");
      return false;
    }

    for(let reqIndex = 0; reqIndex < requestRows.length; reqIndex++){
      const qtyElement = requestRows[reqIndex].querySelector(".augRequestQty");
      if(!qtyElement || isBlankValue(qtyElement.value)){
        return alertAndFocus(qtyElement, "Augmentation requested quantity is required.");
      }
    }

    const issuedRows = Array.from(cards[index].querySelectorAll(".augIssuedRow"));
    if(!issuedRows.length){
      alert("At least one augmentation issued row is required.");
      return false;
    }

    for(let issuedIndex = 0; issuedIndex < issuedRows.length; issuedIndex++){
      const qtyElement = issuedRows[issuedIndex].querySelector(".augIssuedQty");
      if(!qtyElement || isBlankValue(qtyElement.value)){
        return alertAndFocus(qtyElement, "Augmentation issued quantity is required.");
      }
    }
  }

  if(!requireDiscountFields("augDiscountSection", "augDiscountPrice", "augDiscountPercent")) return false;

  return true;
}

saveBtn.addEventListener("click", async () => {
  if (!auth.currentUser) {
    alert("You are not logged in.");
    window.location.href = "index.html";
    return;
  }

  if(!validateMainRequiredFields()) return;

  const facilityValue = document.getElementById("facility").value.trim();
  if(facilityValue === ""){
    alert("Facility is required.");
    document.getElementById("facility").focus();
    return;
  }

  const orValue = document.getElementById("or").value.trim();
  if(orValue === ""){
    alert("OR is required.");
    document.getElementById("or").focus();
    return;
  }

  const requests = [];
  document.querySelectorAll(".requestRow").forEach(row => {
    const type = row.querySelector(".requestType").value;
    const qty = row.querySelector(".requestQty").value;
    if(qty !== ""){
      requests.push({ type, qty });
    }
  });

  const issued = [];
  document.querySelectorAll(".issuedRow").forEach(row => {
    const type = row.querySelector(".issuedType").value;
    const qty = row.querySelector(".issuedQty").value;
    if(qty !== ""){
      issued.push({ type, qty });
    }
  });

  const waivedItems = [];
  if(waivedActive){
    document.querySelectorAll(".waivedRow").forEach(row => {
      const component = row.querySelector(".waivedComponent").value;
      const unit = row.querySelector(".waivedUnit").value;
      if(component !== "" && unit !== ""){
        waivedItems.push({ component, unit });
      }
    });
  }

  const priceSnapshotToSave = currentReleasingPriceSnapshot || buildPriceSnapshot();

  const entryData = {
    date: document.getElementById("date").value,
    facility: normalizeFacility(facilityValue),
    surname: document.getElementById("surname").value.toUpperCase(),
    firstname: document.getElementById("firstname").value.toUpperCase(),
    age: document.getElementById("age").value,
    sex: document.getElementById("sex").value,
    bloodtype: document.getElementById("bloodtype").value,
    or: orValue.toUpperCase(),
    boxContainerQty: document.getElementById("boxContainerQty").value || 0,
    requests: requests,
    issued: issued,
    amountPaid: document.getElementById("amountPaid").value,
    discount: document.getElementById("discount").value || 0,
    waived: waivedActive,
    waivedItems: waivedItems,
    waivedComponent: waivedItems[0]?.component || "",
    waivedUnit: waivedItems[0]?.unit || 0,
    priceSnapshot: priceSnapshotToSave
  };

  const similarEntry = findSimilarReleasingEntry(entryData);
  if(similarEntry){
    alert(`Very similar record found. Entry was not saved.\n\nExisting: ${safeUpper(similarEntry.surname)}, ${safeUpper(similarEntry.firstname)} | AGE: ${similarEntry.age || "-"} | SEX: ${similarEntry.sex || "-"} | BLOOD TYPE: ${similarEntry.bloodtype || "-"} | OR: ${safeUpper(similarEntry.or)}`);
    return;
  }

  try {
    if(selectedLoadedId){
      await update(ref(db, "releasing/" + selectedLoadedId), entryData);
      alert("Updated successfully!");
      window.location.href = "releasing-tracking.html";
    }else{
      await push(ref(db, "releasing"), entryData);
      alert("Saved successfully!");
      resetForm();
      liveSearchInput.value = "";
      hideLoadedRecordBar();
    }
  } catch (error) {
    console.error("Save entry error:", error);
    alert("Failed to save entry");
  }
});

function computeAugmentationTotal(){
  let total = 0;

  document.querySelectorAll(".augIssuedRow").forEach(row => {
    const type = row.querySelector(".augIssuedType").value;
    const qty = Number(row.querySelector(".augIssuedQty").value) || 0;

    if(componentPrices[type]){
      total += componentPrices[type] * qty;
    }
  });

  const augBoxContainerQty = Number(document.getElementById("augBoxContainerQty").value) || 0;
  total += componentPrices.BOXCONTAINER * augBoxContainerQty;

  document.getElementById("augAmountPaid").value = total.toFixed(2);
  computeAugDiscountFromPercentOrPrice();
}

function computeAugDiscountFromPrice(){
  const original = Number(document.getElementById("augAmountPaid").value) || 0;
  const discounted = Number(document.getElementById("augDiscountPrice").value) || 0;

  if(original <= 0){
    document.getElementById("augDiscountPercent").value = "";
    document.getElementById("augDiscount").value = "";
    return;
  }

  const discountAmount = original - discounted;
  const percent = (discountAmount / original) * 100;

  document.getElementById("augDiscountPercent").value = percent.toFixed(2);
  document.getElementById("augDiscount").value = discountAmount.toFixed(2);
}

function computeAugDiscountFromPercent(){
  const original = Number(document.getElementById("augAmountPaid").value) || 0;
  const percent = Number(document.getElementById("augDiscountPercent").value) || 0;

  const discountAmount = original * (percent / 100);
  const discounted = original - discountAmount;

  document.getElementById("augDiscountPrice").value = discounted.toFixed(2);
  document.getElementById("augDiscount").value = discountAmount.toFixed(2);
}

function computeAugDiscountFromPercentOrPrice(){
  const discountPrice = document.getElementById("augDiscountPrice").value;
  const discountPercent = document.getElementById("augDiscountPercent").value;

  if(discountPrice !== ""){
    computeAugDiscountFromPrice();
  }else if(discountPercent !== ""){
    computeAugDiscountFromPercent();
  }else{
    document.getElementById("augDiscount").value = "";
  }
}

window.saveAugmentation = async function(){
  if (!auth.currentUser) {
    alert("You are not logged in.");
    window.location.href = "index.html";
    return;
  }

  if(lastSavedAug){ alert("Already saved. Print it or click NEW ENTRY."); return; }
  if(!validateAugmentationRequiredFields()) return;
  if(document.getElementById("augAddress").value.trim()===""){
    alert("Address is required for the statement.");
    document.getElementById("augAddress").focus();
    return;
  }

  const augFacilityValue = document.getElementById("augFacility").value.trim();
  if(augFacilityValue === ""){
    alert("Facility is required.");
    document.getElementById("augFacility").focus();
    return;
  }

  const cards = document.querySelectorAll(".augmentationCard");
  const bloodTypes = [];

  cards.forEach(card => {
    const bloodType = card.querySelector(".augBloodType").value;

    const requests = [];
    card.querySelectorAll(".augRequestRow").forEach(row => {
      const type = row.querySelector(".augRequestType").value;
      const qty = row.querySelector(".augRequestQty").value;
      if(qty !== ""){
        requests.push({ type, qty });
      }
    });

    const issued = [];
    card.querySelectorAll(".augIssuedRow").forEach(row => {
      const type = row.querySelector(".augIssuedType").value;
      const qty = row.querySelector(".augIssuedQty").value;
      if(qty !== ""){
        issued.push({ type, qty });
      }
    });

    if(bloodType !== ""){
      bloodTypes.push({
        bloodType,
        requests,
        issued
      });
    }
  });

  const priceSnapshotToSave = currentAugmentationPriceSnapshot || buildPriceSnapshot();

  const augmentationData = {
    date: document.getElementById("augDate").value,
    facility: normalizeFacility(augFacilityValue),
    boxContainerQty: document.getElementById("augBoxContainerQty").value || 0,
    bloodTypes: bloodTypes,
    amountPaid: document.getElementById("augAmountPaid").value,
    discount: document.getElementById("augDiscount").value || 0,
    priceSnapshot: priceSnapshotToSave,
    address: SOA.remember("address", document.getElementById("augAddress").value),
    remarks: document.getElementById("augRemarks").value.trim()
  };

  try{
    const invYear = (augmentationData.date || getPhilippinesDateString()).slice(0,4);
    const tx = await runTransaction(ref(db, "settings/soaCounter/" + invYear), c => (Number(c) || 0) + 1);
    augmentationData.invoiceNo = `INV-${invYear}-${String(tx.snapshot.val()).padStart(5,"0")}`;
    const newRef = await push(ref(db, "bloodAugmentation"), augmentationData);
    lastSavedAug = { id: newRef.key, ...augmentationData };
    nextInvoiceNo = augmentationData.invoiceNo;
    document.getElementById("soaSavedInv").textContent = nextInvoiceNo;
    document.getElementById("soaPostSave").style.display = "block";
    document.getElementById("augSaveBtn").disabled = true;
    renderSoaPreview();
    document.getElementById("soaPostSave").scrollIntoView({behavior:"smooth"});
  }catch(error){
    console.error("Augmentation save error:", error);
    alert("Failed to save blood augmentation");
  }
};

document.addEventListener("input", function(e){
  if(
    e.target.classList.contains("issuedQty") ||
    e.target.classList.contains("issuedType") ||
    e.target.classList.contains("requestQty") ||
    e.target.classList.contains("requestType") ||
    e.target.id === "boxContainerQty"
  ){
    computeIssuedTotal();
    validateRequestedIssuedCompatibility();
  }

  if(e.target.id === "discountPrice"){
    computeMainDiscountFromPrice();
  }

  if(e.target.id === "discountPercent"){
    computeMainDiscountFromPercent();
  }

  if(
    e.target.classList.contains("waivedComponent") ||
    e.target.classList.contains("waivedUnit")
  ){
    computeIssuedTotal();
  }

  if(
    e.target.classList.contains("augIssuedQty") ||
    e.target.classList.contains("augIssuedType") ||
    e.target.id === "augBoxContainerQty"
  ){
    computeAugmentationTotal();
  }

  if(e.target.id === "augDiscountPrice"){
    computeAugDiscountFromPrice();
  }

  if(e.target.id === "augDiscountPercent"){
    computeAugDiscountFromPercent();
  }
});

/* ───────── SOA (Statement of Account) glue ───────── */
const $ = id => document.getElementById(id);
let lastSavedAug = null;
let nextInvoiceNo = "";
SOA.attach($("augAddress"), "address");
SOA.mountOrgEditor($("orgEditorMount"));
document.addEventListener("soaOrgChanged", renderSoaPreview);
SOA.attach($("soaPrintedBy"), "printedBy");
SOA.attach($("soaApprovedBy"), "approvedBy");

function augYear(){ return ($("augDate").value || getPhilippinesDateString()).slice(0,4); }

async function refreshInvoiceNo(){
  if(lastSavedAug) return;
  const y = augYear();
  try{
    const snap = await get(ref(db, "settings/soaCounter/" + y));
    nextInvoiceNo = `INV-${y}-${String((Number(snap.val()) || 0) + 1).padStart(5,"0")}`;
  }catch(e){ nextInvoiceNo = `INV-${y}-#####`; }
  renderSoaPreview();
}

function collectAugForSoa(){
  const bloodTypes = [];
  document.querySelectorAll(".augmentationCard").forEach(card => {
    const bloodType = card.querySelector(".augBloodType").value;
    const requests = [], issued = [];
    card.querySelectorAll(".augRequestRow").forEach(r => { const q = r.querySelector(".augRequestQty").value; if(q !== "") requests.push({type:r.querySelector(".augRequestType").value, qty:q}); });
    card.querySelectorAll(".augIssuedRow").forEach(r => { const q = r.querySelector(".augIssuedQty").value; if(q !== "") issued.push({type:r.querySelector(".augIssuedType").value, qty:q}); });
    if(bloodType) bloodTypes.push({bloodType, requests, issued});
  });
  return {
    date: $("augDate").value, facility: $("augFacility").value.trim(),
    boxContainerQty: $("augBoxContainerQty").value || 0, bloodTypes,
    discount: $("augDiscount").value || 0, invoiceNo: nextInvoiceNo,
    address: $("augAddress").value.trim(), remarks: $("augRemarks").value.trim(),
    printedBy: $("soaPrintedBy").value.trim(), approvedBy: $("soaApprovedBy").value.trim()
  };
}

function renderSoaPreview(){
  const prices = (lastSavedAug && lastSavedAug.priceSnapshot) || currentAugmentationPriceSnapshot || buildPriceSnapshot();
  $("soaPreview").innerHTML = SOA.build(collectAugForSoa(), prices);
}

const augPanel = $("augmentationPanel");
["input","change"].forEach(ev => augPanel.addEventListener(ev, () => { computeAugmentationTotal(); renderSoaPreview(); }));
augPanel.addEventListener("click", () => setTimeout(renderSoaPreview, 0));
$("augDate").addEventListener("change", refreshInvoiceNo);

const _toggleAug = window.toggleAugmentation;
window.toggleAugmentation = function(){
  _toggleAug();
  if(augPanel.classList.contains("open")) refreshInvoiceNo();
};

window.printSavedSoa = async function(){
  if(!lastSavedAug) return;
  const by = SOA.remember("printedBy", $("soaPrintedBy").value);
  const ap = SOA.remember("approvedBy", $("soaApprovedBy").value);
  if(!by){ alert("Please type the name of the person printing."); $("soaPrintedBy").focus(); return; }
  lastSavedAug.printedBy = by; lastSavedAug.approvedBy = ap;
  try{
    const tx = await runTransaction(ref(db, "bloodAugmentation/" + lastSavedAug.id + "/printCount"), c => (Number(c) || 0) + 1);
    lastSavedAug.printCount = tx.snapshot.val();
    await update(ref(db, "bloodAugmentation/" + lastSavedAug.id), { printedBy: by, approvedBy: ap });
  }catch(e){ console.error("Could not store print names:", e); }
  SOA.print(SOA.build(lastSavedAug, lastSavedAug.priceSnapshot));
};

window.newAugEntry = function(){
  lastSavedAug = null;
  currentAugmentationPriceSnapshot = null;
  $("augDate").value = getPhilippinesDateString();
  ["augFacility","augBoxContainerQty","augAmountPaid","augDiscountPrice","augDiscountPercent","augDiscount","augAddress","augRemarks","soaPrintedBy","soaApprovedBy"].forEach(id => $(id).value = "");
  $("augmentationBloodTypeContainer").innerHTML = "";
  $("augDiscountSection").style.display = "none";
  $("soaPostSave").style.display = "none";
  $("augSaveBtn").disabled = false;
  refreshInvoiceNo();
};
renderSoaPreview();
</script>
